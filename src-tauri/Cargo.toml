[package]
name = "jxcel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "jxcel デスクトップアプリケーション（Tauri v2 アダプタ）"

# ---------------------------------------------------------------------------
# 依存方針（design.md「Allowed Dependencies」・tech.md「Dependency Floors」準拠）
#
# 1. 本クレートは Tauri アダプタであり、`tauri` / `tauri-build` を持つことが役割である。
#    ワークスペース直下の「tauri への依存を持たないこと」という規則は `crates/*` の
#    ドメインクレートに限った規則であり、本クレートはその対象外である。
#    ここに業務ロジックを書かない。ウィンドウ・コマンド・メニュー・補助プロセスのホストは
#    タスク 5.x〜8.x が `app-shell` の機構を呼ぶだけの薄いアダプタとして実装する
#    （structure.md）。本クレートの骨組みはタスク 1.3 が置いた。
# 2. **ファイルシステム系・シェル系のプラグインは依存に入れない**（要件 4.7、決定 3。
#    タスク 1.3 の完了状態）。`core:default` にどちらも含まれず、依存が無ければフロント
#    エンドからの到達経路が存在しない。これが第一の制御であり、
#    `scripts/check-capabilities.sh` が第二の制御である。
#    宣言だけを行い、登録は各依存のコメントに記した所有タスクが行う（1.3 は登録を持たない）。
#
# 3. **ネイティブファイル選択（要件 2.4）の依存はタスク 7.7 が実測して決めた。**
#    実測の内容と理由は `src-tauri/src/dialog.rs` の module doc「依存の選択」にある。要約:
#      (a) `tauri-plugin-dialog` 2.7.3 は `tauri-plugin-fs` 2.5.2 を**非 optional の通常依存**に
#          持ち（プラグインの Cargo.toml で確認）、上の 2 を破る。加えてその Linux 実装は
#          `rfd` 0.16 の GTK3 経路へ委譲し、**その経路は親ウィンドウを無視する**
#          （`gtk_file_chooser_native_new` に NULL を渡す。0.16.0 と 0.17.2 で確認）。
#          両方の理由で宣言しない。
#      (b) `rfd` 直接の GTK3 経路も同じ理由で親を捨てる。XDG ポータル経路は親を渡すが、
#          ダイアログを描くのは別プロセスであり、この環境ではプロセスの外（Wayland）に出る。
#      (c) 採用: **Linux は `gtk`（Tauri が既に解決している 0.18.2 と同じ版。`Cargo.lock` に
#          新しいパッケージは増えない）**の `FileChooserNative` を親付きで提示する。
#          **Windows と macOS は `rfd` 0.17**（`set_parent` が実際に効くのはこの 2 つ）。
#          `tauri-plugin-fs` は依存ツリーに入らず、`tauri-plugin-dialog` も入らない。
# ---------------------------------------------------------------------------
[dependencies]
# Tauri 本体。下限は 2.11.3（tech.md「Dependency Floors」）。2.11.1 の security fix 2 件
# （`AppManifest` 未設定時に自前コマンドの ACL が迂回される問題、Windows における
# `.localhost` サフィックスの origin 混同）と、2.11.3 の起動性能改善より前へ
# ピン留めしない。本スペックが解決する版は 2.11.5（design.md「Technology Stack」）。
tauri = { version = "2.11.3", features = [] }

# Tauri 非依存のコア（design.md「Allowed Dependencies」: `src-tauri/` は
# `crates/app-shell/` にのみ依存し、業務ロジックを持たない）。タスク 5.1 は起動時の
# 残留プロセスの掃除（要件 5.6、コアの `Supervisor::sweep_orphans`）と、起動の前提である
# 設定ストア・診断の保存先の解決（要件 7.2、8.1）でこれを呼ぶ。逆方向の依存は持たない。
app-shell = { path = "../crates/app-shell" }

# Tauri 非依存のコア（design.md「Allowed Dependencies」: `src-tauri/` は `crates/` のドメイン
# クレートにのみ依存し、業務ロジックを持たない）。**本クレート自身は文書を保持しない** —
# 保持・読み込み・未保存の追跡は `document-session` が所有し、ここはその公開面
# （`DocumentSessions`）を `Arc` で 1 実体だけ持ち、境界（コマンド・宿主の連鎖）へ写す。
# 依存方針は `crates/document-session/Cargo.toml` と design.md が定める（本クレートから
# `document-format` への**通常依存は足さない** — 形式を直接使うのはテストだけであり、
# 下の `[dev-dependencies]` にだけ置く）。
document-session = { path = "../crates/document-session" }

# 設定値の形の直列化（タスク 6.3）。`window.geometry` は design.md「Logical Data Model」が
# **オブジェクト**と定めているため、位置とサイズの 4 フィールドを持つ構造体を derive で
# そのまま載せる（`SettingsStore::get/set` は `serde` の型を要求する）。**新しいクレートでは
# ない** — `app-shell` と `tauri` が既に同じ版（1.0.229）を解決しており、本クレートから直接
# 参照するだけである（`Cargo.lock` に新しいパッケージは増えない）。
serde = { version = "1.0", features = ["derive"] }

# 二重起動の制御（要件 1.5）。登録はタスク 5.1 が起動順序の先頭で行う。
# 下限 2.4.3 は macOS のスレッドブロック不具合の修正版（tech.md「Dependency Floors」）。
tauri-plugin-single-instance = "2.4.3"

# 記録機構（要件 8.1、8.5）。登録と保持方針の上書き（既定の 40 KB / KeepOne を捨てて
# 50 MB / 複数世代にする）はタスク 5.2 が行う。
tauri-plugin-log = "2.9.1"

# ---------------------------------------------------------------------------
# ネイティブファイル選択のバックエンド（要件 2.4。タスク 7.7 の判断。上の依存方針 3 を参照）
# ---------------------------------------------------------------------------

# **Linux**: GTK の選択器を親ウィンドウ付きで提示する。`gtk` は tauri（Linux のときのみ）が
# 既に 0.18.2 を解決しているので、本クレートから直接参照しても **`Cargo.lock` に新しい
# パッケージは増えない**（`features = ["v3_24"]` も tauri と同じ指定）。
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }

# **Windows / macOS**: `rfd` のネイティブ選択器を親ウィンドウ付きで提示する。この 2 つの
# バックエンドは `set_parent` を実際に使う。既定 feature（Linux 向けのポータル/GTK3）は
# 不要なので切る。**Linux では宣言しない** — Linux は上の `gtk` を使うので、配布物（Linux）の
# 依存ツリーにも `cargo tree -p jxcel` にも `rfd` は現れない。
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rfd = { version = "0.17", default-features = false }

# **Windows**: メニュー選択の対象ウィンドウを解決するために前面ウィンドウを問い合わせる
# （要件 3.6、7.5。`src-tauri/src/menu.rs` の `is_foreground`）。
#
# tao 0.35.3 の `is_focused` は `is_active && is_focused` であり、Win32 のキーボード
# フォーカスの側は **WebView2 の子ウィンドウがフォーカスを持つ通常の状態で偽になる**
# （親は `WM_KILLFOCUS` を受け取る。`tao-0.35.3/src/platform_impl/windows/window_state.rs` の
# `has_active_focus`）。実測（2026-09-12 の Windows のランナー）: `WM_COMMAND` でメニュー項目を
# 活性化しても対象が `(対象ウィンドウなし)` になった。**利用者が見て「操作対象」であるのは
# 前面のウィンドウ**なので、`GetForegroundWindow` との一致も「フォーカスされている」とみなす。
#
# **`Cargo.lock` に新しいパッケージは増えない** — `tauri` 2.11.5 が同じ版（0.61）を同じ
# feature（`Win32_UI_WindowsAndMessaging`）付きで既に解決している（`tauri` の Cargo.toml の
# `[target."cfg(windows)".dependencies.windows]`）。**Linux / macOS では宣言しない**ので、
# それらのビルドには現れない。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# `tauri_build::build()` の実体。ウィンドウ設定の検証・capability スキーマの生成・
# ACL マニフェストの生成・`externalBin` の複製を担う（BuildPipeline）。
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
# **テストだけが使う**（配布物の依存グラフへ足さない）。`session/host.rs` の連鎖のテストが、
# 引き渡しの成功を観測するために**本物の文書**（一時ディレクトリの `.jxcel`）を作る。
# 本番の経路が形式を直接使うことは無い — 形式を扱うのは `document-session` の内側だけである
# （`cargo tree -p jxcel` に現れないことを受入で示す）。
document-format = { path = "../crates/document-format" }

[features]
# **検証専用の引き金を有効にする（既定では無効）。**
#
# 有効にすると環境変数 `JXCEL_VERIFICATION_EXIT_AFTER_MS` が働き、指定した時間後に
# 「明示的な終了」「意図的なパニック」「補助プロセスの起動」「ウィンドウ生成の失敗」の
# いずれかを起こす（`lifecycle.rs` の `arm_verification_exit_trigger`、`window/mod.rs` の
# `force_creation_failure`）。あわせて `JXCEL_VERIFICATION_INITIAL_SCREEN` が働き、
# **ウィンドウが最初に表示する画面**をフロントエンドの識別子で選べる（3 OS の描画確認 10.4 が
# 実用画面ではない最小画面 `smoke-table` / `smoke-editor` を直接開くための経路。
# `window/mod.rs` の `initial_screen_script`）。
#
# 本スペック（`document-session`）が足したのは `JXCEL_VERIFICATION_SESSION` であり、
# 起動引数のドキュメントへ「読み込み → 1 回の一括の適用 → 保存 → 閉じてよいかの答え」を
# 1 回行わせ、その事実を 1 行ずつ記録する（`session/verification.rs`。要件 8.2、8.3）。
# **配布物（release）に検証専用の環境変数の読み取りを入れない**ため、既定では無効にしてある
# （tasks.md 5.4 の申し送り。7.4 が「終了」メニュー項目を配線したことに伴う片付け）。
#
# 検証時は明示的に有効にする:
#   cargo test  -p jxcel --features verification-triggers
#   cargo build -p jxcel --features verification-triggers
# `cfg(debug_assertions)` では不十分である — 配布物としての実検証（release ビルド）が
# できなくなるため、非既定の feature で括る。
verification-triggers = []
