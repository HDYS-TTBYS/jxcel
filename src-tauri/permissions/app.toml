# 自前コマンドの権限記述（tasks.md 7.3 / 要件 4.7）。
#
# このファイルが存在することが「自前コマンドを権限制御の対象にする」スイッチである。
# ピン留めした tauri 2.11.5 / tauri-build 2.6.3 / tauri-utils 2.9.3 では、`src-tauri/permissions/**/*`
# に権限ファイルが 1 つでもあると `tauri-build` が ACL マニフェストへ `__app-acl__`
# （`tauri_utils::acl::APP_ACL_KEY`）を登録する（`tauri-build/src/acl.rs` の
# `app_manifest_permissions` → `has_app_manifest`）。**自前コマンドは既定では ACL の対象外**で
# あり、この登録が無い限り capability に何を書いても自前コマンドは常に許可される
# （`tauri/src/webview/mod.rs` の "Check ACL on plugin commands, when the app defined its ACL
# manifest" 分岐）。ここで `__app-acl__` を成立させて初めて、capability に無い自前コマンドが
# 実行時に拒否される。
#
# 記述の形は tauri-utils の `PermissionFile`（`acl/manifest.rs`）そのものである:
#   - `[[permission]]` … 個別の権限。識別子は `__app-acl__` の下で**接頭辞を持たない**
#     （プラグインの `fs:...` のような `キー:` を付けない）。
#   - `commands.allow` … 許可する**コマンド名**。Tauri はハンドラの関数識別子をコマンド名に
#     するため、`settings_get` のような関数名をそのまま書く（`allow-settings-get` のような
#     ハイフン形は権限識別子の綴りであってコマンド名ではない）。
#   - `[[set]]` … 複数の権限をまとめた集合。capability からは集合名だけを参照できる。
#
# **ここに列挙するのは現在 `src-tauri/src/commands/` の根が登録しているコマンドだけである。**
# 登録の一覧は `commands/mod.rs` の `command_root!` が単一の源であり、名前は
# `crates/app-shell/src/ipc/command_names.rs` の定数を参照する（tasks.md 2.2）。
# コマンドを登録する後続タスクは、対応する権限をここへ足し、`capabilities/default.json` の
# `app-shell` 集合へ加えること。**足し忘れると `build.removeUnusedCommands` がそのコマンドを
# 配布物から削る**（どの capability からも許可されないため。tasks.md 7.1 の申し送り）。
#
# **`$schema` の行を置かない。** `tauri-build` 2.6.3 はアプリの権限ファイル用のスキーマを
# 生成しない（`tauri_utils::acl::schema::generate_permissions_schema` はプラグイン向けで、
# ビルドからは呼ばれない）。`gen/schemas/*-schema.json` は capability ファイルのスキーマで
# あり、権限ファイルの形（`permission` / `set` キー）を記述していないため、そこを指すと
# エディタが誤った検証結果を出す。自動生成の権限ファイルが `$schema` を持てるのはプラグインの
# 権限ディレクトリに `schemas/schema.json` が生成されるためである。

[[permission]]
identifier = "allow-settings-get"
description = "設定を 1 つ読み取る自前コマンド（settings_get）を許可する。保存できる値の範囲は設定ストアが定めるカタログに限られる（要件 7.1、7.7）。"
commands.allow = ["settings_get"]

[[permission]]
identifier = "allow-settings-set"
description = "設定を 1 つ書き込む自前コマンド（settings_set）を許可する。カタログ外の鍵はコマンド自身が封筒の失敗として返す（要件 7.1、7.6）。"
commands.allow = ["settings_set"]

[[permission]]
identifier = "allow-bulk-echo"
description = "大きなペイロードを 1 回の往復で受け渡す生バイト経路のコマンド（bulk_echo）を許可する。JSON を通らない応答を返す 2 つのコマンドのうちの 1 つである（もう 1 つは生バイトの窓を返す grid_rows_window。要件 4.5）。"
commands.allow = ["bulk_echo"]

[[permission]]
identifier = "allow-can-close-window"
description = "ウィンドウを閉じてよいかをドキュメント所有者へ問い合わせるコマンド（can_close_window）を許可する。呼び出し元ウィンドウは基盤が注入する引数から取るため、フロントエンドはウィンドウを偽装できない（要件 2.6、4.6）。"
commands.allow = ["can_close_window"]

[[permission]]
identifier = "allow-pick-document-file"
description = "親ウィンドウを指定したファイル選択を提示するコマンド（pick_document_file）を許可する。親は基盤が注入するウィンドウから取るためフロントエンドは偽装できず、選ばれた位置は委譲先へ渡すだけで中身は読まない（要件 2.4、4.6、4.7）。"
commands.allow = ["pick_document_file"]

[[permission]]
identifier = "allow-render-heartbeat"
description = "初回描画の通知を受け取るコマンド（render_heartbeat）を許可する。呼び出し元ウィンドウは基盤が注入する引数から取るため、フロントエンドはウィンドウを偽装できず、通知できるのは自分の描画フレームに限られる（要件 4.6、10.1、10.2）。"
commands.allow = ["render_heartbeat"]

[[permission]]
identifier = "allow-diagnostics-log-location"
description = "記録の保存場所を提示するコマンド（diagnostics_log_location）を許可する。応答は解決済みのディレクトリの文字列だけで、場所を開いたり走査したりしない（要件 8.1、4.7）。"
commands.allow = ["diagnostics_log_location"]

[[permission]]
identifier = "allow-diagnostics-export"
description = "記録を 1 つのファイルへ書き出すコマンド（diagnostics_export）を許可する。宛先は Rust 側が決めるため、フロントエンドが任意のパスへ書く経路は生じない（要件 8.6、4.7）。"
commands.allow = ["diagnostics_export"]

[[permission]]
identifier = "allow-diagnostics-verbosity-get"
description = "記録の詳細度を読み取るコマンド（diagnostics_verbosity_get）を許可する。返るのは閉じた列挙の値と、選べる値の全体である（要件 8.7）。"
commands.allow = ["diagnostics_verbosity_get"]

[[permission]]
identifier = "allow-diagnostics-verbosity-set"
description = "記録の詳細度を変更するコマンド（diagnostics_verbosity_set）を許可する。受け付けるのは閉じた列挙の値だけで、任意の文字列は境界を越えられない（要件 8.7）。"
commands.allow = ["diagnostics_verbosity_set"]

[[permission]]
identifier = "allow-window-document-state"
description = "呼び出し元ウィンドウにドキュメントが関連付けられているかを返すコマンド（window_document_state）を許可する。呼び出し元ウィンドウは基盤が注入する引数から取るためフロントエンドはウィンドウを偽装できず、返るのは関連付けの有無だけでパスは境界を越えない（要件 2.1、2.2、4.6）。"
commands.allow = ["window_document_state"]

[[permission]]
identifier = "allow-document-state"
description = "呼び出し元ウィンドウのドキュメントのセッションの状態（名前・出所・未保存・シートの一覧）を返すコマンド（document_state）を許可する。呼び出し元ウィンドウは基盤が注入する引数から取るため偽装できず、名前はファイル名のみで位置は境界を越えない（要件 1.6、1.7、2.1、4.6）。"
commands.allow = ["document_state"]

[[permission]]
identifier = "allow-document-save"
description = "呼び出し元ウィンドウのドキュメントを保存するコマンド（document_save）を許可する。出所を持たない文書の保存先は提示の内側で決まり、選ばれた位置は応答へ含まれない（要件 5.1〜5.4）。"
commands.allow = ["document_save"]

[[permission]]
identifier = "allow-document-new"
description = "呼び出し元ウィンドウに新しいドキュメントを用意するコマンド（document_new）を許可する。未保存の変更があるときは拒否し、その理由を成功腕で返す（要件 7.1〜7.4）。"
commands.allow = ["document_new"]

[[permission]]
identifier = "allow-document-discard"
description = "呼び出し元ウィンドウの未保存の印を落とすコマンド（document_discard）を許可する。保存は行わず、利用者の明示の指示（変更を破棄して閉じる）によってだけ呼ばれる（要件 6.5）。"
commands.allow = ["document_discard"]

[[permission]]
identifier = "allow-grid-open-sheet"
description = "呼び出し元ウィンドウに表示するシートを開くコマンド（grid_open_sheet）を許可する。呼び出し元ウィンドウは基盤が注入する引数から取るため偽装できず、返るのは列の構成と行数だけである（要件 1.1、1.5、1.6、4.6）。"
commands.allow = ["grid_open_sheet"]

[[permission]]
identifier = "allow-grid-set-view"
description = "呼び出し元ウィンドウのグリッドの表示の指定（並べ替え・絞り込み・入れ子の展開）を変えるコマンド（grid_set_view）を許可する。ドキュメントは変更せず、表示の指定はセッションが保持する（要件 8.3、8.4、8.5）。"
commands.allow = ["grid_set_view"]

[[permission]]
identifier = "allow-grid-apply-edit"
description = "呼び出し元ウィンドウのグリッドへ編集命令を適用するコマンド（grid_apply_edit）を許可する。適合しない値も破棄せず違反として成功の応答に載せ、判定は schema-engine が行う（要件 3.3、3.4、3.5）。"
commands.allow = ["grid_apply_edit"]

[[permission]]
identifier = "allow-grid-history"
description = "呼び出し元ウィンドウのグリッドの履歴を進めるコマンド（grid_history）を許可する。進める向きは要求が言い、取り消し・やり直しの対象が無ければ何も変えずに正常な結果を返す（要件 9.2、9.3）。"
commands.allow = ["grid_history"]

[[permission]]
identifier = "allow-grid-find-violation"
description = "呼び出し元ウィンドウのグリッドで次の違反を探すコマンド（grid_find_violation）を許可する。表示範囲の外にある違反にも到達し、見つかった違反の位置と理由を返す（要件 4.2、4.4、4.5）。"
commands.allow = ["grid_find_violation"]

[[permission]]
identifier = "allow-grid-rows-window"
description = "呼び出し元ウィンドウのグリッドの可視範囲の窓を、二進の生バイトで返すコマンド（grid_rows_window）を許可する。引数は要求の頭（シート・開始序数・行数・世代）を含む 1 つのバッファであり、入れ子にすると経路の意味が失われる。失敗と世代違いは空の窓で表し、封筒は運ばない（要件 1.1、4.5、11.2）。"
commands.allow = ["grid_rows_window"]

[[permission]]
identifier = "allow-grid-reference-rows"
description = "参照先のシートの行を頁ごとに読むコマンド（grid_reference_rows）を許可する。参照先は要求ではなく列の宣言（ref の sheet）から決まり、応答は頁に閉じる — 件数は境界の上限（GRID_REFERENCE_PAGE_LIMIT）を超えないため、参照先が 1 万行でも一度に全部を読まない。参照の型でない列と、参照先のシートが文書に無い場合は経路の失敗として返す（要件 3.8、4.6）。"
commands.allow = ["grid_reference_rows"]

[[permission]]
identifier = "allow-diagnostics-record-render"
description = "グリッドの描画の健全性（描画の不成立と、走査の滑らかさの劣化）を診断の記録へ 1 件残すコマンド（diagnostics_record_render）を許可する。運べるのは閉じた札と数値だけで、任意の文字列は境界を越えられない。呼び出し元ウィンドウは基盤が注入する引数から取るため偽装できない（要件 12.2、12.3、4.6）。"
commands.allow = ["diagnostics_record_render"]

[[permission]]
identifier = "allow-macro-list"
description = "呼び出し元ウィンドウのドキュメントが持つマクロの一覧を返すコマンド（macro_list）を許可する。実行はせず、解釈できなかったマクロも理由つきで一覧に残す（マクロ実行の要件 1.3、1.4）。呼び出し元ウィンドウは基盤が注入する引数から取るため偽装できない（要件 4.6）。"
commands.allow = ["macro_list"]

[[permission]]
identifier = "allow-macro-store"
description = "呼び出し元ウィンドウのドキュメントへマクロを 1 件保存するコマンド（macro_store）を許可する。同じ名前のマクロは置き換えであり、保存は document-session の edit の閉包 1 回で行う（未保存の印と版が立つ。要件 1.1、1.5、1.6）。"
commands.allow = ["macro_store"]

[[permission]]
identifier = "allow-macro-delete"
description = "呼び出し元ウィンドウのドキュメントからマクロを 1 件削除するコマンド（macro_delete）を許可する。取り除く相手が無ければ edit を呼ばず、一覧をそのまま返す（版と未保存の印を動かさない。要件 1.7）。"
commands.allow = ["macro_delete"]

[[permission]]
identifier = "allow-macro-run"
description = "呼び出し元ウィンドウのドキュメントに対してマクロを 1 件実行するコマンド（macro_run）を許可する。ソースは文書の中の記録であり、上限は設定から適応層が解決する（要求に載らない）。失敗と打ち切りは成功の応答が 3 値として運び、ファイルとネットワークの利用は宣言された能力の門を通る（要件 2.1〜2.6、6.5、8.1、8.3）。"
commands.allow = ["macro_run"]

[[set]]
identifier = "app-shell"
description = "app-shell が登録する自前コマンドの集合。capability はこの集合名だけを参照する。ファイルシステム系・シェル系の権限はここにも含めない（要件 4.7）。"
permissions = ["allow-settings-get", "allow-settings-set", "allow-bulk-echo", "allow-can-close-window", "allow-pick-document-file", "allow-render-heartbeat", "allow-diagnostics-log-location", "allow-diagnostics-export", "allow-diagnostics-verbosity-get", "allow-diagnostics-verbosity-set", "allow-window-document-state", "allow-document-state", "allow-document-save", "allow-document-new", "allow-document-discard", "allow-grid-open-sheet", "allow-grid-set-view", "allow-grid-apply-edit", "allow-grid-history", "allow-grid-find-violation", "allow-grid-rows-window", "allow-grid-reference-rows", "allow-diagnostics-record-render", "allow-macro-list", "allow-macro-store", "allow-macro-delete", "allow-macro-run"]
