[package]
name = "app-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "jxcel アプリケーションシェルの中核（Tauri 非依存のドメインクレート）"

# ---------------------------------------------------------------------------
# 依存方針（design.md「Allowed Dependencies」・structure.md 準拠）
#
# 1. tauri 禁止: 本クレートは Tauri に依存してはならない。推移的依存も不可であり、
#    `cargo tree -p app-shell` のどこにも tauri が現れてはならない。本クレートが所有する
#    機構（補助プロセスの監督・同梱物の整合性検査・設定の原子的書き込み・
#    ショートカット競合検査・診断方針）は、GUI を起動せずにテストできなければならない
#    （structure.md「Rust ドメインクレート」「Tauri を必要とするスペックは 2 つに割る」）。
# 2. 他の jxcel ドメインクレートへの依存禁止: roadmap における本スペックの依存は none で
#    あり、document-format をはじめとする他のドメインクレートに依存しない。
# 3. 実依存の集合はタスク 1.2 が確定させた（型生成は tech.md「Key Libraries」の
#    `ts-rs` を採り、`tauri-specta` は却下済み。決定 1）。
# ---------------------------------------------------------------------------
[dependencies]
# 設定の永続化（要件 7.1〜7.7）と、境界を越える型の直列化（要件 4.2）で使う。
serde = { version = "1.0", features = ["derive"] }
# 設定ファイルの表現（design.md「SettingsStore」）。
serde_json = "1.0"
# 失敗の原因を区別できる列挙（要件 4.4、5.4）を導出する。
thiserror = "2.0"
# 実行時の整合性検査（要件 5.3、tasks.md 3.1）で、解決した補助プロセスのファイルの
# SHA-256 を計算する。`build.rs` も同じクレートをビルド時依存として使う（下の
# `[build-dependencies]` を参照）— build スクリプトは通常依存を参照できないため、
# 同じクレートを両方に宣言する。Cargo は同一の解決版を共有する。
sha2 = "0.10"
# 境界を越える型の TypeScript 生成。design.md「Technology Stack」が 12.0.1 を、
# research.md 決定 1 が `tauri-specta` の却下を確定させている。
# `serde-compat`（12.0.1 の既定 feature）は serde の `rename` / `tag` 属性を生成結果へ
# 反映するために必須である（design.md「IpcContract」の `IpcResult` が `#[serde(tag = ...)]`
# を使う）。derive マクロは `ts-rs` 本体が再輸出するため、追加の feature は要らない。
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

# ダイジェスト算出はビルド時の仕事である。design.md「SidecarIntegrity」は同梱元ファイルの
# SHA-256 を `build.rs` が計算しコンパイル時定数として埋め込むことを要求するため、
# 実行時依存ではなくビルド時依存に分ける（tasks.md 1.2 / 3.1）。
[build-dependencies]
sha2 = "0.10"

# プラットフォーム別の依存は条件付きコンパイルで切る。他方のプラットフォームのビルドには
# これらのクレートが一切現れない（tasks.md 1.2、design.md「Core プラットフォーム」）。
[target.'cfg(windows)'.dependencies]
# 補助プロセスの終了保証（要件 5.6、research.md 決定 5）と残留プロセスの掃除（tasks.md 3.5）。
# features は使う API に必要な最小集合である:
#   - Win32_System_JobObjects: CreateJobObjectW / SetInformationJobObject /
#     AssignProcessToJobObject / TerminateJobObject / QueryInformationJobObject と JOBOBJECT_* 型
#   - Win32_System_Threading: CREATE_NEW_PROCESS_GROUP（穏やかな終了の宛先になる
#     プロセスグループを作る作成フラグ）、および残留の掃除の OpenProcess /
#     QueryFullProcessImageNameW / TerminateProcess / GetExitCodeProcess / WaitForSingleObject
#   - Win32_System_Console: GenerateConsoleCtrlEvent / CTRL_BREAK_EVENT（猶予段の穏やかな終了）
#   - Win32_System_Diagnostics + Win32_System_Diagnostics_ToolHelp: 残留の掃除の列挙
#     （CreateToolhelp32Snapshot / Process32FirstW / Process32NextW / PROCESSENTRY32W /
#     TH32CS_SNAPPROCESS）。`ToolHelp` モジュールは親の `Win32_System_Diagnostics` を要求する。
#   - Win32_Security: CreateJobObjectW が取る SECURITY_ATTRIBUTES
# `Win32_System_JobObjects` は Win32_System → Win32 → Win32_Foundation を引き込むため、
# HANDLE / CloseHandle / STILL_ACTIVE のために Foundation を明示する必要はない
# （0.61.2 の feature 依存を windows-sys の Cargo.toml で確認した）。
windows-sys = { version = "0.61", features = [
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# プロセスグループと killpg によるサイドカーの終了保証（要件 5.6、research.md 決定 5）。
# 孫プロセスまで届かせるために setsid / killpg を使う。既定 feature のみで足りる。
libc = "0.2"

[lib]
name = "app_shell"
path = "src/lib.rs"
