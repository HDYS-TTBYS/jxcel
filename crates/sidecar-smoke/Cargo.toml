[package]
name = "sidecar-smoke"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "jxcel 補助プロセス機構の検証専用ヘルパー（配布しない）"

# ---------------------------------------------------------------------------
# 依存方針（design.md「Out of Boundary」・structure.md 準拠）
#
# 1. 本クレートは検証専用の最小実行ファイルである。実用的な補助プロセス
#    （言語サーバ等）が存在しない時点で、同梱・整合性検査・起動・共有・終了保証の
#    各機構を実プロセスで検証するための相手役であり、配布物には含めない。
# 2. スペックに対応しない補助クレートであるため、スペック名と衝突しない名前にする
#    （structure.md「Naming Conventions」: `.kiro/specs/` に対応物がないことが
#    名前から分かること）。
# 3. tauri には依存しない（`crates/` 配下のドメインクレートに適用される規則。
#    ワークスペース直下の依存ポリシーを参照）。
# 4. 親プロセスの監視と標準出力への応答が本クレートの役割のすべてである。プロトコル・
#    JSON・引数解析フレームワーク・記録機構・設定読み取り・その他の「実用的な機能」を
#    足してはならない（design.md「Out of Boundary」）。依存も監視に必要な最小限に限る。
# 5. プラットフォーム別依存は条件付きコンパイルで切る。他方のプラットフォームのビルドには
#    これらのクレートが一切現れない（crates/app-shell がタスク 1.2 で採った形を踏襲する）。
# ---------------------------------------------------------------------------
[dependencies]

[target.'cfg(unix)'.dependencies]
# 親の生存確認（`kill(pid, 0)`）と、自身が監視対象から reparent されたかの確認
# （`getppid()`）に使う。`/proc` を持たない macOS でも同じ経路が動く（main.rs の
# `parent_alive` を参照）。既定 feature のみで足りる。
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# 親の終了をプロセスハンドルで待つ（`OpenProcess` + `WaitForSingleObject`）ために使う。
# features は必要な最小集合である:
#   - Win32_Foundation: HANDLE / CloseHandle / WAIT_OBJECT_0 / WAIT_TIMEOUT
#   - Win32_System_Threading: OpenProcess / WaitForSingleObject / PROCESS_SYNCHRONIZE
#   - Win32_System_Console: SetConsoleCtrlHandler / BOOL（`--ignore-term` の検証専用オプション。
#     猶予段の CTRL_BREAK_EVENT を無視し、強制段でのみ終了することを確かめるために使う）
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }
