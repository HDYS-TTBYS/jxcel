      # ---------------------------------------------------------------------
      # 補助プロセスの終了保証の検証（tasks.md 10.7 / 要件 5.6）
      #
      # 3 条件を 3 OS それぞれで実測する。**残存プロセス数が 0 であることがこの段の出力に現れる**:
      #
      #   (a) 通常終了        — `sidecar:<ms>` で補助プロセスを起動し、通常終了した後に残存 0
      #   (b) 強制終了        — `sidecar:<ms>` で起動し、アプリを強制終了した後に残存 0。
      #                         **こちらが本番の経路である**（異常終了では終了処理が走らない）
      #   (c) 孫あり・通常終了 — `sidecar-grandchild:<ms>` で補助プロセスに孫を作らせ、通常終了の
      #                         後に残存 0（**3.3 のプロセスグループ / Job Object が孫まで届く**）
      #   (d) 補助: 孫あり・強制終了 → 親監視の届かない孫を次回起動の掃除（3.5）が除去する
      #
      # ## どの機構が何を保証するか（3.3 / 3.5 / 5.6 の実装に基づく）
      #
      #   - **通常終了**: 5.6 の `RunEvent::Exit` → `shutdown_all` が、3.3 の機構（Unix は
      #     `setpgid` したプロセスグループへの `killpg`、Windows は Job Object の
      #     `TerminateJobObject`）で**孫まで**終了させる。(c) がこれを直接確かめる。
      #   - **強制終了（Unix / macOS）**: `RunEvent::Exit` が届かず `killpg` も走らない。実効的な
      #     機構は**補助プロセス自身の親監視**（1.6 / 3.5 が注入する `--parent-pid`）だけである。
      #     検出間隔は `crates/sidecar-smoke` の `POLL_INTERVAL` = 100 ms。**(b) がこれを確かめる。**
      #     孫は親監視を持たない（`--idle`。3.3 の注記）ため強制終了の後に残り得る。それを
      #     終わらせるのは**3.5 の起動時の掃除だけ**であり、**(d) がそれを確かめる**。
      #   - **強制終了（Windows）**: Job Object の `JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE` を
      #     **カーネルが強制する**（アプリの異常終了後も有効な唯一の機構。3.3）。孫もジョブに入る
      #     ので、(b) と (d) の双方で残存 0 になる。
      #   - **macOS の掃除**: `ps -axo pid=,comm=` の**名前照合**だけに頼る。`comm` はカーネルの
      #     `p_comm` で 16 文字に切詰められ、起動時の絶対パスを返さないため、8.1 は macOS に期待
      #     パスを与えない（与えると掃除が無音の no-op になる）。(d) が macOS における名前照合の
      #     掃除を実測する — **3.5 / 8.1 の申し送りが求めていた確認はこれである**。
      #
      # ## 検証用の形（`verification-triggers`）で起動する理由
      #
      # `sidecar:<ms>` / `sidecar-grandchild:<ms>` の引き金は 5.4 / 10.7 が**非既定の feature の
      # 下にだけ**置いている（配布物に検証専用の環境変数の読み取りを入れない決定。5.4 / 7.4 の
      # 片付け）。したがってこの段は、直前の 10.4 の段が作る**バンドルしない検証用の形**
      # （`target/release/jxcel[.exe]`）を起動する。**配布物は書き換えない** — AppImage / deb /
      # `.app` / dmg / NSIS はそのまま残り、後続の 10.2 の検証と成果物の保存がそのまま働く。
      # 配布物に検証専用の識別子が無いことは 10.5 の段が `strings` で確かめている。
      #
      # ## 「本当に起動したか」の事前条件（**残存 0 が空振りで通らないようにする**）
      #
      # 残存 0 を判定する前に、**補助プロセスが実際に動いていること**を要求し、さらにその
      # コマンドラインが**この段が起動したアプリの識別子**を `--parent-pid` に持つことまで要求する
      # （監督が `child_args` で注入する。3.2 / 3.5）。補助プロセスが現れなければ、その時点で非 0
      # になる（補助プロセスを 1 つも起動しない実行が「残存 0」で緑になる経路は無い）。
      #
      # ## 残存の数え方（**照合の限界を明記する**）
      #
      #   - **Linux**: 8.1 の解決先の絶対パス（`<実行ファイルのディレクトリ>/../share/jxcel/
      #     sidecar-smoke`。deb / システムインストールと同じ形）と `/proc/<pid>/exe` が一致する
      #     ものだけを数える（3.5 と同じく、名前だけでなく実行ファイルで照合する）。検査本体は
      #     POSIX sh の `scripts/check-sidecar-termination.sh`（ローカルでも同じものを実行できる）。
      #   - **macOS**: 同じ検査器を使う。`/proc` が無いため `ps -axo pid=,comm=` を使い、
      #     **`comm` の名前（`sidecar-smoke`。13 文字で 16 文字の切詰めに収まる）だけで照合する**。
      #     絶対パス照合は効かない（8.1 が macOS に期待パスを与えない理由と同じ）。
      #   - **Windows**: PowerShell の `Get-Process` を `Path`（期待する実行ファイルの絶対パス
      #     `target\release\sidecar-smoke.exe`）で絞って数える。**Job Object の経路を実測するのは
      #     この段だけである。**
      #
      # ## 後始末
      #
      # どの段も、起動したアプリと残存する補助プロセスを終了させてから抜ける（後続の段へ持ち越さ
      # ない）。片付けは判定より後に走るので、検証の失敗（残存ありで非 0）を覆い隠さない。
      #
      # ## この環境（Linux）で確認できないこと
      #
      # macOS / Windows の段は**このホストでは実行できず、CI が唯一の実行の場**である。Linux の
      # 検査器は `uname` を差し替えて macOS の分岐（`ps` による名前照合）を実行して確かめてあるが、
      # **実際の macOS の `ps` の出力形式・`comm` の切詰め・Job Object の強制は CI だけが実測する。**
      # ---------------------------------------------------------------------

      # 実体は `scripts/ci/linux/verify-sidecar-termination.sh`（理由・証拠が何を覆うかはその冒頭）。
      - name: Verify sidecar termination (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci/linux/verify-sidecar-termination.sh

      # 実体は `scripts/ci/macos/verify-sidecar-termination.sh`（理由・証拠が何を覆うかはその冒頭）。
      - name: Verify sidecar termination (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/ci/macos/verify-sidecar-termination.sh

      # 実体は `scripts/ci/windows/verify-sidecar-termination.ps1`（理由・証拠が何を覆うかはその冒頭）。
      - name: Verify sidecar termination (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/windows/verify-sidecar-termination.ps1
      # ---------------------------------------------------------------------
      # 一括転送の検証（tasks.md 10.8 / 要件 4.5）
      #
      # **10 万行規模のデータが 1 回の呼び出しで受け渡せること**と、**呼び出し回数が行数に
      # 比例しないこと**を、実アプリの生バイト経路（7.2 の `bulk_echo`）で実測する。
      #
      # ## 駆動の仕組み（配布物に検証用の入口を残さない）
      #
      # 検証用の形（`target/release/jxcel[.exe]`）を環境変数
      # `JXCEL_VERIFICATION_BULK_ROWS=<行数の一覧>`（例 `100,100000`）付きで起動する。Rust
      # （`src-tauri/src/window/mod.rs` の `bulk_rows_script`。`verification-triggers` の下にだけ
      # 存在する）がその値を**ウィンドウの初期化スクリプト**としてグローバルへ載せ、フロント
      # エンド（`src/shell/verificationBulk.ts`）が初回描画の後に**行数ごとに 1 回ずつ**
      # `invokeRaw("bulk_echo", …)` を呼ぶ。**コマンドも権限も増やしていない**（`emit` は
      # `core:default` に含まれる既存の許可の範囲）。**配布物（既定のビルド）は環境変数も
      # 初期化スクリプトも持たない**ので、一括転送は 1 件も起きない（5.4 / 7.4 の片付けと同じ規約。
      # 10.5 の段が `strings` で不在を確かめている）。
      #
      # ## 証拠の形（2 つの独立した事実を突き合わせる）
      #
      #   - **呼び出し回数**は `bulk_echo` 自身が呼び出しごとに記録する `受信バイト数 = <N>` の
      #     行数から数える（7.2 の実装。アプリの記録であって、フロントエンドの自己申告ではない）。
      #   - **送信バイト数・受信バイト数・往復のバイト一致・呼び出し回数**はフロントエンドが
      #     イベントで報告し、Rust のリスナ（`verification-triggers` の下にだけ存在する）が
      #     記録へ 1 行で写す（`一括転送の結果: {"rows":…,"sentBytes":…,"byteIdentical":true,…}`）。
      #   検査器は両者を突き合わせるので、**どちらか一方の自己申告だけでは通らない**。
      #
      # ## 主張（tasks.md 10.8 の完了状態）
      #
      #   (i) **10 万行が 1 回の呼び出しで**: 100,000 行（4,700,000 B）の転送について、
      #       `bulk_echo` の記録行がちょうど 1 行であり、送信・受信のバイト数が一致し、
      #       往復が`byteIdentical=true` であること。
      #  (ii) **呼び出し回数が行数に比例しない**: 2 つの大きさ（100 行 = 4,700 B と 100,000 行 =
      #       4,700,000 B）で**同じ定数 1** であること、かつ一覧の件数を超える余分な呼び出しが
      #       1 件も無いこと。**2 つの大きさは必須である** — 1 件では定数であることを示せない
      #       （検査器が 1 件の一覧を入力として拒否する）。
      #
      # ## 「本当に実行されたか」の錠前（空振りで緑にしない）
      #
      # 判定の前に、**要求の行**（検証用の形の Rust だけが出す）と**行数ごとの `bulk_echo` の行**と
      # **行数ごとの結果の行**の 3 つすべてを要求する。期待バイト数は `行数 × 1 行あたり 47 B` と
      # して**検査器が計算し直す**（フロントエンドの申告を信用しない）ので、期待値が 0 以下に
      # なることはない。転送が 1 件も起きなければ（引き金を読まない・起動しない・失敗した）、
      # どの段も必ず非 0 で落ちる。**この錠前そのものを各段の 2 番目の検証で実測する** —
      # 配布物（既定のビルド）に対して同じ検査を走らせ、**非 0 で落ちることを要求する**。
      #
      # ## ペイロードの大きさと 7.2 の上限（64 MiB）の関係
      #
      #   1 行 47 B であり、100,000 行 = 4,700,000 B（約 4.48 MiB）、100 行 = 4,700 B。検証用の
      #   環境変数の上限は 1,000,000 行 = 47,000,000 B（約 44.8 MiB）で、**7.2 の 64 MiB
      #   （67,108,864 B）の内側**に収まる（上限を超える入力は空の応答になるため、検証が経路の
      #   上限に当たる値を使わない）。
      #
      # ## この環境（Linux）で確認できないこと
      #
      # macOS / Windows の段は**このホストでは実行できず、CI が唯一の実行の場**である。検査器は
      # Linux / macOS で同じ POSIX sh が走り（`scripts/check-bulk-transfer.sh`。X11 に依存しない
      # ため macOS でもそのまま使える）、Windows の段は同じ主張を PowerShell で組む。
      # **macOS のプロセス起動と Windows の `Start-Process` による起動・記録の読み取りは CI だけが
      # 実測する。**
      # ---------------------------------------------------------------------

      # 実体は `scripts/ci/linux/verify-bulk-transfer.sh`（理由・証拠が何を覆うかはその冒頭）。
      - name: Verify bulk transfer of a 100k-row payload (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci/linux/verify-bulk-transfer.sh

      # 実体は `scripts/ci/macos/verify-bulk-transfer.sh`（理由・証拠が何を覆うかはその冒頭）。
      - name: Verify bulk transfer of a 100k-row payload (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/ci/macos/verify-bulk-transfer.sh

      # 実体は `scripts/ci/windows/verify-bulk-transfer.ps1`（理由・証拠が何を覆うかはその冒頭）。
      - name: Verify bulk transfer of a 100k-row payload (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/windows/verify-bulk-transfer.ps1

      # ---------------------------------------------------------------------
      # 配布物の検証（tasks.md 10.2 / 要件 6.4, 6.5, 6.6）
      #
      # 生成した配布物から補助プロセスの実行ファイルを取り出し、起動できることを確かめ、
      # 同梱前の原本とバイト一致することを確かめ、サイズを出力に記録する。
      #
      # **これはバンドル処理が同梱した実行ファイルを書き換える既知の問題に対する恒久的な
      # 検出器である。**Linux の標準の同梱機構（`externalBin`）は `usr/bin` 配下の ELF を
      # 無条件に書き換える（tauri-apps/tauri#5189）。1.7 はそれを避けて `usr/share/jxcel/`
      # へ置く決定をした。その回避配置が破れた日に、静かにではなく明確に落ちるのがこの段である。
      #
      # 検査本体は POSIX sh の `scripts/check-sidecar-integrity.sh`（3 OS で同じものを使う）。
      # 終了コードは 0 = 検証成功 / 1 = 検証失敗（不一致・実行権限の欠落・起動不能・配布物内に
      # 不在）/ 2 = 入力が使えない（配布物・原本・ホストのトリプルが解決できない）。非 0 は
      # そのままパイプラインの失敗になる（無言で通る経路は無い）。
      #   - 比較  : `cmp` による直接のバイト比較を判定に使う。両者の sha256 も表示するので、
      #             不一致は両方のパスと両方のダイジェストつきで診断できる。**この比較は
      #             3 OS で共有の 1 実装であり、macOS / Windows も同じ失敗の仕方をする。**
      #   - 起動  : 取り出した実行ファイルを起動し、`crates/sidecar-smoke`（1.6）が `--idle` で
      #             出す `sidecar-smoke ready pid=<識別子> mode=idle` の起動行が現れることを
      #             確かめる。**バイト一致だけでは足りない**（一致していても起動できるとは限らない）。
      #   - サイズ: 配布物と取り出した実行ファイルのバイト数を出力する（要件 6.6）。macOS の
      #             dmg と Windows の NSIS インストーラは検証対象そのものではない配布物なので、
      #             各段で別に記録する。
      #
      # 取り出し方は配布物の形式ごとに分ける:
      #   - Linux  : AppImage は `--appimage-extract`（バンドル済みの実行ファイルを起動せずに
      #              取り出す。FUSE を要さない。`APPIMAGE_EXTRACT_AND_RUN` は展開実行＝起動の
      #              ための経路であり、取り出しには使えない）。deb は `dpkg-deb -x`。
      #              **AppImage と deb の両方を検証する** — 8.1 が `bundle.linux.deb.files` を
      #              足したため、どちらも 5.1 の「配布物」である。片方だけでは deb の同梱が
      #              無検査になる。どちらも `usr/share/jxcel/sidecar-smoke` に置かれる。
      #   - macOS  : バンドル済みの `.app` の中（`Contents/MacOS/sidecar-smoke`）。`externalBin`
      #              のトリプル接尾辞はバンドル時に外れる（1.7）。macOS では bundler が外部
      #              バイナリを**必ず再署名する**（tauri-bundler 2.9.4 の macos/app.rs:99-105 が
      #              外部バイナリを `SignTarget{is_an_executable:true}` として署名対象に入れ、
      #              macos/sign.rs:46-73 と tauri-macos-sign 2.3.4 の keychain.rs:207-249 が
      #              `codesign --force -s - --options runtime` を実行する。`hardenedRuntime` の
      #              既定は true: tauri-utils 2.9.3 src/config.rs:682。entitlements は未設定なので
      #              渡されない: 同 config.rs:684）。**その再署名がバイトを変えないのは、staging の
      #              時点で原本を同じ条件で事前署名してあるからである** — `scripts/stage-sidecars.sh`
      #              が、識別子が署名対象のファイル名から導かれること（Apple Security
      #              signer.cpp:158-175）に合わせて、同梱名 `sidecar-smoke` と同じベース名の
      #              一時コピーに `codesign --force -s - --options runtime` を掛けてから配置する。
      #              これにより 6.5 のバイト比較が成立し、3.1 の実行時の整合性検査（期待値は
      #              事前署名済みの原本から算出される。`crates/app-shell/build.rs`）も macOS で
      #              成立する。**この一致を実測できるのはこの段だけ**（CI が唯一の確認の場で
      #              あり、staging 側はコードで機構を固定している）。検査は緩めない
      #              （要件 6.5 は無条件である）。
      #              なお `.app` 自体の署名（app.rs:122-132）は同梱済みの副実行ファイルの
      #              バイトを書き換えない（入れ子の署名は外側から内側の順に付き、既に署名済みの
      #              入れ子は再署名されない）。
      #   - Windows: NSIS インストーラを `/S` で導入した先（`%LOCALAPPDATA%\jxcel`。既定の
      #              installMode は `currentUser`）。**導入は直前の「Verify bundle opens a
      #              window (Windows)」が済ませているので、この段は導入を繰り返さない。**
      #              サイドカーは実行ファイルの隣にトリプル接尾辞を外して置かれる（8.1）。
      #
      # macOS と Windows の段はこの環境（Linux）では実行できず、静的評価のみである。
      # 抽出・比較・起動の検査は 3 OS で同じスクリプトが走るので、CI が実測する。
      # ---------------------------------------------------------------------

      - name: Verify bundled sidecar (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci/linux/verify-bundled-sidecar.sh

      - name: Verify bundled sidecar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/ci/macos/verify-bundled-sidecar.sh

      - name: Verify bundled sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/ci/windows/verify-bundled-sidecar.sh

      # ---------------------------------------------------------------------
      # 生成の失敗の提示・異常終了の記録・描画不成立の提示（要件 2.10 / 8.2 / 10.2）
      #
      # **Linux の段だけを足す。**3 つの主張はいずれも X11 のウィンドウ観測（または
      # ウィンドウの画素の読み取り）を要し、`xwininfo` と `libX11` を使うためである。
      # 検査本体は POSIX sh の
      # `scripts/check-window-failure.sh` / `scripts/check-crash-record.sh` /
      # `scripts/check-no-paint.sh`（ローカルでも同じものを実行できる）。
      #
      # 実測する形は tasks.md の片付けの規約どおりに分ける:
      #   - 検証専用の引き金（`fail-window:<ms>` / `panic:<ms>` /
      #     `JXCEL_VERIFICATION_SUPPRESS_HEARTBEAT=1`）を読むのは**検証用の形**だけである
      #     （10.4 の段が `JXCEL_VERIFICATION_BUILD=1 npx tauri build --no-bundle --features
      #     verification-triggers` で作った `target/release/jxcel`）。
      #   - **配布物（AppImage）は同じ環境変数を無視する。**これが負の対照である —
      #     「検査が存在しない経路を通っていない」ことと「記録が引き金の起こした出来事のもの
      #     である」ことを示す（常に成功する検査器では段が緑にならない）。
      #
      # ## 位置（この節を最後に置く理由）
      #
      # 3 つの検査はどれも**アプリの状態を変える**（8.3 の印を立てる・パニックでプロセスを
      # 終わらせる）。**この節より前の段が測るもの**（10.4 の初回描画、10.5 の複数ウィンドウ、
      # 10.6 のメニュー、10.7 / 10.8）に影響しないよう、段落の最後（成果物の保存の直前）に
      # 置く。とくに `render.fallback` の印は**次の起動の描画経路を変える**ので、描画を測る段
      # より後に置かなければならない。
      #
      # ## 各段が何を証明し、何を証明しないか
      #
      #   - 2.10: 生成の失敗が**提示され**（診断の保存先の 1 件の記録 `jxcel-window-error.log`。
      #     失敗したラベル・対象のドキュメント・理由を名指しする）、既に開いているウィンドウの
      #     動作を中断させない（同じ識別子のまま残り、失敗の後でも引き継ぎで開いた新しい
      #     ウィンドウが**描画まで成立する**）。
      #     **可視のダイアログは検証しない**（実装に無い。理由は
      #     `lifecycle::persist_window_failure` の doc にある）。
      #   - 8.2: 意図的なパニックで**異常終了の記録**（`jxcel-crash.log`）が残り、記録が
      #     パニックを握り潰さず、そのあとの起動が通常に成立して終了コード 0 で終わる。
      #   - 10.2: 期限超過が**記録され**（`初回描画が成立しなかった: … 期限=3000 ms`）、
      #     ネイティブの題名が変わり、**全画面の注意書きが描かれ**（画素を読んで確かめる）、
      #     8.3 の印が立ち、アプリは終了コード 0 まで動作を続ける。
      #     **この 3 つはいずれも tasks.md の完了状態の記述が要求していたものであり、
      #     これまで実測する段が無かった**（8.2 の `panic:<ms>` と 10.2 の抑止の引き金は
      #     実装されているのに駆動されていなかった）。
      # ---------------------------------------------------------------------

      # 実体は `scripts/ci/linux/verify-window-creation-failure.sh`（理由・証拠が何を覆うかはその冒頭）。
      - name: Verify a failed window creation is presented and isolated (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci/linux/verify-window-creation-failure.sh

      # 実体は `scripts/ci/linux/verify-crash-record.sh`（理由・証拠が何を覆うかはその冒頭）。
      - name: Verify a crash record is written for a real panic (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci/linux/verify-crash-record.sh

      # 実体は `scripts/ci/linux/verify-no-paint.sh`（理由・証拠が何を覆うかはその冒頭）。
      - name: Verify the no-paint presentation (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci/linux/verify-no-paint.sh

      # ---------------------------------------------------------------------
      # ドキュメントのセッションの 1 回の走行の観測（tasks.md 5.3 / 要件 8.2, 8.3）
      #
      # 3 OS それぞれで、**実物のアプリを起動して**ドキュメントを読み込み、一括の変更を適用し、
      # 保存した結果を観測する。引き金は 5.2 が非既定の feature の下に置いた
      # `JXCEL_VERIFICATION_SESSION=open,edit,<行数>,save` であり、起動から
      # 「読み込み → 1 回の一括の適用 → 保存 → 状態と閉じてよいかの答え」までの事実を
      # `[検証] セッション: ` の 6 行として記録へ残す。判定は POSIX sh の
      # `scripts/check-document-session.sh` が行う（**3 OS で同じものが走る**）。
      #
      # 検査器が要求するもの（**どれか 1 つでも欠けたらその段は非 0 で終わる**）:
      #   1. **起動の形跡を先に確かめる** — 走行の直前に取った記録の行数より後ろに
      #      `ウィンドウを開いた: label=doc-` があること。**空振りの実行を緑にしないための
      #      錠前である**（`verification.md`「『本当に起動したか』を先に確かめてから結果を判定する」）。
      #      描画の成立行（10.4 が使う）は**使わない** — このランナーのソフトウェア
      #      ラスタライザでは期限（3 秒）をわずかに超えることがあり、セッションの引き金は
      #      `RunEvent::Ready` から走るので**描画の成否に依存しない**（依存させると偽の失敗になる）。
      #   2. 6 つの事実: 引き金を読んだ（渡した行数）・読み込んだ行数・**版 = 2** の一括の適用・
      #      保存の前の答え = 拒否・保存した（バイト数）・保存の後の答え = 許可。版 = 2 を要求する
      #      のは、一括が**1 回の適用として運ばれた**ことの数による証拠である（読み込みで 1、
      #      適用で 2。要件 3.5）。
      #   3. **変更が保存へ届いたこと** — 保存のバイト数が雛形（2140 B）と異なり、かつ
      #      **実際のファイルの大きさと一致する**こと（アプリの自己申告だけでは、保存の完了と
      #      記録が食い違っていても通る）。
      #   4. **決定性** — 同じ雛形の**新しい写し**からの 2 回目の保存が 1 回目と同一バイト列で
      #      あること。**1 回目の出力を 2 回目の入力にしない**（それは「同じ入力の 2 回」ではない）。
      #   5. **負の対照** — 配布物（既定のビルド）を渡すと、引き金が読まれずに検査器が非 0 で
      #      落ちること。落ちた理由が「引き金の行の不在」であることと、**配布物が起動して
      #      ドキュメントの窓を開いたこと**まで各段が要求する（起動しなかった実行も事実の欠落で
      #      落ちるので、理由を見ないと錠前の実測にならない）。
      #
      # ## 実測する形（配布物と検証用の形の分担）
      #
      # 引き金を読むのは**検証用の形**だけである — 直前の 10.4 の段が
      # `JXCEL_VERIFICATION_BUILD=1 npx tauri build --no-bundle --features verification-triggers`
      # で作った `target/release/jxcel[.exe]` を起動する。配布物（AppImage / `.app` / NSIS で
      # 導入した実行ファイル）は同じ環境変数を無視する — **これが 5.3 の負の対照である**
      # （「検査が存在しない経路を通っていない」ことの反証。常に成功する検査器では段が緑にならない）。
      # **この段はどちらの形も消費するだけで、ビルドはしない。**
      #
      # ## 何を証明し、何を証明しないか
      #
      #   - 証明する: 配布物の中核の経路（`document-format` の読み込み → `Document::set_cells` の
      #     一括 → 書き出し）が、**そのランナーの実物のアプリで**動き、変更が保存のバイト列に
      #     届き、同じ入力の 2 回目が同一バイト列になること。判定はアプリ自身の記録と、保存先の
      #     ファイルの大きさ・バイト列で行う。
      #   - 証明しない: 画面の見え方（4.2 の提示・4.3 の状態表示）、保存先の選択の提示（3.5）、
      #     メニューからの「保存」（3.6）。いずれも別の段 / 別のタスクの担当である。**3 OS で
      #     同じ判定を閉じるため、この段はウィンドウツリーもアクセシビリティの木も画面の画素も
      #     読まない** — 同じ理由で、macOS のアクセシビリティの許可・Windows のキー注入にも
      #     依存しない（10.6 の macOS / Windows の段が記している制約の影響を受けない）。
      #   - **限界**: この段はアプリの記録（自己申告）を一次証拠にする。記録が事実と食い違う
      #     可能性を完全には排除しない — 排除しているのは「保存が実際に書き出したファイル」の
      #     側であり（バイト数とバイト列を検査器が自分で読む）、記録だけを信じる経路は無い。
      #
      # ## 位置（配布物を起動する段のまとまりの中）
      #
      # 負の対照が**配布物を起動する**ので、この段は配布物を起動する段のまとまり（下の
      # 「配布物の負の対照」の節の直前）に置く。その節は**自分が最後であること**を理由に
      # 持っている（配布物の起動ではラッパーが本体を切り離すため検査器の片付けが本体へ届かない
      # ことがあり、実測では `xvfb-run` の終了が本体を終わらせるが、その終了を待たずに次の
      # 起動が始まると単一インスタンスの機構に引き継がれうる）。**この段をその節の後ろへ
      # 置くと、その節の「後続の段が無い」という前提が崩れる** — こちらは前へ置き、配布物を
      # 起動する段のまとまりを末尾（成果物の保存の直前）に保つ。この段の負の対照が一時領域へ
      # 展開する `appimage_extracted_*` は**段の側が直ちに片付ける**ので、後続の配布物の段に
      # 残留は持ち越さない。
      #
      # ## 段の実体
      #
      # 3 OS とも**同じ検査器を呼ぶだけ**であり、段が足すのは OS 固有の部分（仮想ディスプレイ・
      # 記録と配布物の位置・配布物の取り出し方・残留プロセスの確認）に限る。実体は
      # `scripts/ci/{linux,macos,windows}/verify-document-session.*`（理由・証拠が何を覆うかは
      # その冒頭）。**判定はランナーごとに閉じる**（3 OS の値を 1 か所へ持ち寄るにはジョブ間
      # 依存が要り、要件 6.2 の「ジョブを増やさない」に反する。全体の合否は各ジョブが自分の
      # 担当分で落ちることで成立する）。
      #   - **macOS / Windows の実行はこの開発機では確かめられない**（実行環境が無い）。
      #     CI の実行が唯一の確認の場である（`verification.md`「ローカルで閉じられないもの」）。
      # ---------------------------------------------------------------------

      # 実体は `scripts/ci/linux/verify-document-session.sh`（理由・証拠が何を覆うかはその冒頭）。
      - name: Verify the document session trigger run (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci/linux/verify-document-session.sh

      # 実体は `scripts/ci/macos/verify-document-session.sh`（理由・証拠が何を覆うかはその冒頭）。
      - name: Verify the document session trigger run (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/ci/macos/verify-document-session.sh

      # 実体は `scripts/ci/windows/verify-document-session.ps1`（理由・証拠が何を覆うかはその冒頭）。
      - name: Verify the document session trigger run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File scripts/ci/windows/verify-document-session.ps1

      # ---------------------------------------------------------------------
      # 配布物の負の対照（既定のビルドは検証専用の引き金を読まない）
      #
      # **この段を最後に置く理由**: 配布物（AppImage）の起動では、配布物の起動ラッパーが本体を
      # 切り離すため（実測: 起動した pid の子ではなくなる）、検査器の後始末が本体に届かない。
      # CI では各段を `xvfb-run` が包むので**仮想ディスプレイの終了が本体を終わらせる**が、
      # その終了を待たずに次の起動が始まると単一インスタンスの機構に引き継がれうる。したがって
      # 配布物を起動する段は**最後にまとめ**、後続の段（成果物の保存）に影響しないようにする。
      # **5.3 の段も配布物を起動する**（負の対照）ので、この節の直前（配布物を起動する段の
      # 並びの最後）に置いてある。
      #
      # 確かめるのは 2 つである（いずれも「**存在しない経路を通っていない**」ことの反証）:
      #   - 8.2: `panic:<ms>` を渡した配布物が**終了せず、異常終了の記録も残さない**
      #     （これが無いと、記録が「引き金の起こしたパニック」のものであることを言えない）
      #   - 10.2: 抑止の環境変数を渡した配布物が**抑止されず**（成立行が出て題名も変わらず、
      #     注意書きの赤が画面を覆わない）、期限超過の経路に入らない
      # ---------------------------------------------------------------------

      - name: Verify the shipping bundle ignores the verification triggers (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci/linux/verify-shipping-ignores-triggers.sh

      # 成果物の保存（要件 6.7）。名前は `jxcel-bundle-<runner os>` で安定させ、1 回の
      # 実行で 3 プラットフォーム分を取得できるようにする。`if-no-files-found: error`
      # により、バンドルが生成されていなければこの段でパイプラインを落とす。
      # 失敗した段があっても成果物を取得できるよう `if: !cancelled()` を付ける。
      # 注意: GitHub の成果物はファイルの実行権限を保持しない。ダウンロードした
      # AppImage / `.app` を実行する場合は権限の復元（`chmod +x` など）が必要である。
      - name: Upload platform bundles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jxcel-bundle-${{ matrix.os }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  audit:
    name: Security audit (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (2026-09-03)
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # ゲート厳守: cargo audit が非 0 で終わったらここでパイプラインを落とす。
      # Tauri の依存集合は本スペックで最もゲートに触れやすい（要件 6.3）。
      # 勧告が出た場合も ignore リストを追加して隠さない。
      - name: cargo audit
        run: cargo audit

      - name: zip floor check (>= 2.3.0)
        run: bash scripts/check-zip-floor.sh Cargo.lock
