# CI パイプライン（tasks.md 1.1 / 1.5 / 1.7 / Requirements 3.2, 5.1, 6.1, 6.2, 6.3, 6.7, 8.3）
#
#   - test : Linux / macOS / Windows の 3 OS マトリクスでビルドとテストを実行し、
#     さらに 3 プラットフォーム分の配布物（バンドル）を生成して、起動とウィンドウの表示を
#     確認し、成果物として保存する（tasks.md 1.5。要件 6.1, 6.7）。
#     起動から操作可能なウィンドウが表示されるまでの時間を計測し、要件値の 2 秒を
#     超えていればパイプラインを失敗させる（tasks.md 10.3。要件 1.3, 6.8）。計測は
#     各 OS の起動検証の段が行い、判定は scripts/check-startup-budget.sh が行う。
#     サイドカーの同梱原本は `scripts/stage-sidecars.sh`（唯一の文書化された手順）で
#     配布物生成の前に配置する（tasks.md 1.7。要件 5.1）。
#     本スペックはこの既存マトリクスを拡張する。**プラットフォーム別のワークフローを
#     新設しない**（要件 6.2）。ジョブも増やさない（`test` は 1 つのまま）。
#     （決定的シリアライズは OS を跨いだバイト同一性を要求するため 3 OS 必須）。
#   - audit: cargo audit をゲートとして組み込む。非 0 終了で即パイプライン失敗
#     （例外・スキップ・エラー無視の設定は一切許可しない）。Tauri の依存集合を
#     加えた状態でも本ゲートが走り続けることを確認する（要件 6.3）。
#
# Linux のランナーは**最も古い対象環境**（Ubuntu 22.04 / Debian 12）に固定する。
# 新しい環境でビルドすると、配布物に同梱される低レベルライブラリ（libwayland / Mesa /
# libxkbcommon など）が古い環境で動かない（design.md「BuildPipeline」Batch / Job Contract、
# research.md「AppImage の自己完結性とサイズ」）。`ubuntu-latest`（= 24.04）へ戻してはならない。
#
# zip >= 2.3.0 の下限（RUSTSEC-2025-0168、design.md Security Considerations）は
# scripts/check-zip-floor.sh が Cargo.lock の解決版を機械検査する（両ジョブで実行）。
#
# 権限と供給網（qlty の zizmor が検査する。.qlty/qlty.toml）:
#   - GITHUB_TOKEN は読み取りだけにする。どのジョブもリポジトリの取得以外に GitHub API を
#     使わない（成果物とキャッシュは GITHUB_TOKEN ではなく Actions ランタイムのトークンで扱われる）。
#   - checkout は認証情報を .git/config に残さない。後続の段は git の認証を使わない。
#   - サードパーティのアクションはコミット SHA で固定し、版をコメントに書く。
#     dtolnay/rust-toolchain は master の履歴上の SHA に固定し、ツールチェーンを `toolchain:` で
#     渡す（`@stable` などのブランチは master の外にあり、SHA で固定すると将来消えることがある）。
#     GitHub 公式の `actions/*` はタグのままにする（zizmor の既定の方針）。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux だけ最も古い対象環境に固定する（上記）。macOS / Windows は OS 標準の
        # WebView にリンクするため、追加のシステム依存を要さない。
        os: [ubuntu-22.04, macos-latest, windows-latest]
        include:
          # OS ごとの配布物の形式（要件 6.1）。`bundle.targets` を tauri.conf.json に
          # 置くと単一の値しか持てず他の OS でバンドルに失敗するため、ここから
          # `npx tauri build --bundles` へ渡す。
          #   Linux   : `appimage`（単一ファイルの配布物。要件 1.1）/ `deb`
          #   macOS   : `app`（起動検証の対象）/ `dmg`
          #   Windows : `nsis`（インストーラ。起動検証はこれで導入した実行ファイルに対して行う）
          - os: ubuntu-22.04
            bundles: appimage,deb
            artifact_paths: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
          - os: macos-latest
            bundles: app,dmg
            artifact_paths: |
              target/release/bundle/macos/*.app
              target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundles: nsis
            artifact_paths: |
              target/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Linux の WebKitGTK 系開発パッケージと仮想ディスプレイ。
      # Tauri v2 は OS の WebView にリンクするため、ヘッダと .pc ファイルが無いと
      # `webkit2gtk-sys` / `gtk-sys` / `soup3-sys` / `javascriptcore-rs-sys` の
      # ビルドスクリプトが pkg-config の解決に失敗し、ワークスペース全体が落ちる。
      #   - libwebkit2gtk-4.1-dev        : WebView 本体（Tauri v2 が使う 4.1 系）
      #   - libgtk-3-dev                 : ウィンドウと GTK ウィジェット
      #   - libsoup-3.0-dev              : WebKitGTK 4.1 系が要求する HTTP 実装
      #   - libjavascriptcoregtk-4.1-dev : JS エンジン
      #   - librsvg2-dev                 : アイコン（SVG）の読み込み
      #   - libssl-dev                   : OpenSSL ヘッダ（openssl-sys の解決）
      #   - libdbus-1-dev                : tauri の既定 feature `dbus` →
      #     tauri-runtime-wry → tao/dbus → dbus → libdbus-sys が `dbus-1.pc` を
      #     pkg-config に要求する。欠けると libdbus-sys のビルドスクリプトが panic し、
      #     ワークスペース全体が落ちる（ローカルで実測）。Tauri のドキュメントの
      #     パッケージ一覧には現れないが、既定 feature のビルドには必須である。
      #   - pkg-config                   : 上記の解決機構そのもの
      #   - patchelf                     : AppImage バンドル時の実行ファイル書き換え（タスク 1.5）
      #   - xvfb                         : 仮想ディスプレイ。GUI の無いランナーで
      #     配布物を起動しウィンドウの表示を確認するために使う（タスク 1.5。design.md
      #     「BuildPipeline」が省略できない前提としている）
      #   - x11-utils                    : `xwininfo`。ウィンドウツリーの走査に使う
      #   - libfuse2                     : Tauri が生成する AppImage のランタイムが FUSE 2 を
      #     dlopen する版に対応する。FUSE が使えない環境では
      #     `APPIMAGE_EXTRACT_AND_RUN=1` で展開実行へ切り替えられる
      # macOS / Windows は OS 標準の WebView を使うため追加パッケージを要さない。
      - name: Install Linux system dependencies (Tauri v2)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libdbus-1-dev \
            pkg-config \
            patchelf \
            xvfb \
            x11-utils \
            libfuse2 \
            at-spi2-core

          # **`at-spi2-core` を明示する理由**: 10.6 のメニュー検査は AT-SPI で
          # アクセシビリティの木を読む。そのためには `org.a11y.Bus`（`at-spi-bus-launcher`）
          # が要るが、**それは GTK の推奨依存としては入らない**（実測: 素の
          # `libgtk-3-dev` などの導入では `at-spi-bus-launcher` が無く、起動時に
          # `org.a11y.Bus was not provided by any .service files` が出る）。

          # **ランナーの xdg-desktop-portal を D-Bus の活性化対象から外す。**
          # これはポータルを使わないという意味ではなく、**壊れたポータルが起動を 25 秒
          # 止めること**を避けるための処置である。実測（2026-09-12、ubuntu-22.04 ランナー）:
          # アプリの `builder.build()` の中で `StartServiceByName
          # org.freedesktop.portal.Desktop` が送られ、GLib / GDBus の既定のタイムアウト
          # 25 秒を待つ `poll(..., 25000)` がタイムアウトしてから起動が続く。段ごとの
          # 計測で `builder.build()` が 25,077 ms、`DBUS_SESSION_BUS_ADDRESS` を
          # 無効化すると 48 ms、**この .service を外すと 42 ms** だった（strace で確認）。
          # ポータルは本アプリの動作に必要ない（要件 1.2 は追加のランタイムを要求しない。
          # `scripts/` にポータルを要求する検査は無い）。セッションバス自体は残すので、
          # AT-SPI を使う段（10.6 のメニュー検査）には影響しない。
          # xdg-desktop-portal が入っていないランナーでは `rm -f` は空振りする。
          sudo rm -f /usr/share/dbus-1/services/org.freedesktop.portal.Desktop.service

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (2026-09-03)
        with:
          toolchain: stable

      # フロントエンドのツールチェーン（React + Vite + TypeScript。tasks.md 1.4 / 1.5）。
      # 本スペックのフロントエンドは `src/` にあり、ビルドは Node 側で行う。Rust の
      # ビルドより先に入れておくことで、後続タスクが追加する `tsc --noEmit` の段が
      # 同じジョブに載る（ジョブを新設しない = 要件 6.2）。
      # `package-lock.json` が追跡対象になった（タスク 1.4）ため `cache: npm` を有効にし、
      # 依存解決は `npm ci`（ロックファイルどおりの固定解決）で行う。
      - name: Install Node.js frontend toolchain
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # キャッシュキーにランナーのイメージ名を加える。rust-cache の自動キーは
      # `Linux-x64` までしか区別しないため、ubuntu-22.04 のジョブが ubuntu-latest
      # （24.04）で作られたキャッシュを復元し、その中のビルドスクリプトが
      # `GLIBC_2.39 not found` で起動できずに落ちたことがある。
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}

      # サイドカーの同梱原本を配置する（tasks.md 1.7）。**唯一の文書化された手順**は
      # `scripts/stage-sidecars.sh` である（クローン直後からこの 1 手順で原本が揃う）。
      # 3 OS すべてで、`tauri build` より前 — かつ Windows / macOS では `tauri-build` が
      # `bundle.externalBin` の原本をビルド時に要求するため `cargo build --workspace`
      # より前 — に実行する。POSIX sh なので Windows でも Git Bash（`shell: bash`）で
      # 同じものが走る。配置規約（Windows / macOS は `externalBin`、Linux は
      # `appimage.files` → `usr/share/jxcel/sidecar-smoke`）と不在時の扱いは
      # スクリプトの日本語ヘッダを参照。Windows / macOS の設定は platform 別設定ファイルが
      # Tauri CLI により自動でマージされるため、`--config` は使わない。
      - name: Stage sidecar original
        shell: bash
        run: bash scripts/stage-sidecars.sh

      # Tauri アプリ（`src-tauri/`、パッケージ名 `jxcel`）を含むワークスペース全体を
      # ビルドする。Tauri の依存を加えた状態でこの段が通ることが、以降の検証の前提である。
      - name: Build
        run: cargo build --workspace --all-targets

      # ---------------------------------------------------------------------
      # 静的ゲート（tasks.md 10.1 / 要件 4.3, 4.7, 9.6）
      #
      # 既存のマトリクスへ段を足すだけであり、プラットフォーム別のワークフローもジョブも
      # 新設しない（要件 6.2）。**3 OS すべてで走らせる**（`if:` で 1 OS に絞らない）:
      #   - structure.md「機械検査は scripts/ に置き CI から呼ぶ」は、検査スクリプトが
      #     3 OS のランナーで同じく動くことを要求している。`zip floor check` と同じ扱い。
      #   - 対象の依存は `[target.'cfg(...)'.dependencies]` で OS ごとに変わるため、
      #     1 OS だけの実行では他方のプラットフォーム向けに足された tauri 依存を見逃す。
      #   - capability の逸脱検査は、そのランナーの tauri-build が実際に書き出した
      #     記述を検査する（手元の生成物ではなく、各 OS のビルド結果が対象になる）。
      #     **登録コマンドと権限の対応（`scripts/check-command-acl.sh`）も同じ生成物
      #     （`acl-manifests.json` / `capabilities.json`）を読む**ので、Build の後で走らせる。
      #   - 禁止プラグインの検査（`scripts/check-forbidden-plugins.sh`）は依存の解決だけを要し、
      #     3 OS で走らせる意味がある（対象の依存は `[target.'cfg(...)'.dependencies]` で変わる）。
      #
      # 位置は `Build` の直後・`Test` の直前である。
      #   - capability の逸脱検査の入力（`src-tauri/gen/schemas/capabilities.json`）は
      #     tauri-build が `cargo build --workspace` の中で書き出すため、Build より前には
      #     存在しない（無ければスクリプトが exit 2 で落ちる）。
      #   - フロントエンドの段は、先の `npm ci` で devDependency（`typescript`）が
      #     入っていることを前提にする。
      #   - ドリフト検査は `cargo test --workspace` にも含まれるが、そこで落ちると原因が
      #     ワークスペース全体の出力に埋もれる。境界の型・コマンド名の変更に対して
      #     最初に名指しで落ちる段を `Test` より前に置く。
      # ---------------------------------------------------------------------

      # 生成物のドリフト検査（要件 4.3 の前半、tasks.md 2.3）。`src/ipc/bindings.ts` は
      # `crates/app-shell/src/ipc/` の境界の型と `COMMAND_NAMES` から生成される追跡対象の
      # 成果物である。正本を変えて生成をやり直さない変更（および生成物の手編集）は
      # ここで落ちる。失敗メッセージには再生成コマンドが含まれる。
      - name: Check generated bindings drift
        run: cargo test -p app-shell --test bindings_drift

      # フロントエンドの型検査（要件 4.3 の後半）。ドリフト検査と**両方**必要である:
      #   - ドリフト検査 = 「Rust 側が変わったのに生成物が古い」
      #   - `tsc --noEmit` = 「生成物は新しいがフロント側が追随していない」
      # 片方だけでは「不一致がビルドを落とす」は成立しない（tasks.md 2.3）。
      # `typecheck` は `build`（Vite のみ）とは別のスクリプトである（tasks.md 1.4）。
      - name: Typecheck frontend (tsc --noEmit)
        run: npm run typecheck

      # ESLint（tasks.md 1.4 の規約を 10.1 が CI のゲートにする）。**`any` の禁止はこの段で
      # しか強制されない** — `tsc --noEmit` も `npm run build`（Vite のみ）も ESLint を
      # 走らせないため、`@typescript-eslint/no-explicit-any: error` は CI に入れなければ
      # ローカルの善意だけに依存する（1.4 が `npm run typecheck` と `npm run lint` を独立の
      # スクリプトにしてあるのは、この 2 つを別のゲートとして呼べるようにするためである）。
      # 対象は `eslint.config.js` の `ignores` で `src/` と設定ファイルに限られ、生成物
      # `src/ipc/bindings.ts` も検査対象に含まれる（生成物に `any` は現れない）。
      # 依存は先の `npm ci`（devDependency の eslint 一式）で入る。
      # Windows の npm は既定で cmd.exe からスクリプトを起動するため、`shell: bash` を
      # 明示する（`check:shared-assets` と同じ扱い。スクリプト本体は `eslint .` である）。
      - name: Lint frontend (eslint, no-explicit-any)
        shell: bash
        run: npm run lint

      # 配信先中立な資産の依存検査（要件 9.6、tasks.md 9.4）。`src/shared/` はデスクトップ内と
      # LAN 配信の Web ページの両方で動くため、Tauri の通信境界（`@tauri-apps/*` /
      # `window.__TAURI__` / `../ipc`）に依存してはならない。検査は TypeScript の構文木を
      # 走査するので、コメントや散文を誤検出しない。
      # 0 = 依存なし / 1 = 逸脱（ファイル:行:列 と理由） / 2 = 入力が使えない。
      # node と devDependency `typescript` を要する（`npm ci` の後であることが前提）。
      # Windows の npm は既定で cmd.exe からスクリプトを起動するため、`shell: bash` を
      # 明示して Git Bash のある PATH を引き継がせる（スクリプト本体は POSIX sh）。
      - name: Check shared assets do not depend on the IPC boundary
        shell: bash
        run: npm run check:shared-assets

      # capability の逸脱検査（要件 4.7、tasks.md 7.3）。tauri-build が書き出した実行時の
      # capability 記述を node で構造的に解析し（説明文の散文では誤検出しない）、
      # fs / shell 系の権限識別子と「全ウィンドウ」指定（`windows` / `webviews` の `"*"`）を
      # 逸脱として落とす。`windows` キーの不在は逸脱ではない（tasks.md 7.1 の訂正）。
      # 0 = 適合 / 1 = 逸脱 / 2 = 入力が使えない（生成物の不在は 2。Build の後なので存在する）。
      - name: Check capability deviations
        shell: bash
        run: bash scripts/check-capabilities.sh

      # コアクレートの tauri 非依存（tasks.md 10.1、structure.md「Rust ドメインクレート」、
      # tech.md「Testing」）。本スペックで最も破られやすい不変条件であり、手作業の確認では
      # 守れない。検査本体は POSIX sh の `scripts/check-core-deps.sh`（ローカルでも同じものを
      # 実行できる）。`cargo tree` の出力全体（normal / build / dev の 3 辺、全 feature）を
      # 行頭のパッケージ名で照合するので、**推移的に引き込まれた tauri** も捕まえる。
      # ドメインコアは GUI を起動せずにテストできなければならない。
      - name: Check core crate does not depend on tauri (transitively)
        shell: bash
        run: bash scripts/check-core-deps.sh app-shell

      # ファイルシステム系・シェル系のプラグインが依存ツリーに無いことの検査（要件 4.7 の
      # 制御の第 1 段、tasks.md 1.3）。**推移的依存まで見る**。上の `check-core-deps.sh` は
      # **ドメインコアクレート**（`crates/*`）が tauri 一族に依存しないことを検査するが、
      # アプリ（`jxcel`）は tauri に依存するので、アプリ側で禁じるべきプラグインの検査は別に
      # 要る — `tauri-plugin-fs` / `-shell` / `-store` / `-dialog`（`-dialog` は `-fs` を
      # 非 optional の通常依存として引き込む。タスク 1.3 の実測）。`check-capabilities.sh` は
      # 「権限を与えないこと」を検査するが、依存を 1 行足せば `fs:` / `shell:` の権限を書ける
      # 状態になる。**依存に入れないことが最も強い制御である**（src-tauri/Cargo.toml の依存方針）。
      - name: Check no filesystem/shell plugin is in the dependency tree
        shell: bash
        run: bash scripts/check-forbidden-plugins.sh jxcel

      # 登録されたコマンドが capability の権限で許可されていることの検査（要件 4.7、
      # tasks.md 7.3）。`build.removeUnusedCommands: true` により、`command_root!` へ登録して
      # `COMMAND_NAMES` へ足し `bindings.ts` を再生成しても、`src-tauri/permissions/app.toml`
      # （および `[[set]]`）から漏れているコマンドは**配布物から静かに削られる** —
      # ドリフト検査・`tsc --noEmit`・capability 検査・core-deps 検査はいずれも緑のままで、
      # 失敗は実行時にしか現れない。検査は tauri-build が書き出した `acl-manifests.json` と
      # `capabilities.json` を読み、**capability が実際に与える権限の `commands.allow`** と
      # 登録の一覧を突き合わせる（capability 検査と同じく生成物が入力なので Build の後に置く）。
      - name: Check registered commands are granted by the ACL permissions
        shell: bash
        run: bash scripts/check-command-acl.sh

      # `--no-fail-fast`: 既定の `cargo test` は最初に落ちたテストターゲットで止まり、
      # 残りの統合テストと doctest を走らせない。OS 固有の失敗は 1 回の実行ですべて
      # 見えている必要がある（Windows で lib の 1 件が落ちた結果、統合テストが
      # 一度も走らなかったことがある）。
      - name: Test
        run: cargo test --workspace --no-fail-fast

      # 設計意図: 決定性（要件 3.1, 3.2）は「同一文書の 2 回保存のバイト一致」と
      # 「Linux / macOS / Windows の 3 OS の出力バイト一致」で検証する。後者は
      # コミット済み期待バイト列（tests/fixtures/bytes/golden_container.zip）との
      # 比較として tests/determinism.rs にあり、この 3 OS マトリクスで走ることで
      # OS 間のバイト同一性の実測になる。`cargo test --workspace` にも含まれるが、
      # 決定性の検証がマトリクスで走っていることを明示し、将来の変更で黙って
      # 落ちないようにするため、ここでも明示的に実行する。
      - name: Determinism (byte identity across Linux / macOS / Windows)
        run: cargo test -p document-format --test determinism

      # zip >= 2.3.0 下限検査: スクリプトは POSIX sh。Windows でも Git Bash を使う
      - name: zip floor check (>= 2.3.0)
        shell: bash
        run: bash scripts/check-zip-floor.sh Cargo.lock

      # 配布物の生成（要件 6.1）。**必ず Tauri CLI 経由で生成する**（タスク 1.4 の申し送り）。
      # 素の `cargo build` は `devUrl` があるため `frontendDist` を埋め込まず、
      # 配布物が白いウィンドウになる。`npx tauri build` は `beforeBuildCommand`
      # （`npm run build`）でフロントエンドを生成してから release ビルドとバンドルを行う。
      # 形式はマトリクスの `bundles` で OS ごとに指定する（上記の include を参照）。
      - name: Build platform bundle
        run: npx tauri build --bundles ${{ matrix.bundles }}

      # 配布物のフロントエンド資産の衛生検査（tasks.md 5.4 / 8.2 の決定、要件 4.7 の精神）。
      #
      # **なぜ `dist/` を検査するのか（重要）**: Tauri は `compression` feature（既定で有効）で
      # フロントエンド資産を **brotli 圧縮して**実行ファイルへ埋め込むため、実行ファイルに対する
      # `strings -a` では**埋め込み資産の本文が見えない**（実行ファイルに残るのは内容ハッシュ付きの
      # 資産のファイル名だけである）。直前の `npx tauri build --bundles` が `beforeBuildCommand`
      # （`npm run build`）で書いた `dist/` は、その実行ファイルへ埋め込まれる入力そのものである。
      # したがってここで `dist/` を検査する。**実行ファイルに対する `strings` の検査（10.5 の段）は
      # Rust 側のためにそのまま残す。**
      #
      # 第 2 引数（`target/release/jxcel[.exe]`。Windows は接尾辞を補う）を渡すと、
      # **資産のファイル名の一致**で「その実行ファイルが検査した dist を埋め込んでいる」ことも
      # 確かめる（ファイル名は Vite が内容から決めるので、一致は埋め込み内容の同一性の根拠になる）。
      #
      # **10.4 の段より前に置く** — 10.4 は `npm run build` をやり直して `dist/` を検証用の形で
      # 上書きするためである。ここで配布物の `dist/` を `target/shipping-frontend-dist` へ退避し、
      # 10.4 の形の突き合わせ（`scripts/check-bundle-forms.sh`）が使う。
      - name: Check the shipping frontend bundle contains no verification-only code
        shell: bash
        run: |
          set -eu
          bash scripts/check-shipping-bundle.sh dist target/release/jxcel
          rm -rf target/shipping-frontend-dist
          cp -r dist target/shipping-frontend-dist

      # 起動の検証（tasks.md 1.5 の完了状態）。プロセスの起動ではなく、**ウィンドウが
      # 現れること**を確認する。GUI を持たないランナーでは仮想ディスプレイ（Xvfb）上で
      # 起動する（design.md「BuildPipeline」の前提）。
      # 検査本体は POSIX sh の `scripts/check-x11-window.sh`（ローカルでも同じものを実行できる）。
      # 対象は生成した AppImage（`target/release/bundle/appimage/*.AppImage`）。
      # FUSE が使えないランナーでは `APPIMAGE_EXTRACT_AND_RUN=1`（展開実行）へ退避する。
      #
      # 同じ段が**起動からウィンドウ表示までの時間**も計測する（tasks.md 10.3 /
      # 要件 1.3, 6.8）。検査器は計測値を `target/startup-measurements.txt` に
      # `linux=<ミリ秒>` として書き、CI の出力にも出す。仮想ディスプレイや xvfb-run の
      # 起動は計測区間に含めない（要件が測るのは配布物の起動時間であり、検証基盤の
      # 起動時間ではない）。再試行がある場合、**権威があるのは成功した試行の値**である
      # （失敗した試行はファイルに触れない）。
      - name: Verify bundle opens a window (Linux / Xvfb)
        if: runner.os == 'Linux'
        run: |
          set -- target/release/bundle/appimage/*.AppImage
          appimage=$1
          measure=target/startup-measurements.txt
          warmup=target/startup-warmup.txt
          rm -f "$measure" "$warmup"

          # 冷えたランナーの**初回起動だけ**が持つ一度きりのコスト（WebKit の共有ライブラリの
          # 読み込み・フォントキャッシュ・X / GUI の初回起動）を計測区間へ混ぜない。要件 1.3 の
          # 根拠である Tauri の公式ベンチは**ウォーム実行**（3 回のウォームアップを捨てる。
          # research.md「起動時間」）であり、ここでも 1 回起動して捨ててから計測する。冷えた値も
          # 情報として出力する（判定には使わない）。**閾値は要件値の 2 秒のままである。**
          run_check() {
            xvfb-run -a --server-args="-screen 0 1280x1024x24" \
              sh scripts/check-x11-window.sh "$appimage" jxcel 60 100 100 "$1"
          }
          if ! run_check "$warmup"; then
            echo "FUSE 経由で起動できなかったため、APPIMAGE_EXTRACT_AND_RUN=1 で再試行します" >&2
            export APPIMAGE_EXTRACT_AND_RUN=1
            run_check "$warmup"
          fi
          echo "参考: ウォームアップ起動（計測には使わない）: $(cat "$warmup" 2>/dev/null || echo '(計測なし)')"

          if ! run_check "$measure"; then
            echo "FUSE 経由で起動できなかったため、APPIMAGE_EXTRACT_AND_RUN=1 で再試行します" >&2
            export APPIMAGE_EXTRACT_AND_RUN=1
            run_check "$measure"
          fi

      # 起動の検証（macOS）。**追加のランナー設定は不要**だが、Apple Silicon では
      # コード署名が必須であるため、`tauri.conf.json` の
      # `bundle.macOS.signingIdentity` に疑似 identity `-`（ad-hoc 署名）を設定してある
      # （Tauri 公式ドキュメント「macOS Code Signing → Ad-Hoc Signing」）。これが無いと
      # tauri-bundler は署名自体を省略し（app.rs の分岐）、配布物が起動できない可能性がある。
      # ランナー自体はウィンドウサーバを持つ VM で、GUI アプリの起動とウィンドウの観測が
      # できる（GitHub-hosted macOS ランナー上での GUI アプリ起動の実例がある）。
      # 観測は CoreGraphics の `CGWindowListCopyWindowInfo` で行う。画面収録の許可を
      # 要する情報（ウィンドウ名）は使わず、所有者 pid・レイヤー・寸法だけで判定する。
      #
      # 同じスパイクが**起動からウィンドウ表示までの時間**も計測する（tasks.md 10.3 /
      # 要件 1.3, 6.8）。計測区間の始点を起動の瞬間に取るため、**アプリの起動も
      # スパイク自身が行う**（シェルが先に起動してから `swift` の起動を待つと、
      # 待った分だけ計測値が小さく出る）。値は `target/startup-measurements.txt` に
      # `macos=<ミリ秒>` として書き、CI の出力にも出す。
      - name: Verify bundle opens a window (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="target/release/bundle/macos/jxcel.app/Contents/MacOS/jxcel"
          SPIKE="$RUNNER_TEMP/check-window.swift"
          LOG="$RUNNER_TEMP/jxcel-macos.log"
          MEASURE="target/startup-measurements.txt"
          if [ ! -x "$APP" ]; then
            echo "NG: 配布物の実行ファイルがありません: $APP" >&2
            exit 1
          fi
          rm -f "$MEASURE"
          cat > "$SPIKE" <<'SWIFT'
          import CoreGraphics
          import Darwin
          import Foundation

          // 起動から操作可能なウィンドウが現れるまでの時間を計測する（tasks.md 10.3）。
          //
          // アプリの起動は**このスパイク自身**が行う。計測区間の始点を起動の瞬間に
          // 取れるのはここだけである。シェルが `nohup ... &` してから `swift`
          // （インタプリタ）の起動を待って計時を始めると、アプリが先に動き出した分
          // だけ計測値が**小さく**出る（＝予算判定が甘くなる）。逆にシェル側で
          // `swift` の前後を計るとインタプリタの起動時間が混ざって**大きく**出る。
          // 始点は `Process.run()` の直前、終点は対象 pid の通常レイヤー（0）の
          // 100x100 以上のウィンドウを観測した時刻である。観測は 0.1 秒ごと。
          let appPath = CommandLine.arguments[1]
          let logPath = CommandLine.arguments[2]
          let measurePath = CommandLine.arguments[3]
          let timeoutSeconds = 60.0

          _ = FileManager.default.createFile(atPath: logPath, contents: nil)
          let process = Process()
          process.executableURL = URL(fileURLWithPath: appPath)
          if let handle = try? FileHandle(forWritingTo: URL(fileURLWithPath: logPath)) {
              process.standardOutput = handle
              process.standardError = handle
          }

          let start = Date()
          do {
              try process.run()
          } catch {
              FileHandle.standardError.write("NG: アプリを起動できません: \(error)\n".data(using: .utf8)!)
              exit(1)
          }
          let pid = process.processIdentifier
          let deadline = start.addingTimeInterval(timeoutSeconds)

          func stop() {
              process.terminate()
              Thread.sleep(forTimeInterval: 0.5)
              if process.isRunning { kill(process.processIdentifier, SIGKILL) }
          }

          while Date() < deadline {
              if !process.isRunning {
                  FileHandle.standardError.write("NG: アプリがウィンドウを出す前に終了しました\n".data(using: .utf8)!)
                  exit(1)
              }
              if let list = CGWindowListCopyWindowInfo([.optionAll], kCGNullWindowID) as? [[String: Any]] {
                  for w in list {
                      guard let owner = w[kCGWindowOwnerPID as String] as? Int, owner == Int(pid) else { continue }
                      guard let layer = w[kCGWindowLayer as String] as? Int, layer == 0 else { continue }
                      guard let b = w[kCGWindowBounds as String] as? [String: Any],
                            let width = b["Width"] as? Double, let height = b["Height"] as? Double,
                            width >= 100, height >= 100 else { continue }
                      // 計測値は「観測した時刻」なので、実際の表示より最大 0.1 秒
                      // 大きく出る（保守側）。
                      let elapsedMs = Int(Date().timeIntervalSince(start) * 1000)
                      try? "macos=\(elapsedMs)\n".write(toFile: measurePath, atomically: true, encoding: .utf8)
                      print("OK: ウィンドウ \(Int(width))x\(Int(height)) が現れました (pid=\(pid), 起動から \(elapsedMs) ms)")
                      print("計測値: macos=\(elapsedMs)（書き出し先 \(measurePath)）")
                      stop()
                      exit(0)
                  }
              }
              Thread.sleep(forTimeInterval: 0.1)
          }
          FileHandle.standardError.write("NG: \(Int(timeoutSeconds)) 秒以内にウィンドウが現れませんでした\n".data(using: .utf8)!)
          stop()
          exit(1)
          SWIFT
          # 冷えたランナーの**初回起動だけ**が持つ一度きりのコスト（WebKit / AppKit の
          # フレームワーク読み込み、フォントや各種キャッシュの初回構築、OS の初回 GUI 起動）を
          # 計測区間へ混ぜない。要件 1.3 の根拠である Tauri の公式ベンチは**ウォーム実行**
          # （3 回のウォームアップを捨てる。research.md「起動時間」）であり、ここでも 1 回
          # 起動して捨ててから計測する。冷えた値も情報として出力する（判定には使わない）。
          WARMUP="$RUNNER_TEMP/jxcel-macos-warmup-measure.txt"
          rm -f "$WARMUP"
          swift "$SPIKE" "$APP" "$LOG" "$WARMUP" >/dev/null 2>&1 || true
          echo "参考: ウォームアップ起動（計測には使わない）: $(cat "$WARMUP" 2>/dev/null || echo '(計測なし)')"

          status=0
          swift "$SPIKE" "$APP" "$LOG" "$MEASURE" || status=$?
          if [ "$status" -ne 0 ]; then
            echo "--- アプリの出力 ---" >&2
            cat "$LOG" >&2 || true
          fi
          exit "$status"

      # 起動の検証（Windows）。**仮想ディスプレイのような追加設定は不要**である。
      # ウィンドウの有無は .NET の `Process.MainWindowHandle` で判定する。これは
      # 呼び出し元と同じデスクトップ上のトップレベルウィンドウを列挙するため、
      # ランナーの子プロセスとして起動したアプリに対して成立する（デスクトップが
      # 可視かどうかに依存しない）。
      # 検証対象は配布物（NSIS インストーラ `target/release/bundle/nsis/*-setup.exe`）を
      # `/S` で無人インストールして得られる実行ファイルである。既定の installMode は
      # `currentUser` なので導入先は `%LOCALAPPDATA%\jxcel\jxcel.exe` になる。
      # WebView2 ランタイムが導入されていない場合は、インストーラが bootstrapper を
      # 取得して `/silent /install` で導入する（既定の downloadBootstrapper）。
      #
      # 同じポーリングが**起動からウィンドウ表示までの時間**も計測する（tasks.md 10.3 /
      # 要件 1.3, 6.8）。計測区間の始点は OS が記録したプロセス生成時刻
      # （`Process.StartTime`）である。`Start-Process` の戻りを待ってから計ると
      # その待ち時間の分だけ計測値が小さく出る。値は `target/startup-measurements.txt`
      # に `windows=<ミリ秒>` として書き、CI の出力にも出す。
      - name: Verify bundle opens a window (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem "target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS インストーラが見つかりません" }

          # 「追加のインストールを要求せずに起動する」ことの前提を記録する（要件 1.2、tasks.md 10.4）。
          # WebView2 ランタイムが無い環境では、インストーラが bootstrapper を取得して
          # `/silent /install` で導入する（既定の downloadBootstrapper。上のコメント）。**ランナー
          # には通常プリインストール済み**なので、この経路は実際には走らないことが多い — その事実も
          # 出力に残し、「証明できていないこと」を隠さない。導入済みの判定は EdgeUpdate の
          # クライアント登録（`pv` に版）で行う。
          $wv2Keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}",
            "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          )
          function Get-WebView2Version {
            foreach ($key in $wv2Keys) {
              if (Test-Path $key) {
                $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
                if ($version) { return $version }
              }
            }
            return $null
          }
          $wv2Before = Get-WebView2Version
          if ($wv2Before) {
            Write-Host "WebView2 ランタイム: 導入済み (pv=$wv2Before) — bootstrapper の経路はこの実行では走らない"
          } else {
            Write-Host "WebView2 ランタイム: 未導入 — bootstrapper が /silent /install で導入する経路を実測する"
          }

          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait

          if (-not $wv2Before) {
            $wv2After = Get-WebView2Version
            if (-not $wv2After) { throw "WebView2 ランタイムが導入されていない（bootstrapper が動いていない）" }
            Write-Host "WebView2 ランタイム: 無人導入で導入された (pv=$wv2After) — 利用者の操作は無い"
          }

          $exe = Join-Path $env:LOCALAPPDATA "jxcel\jxcel.exe"
          if (-not (Test-Path $exe)) {
            $found = Get-ChildItem -Path $env:LOCALAPPDATA -Filter "jxcel.exe" -Recurse -Depth 3 -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) { $exe = $found.FullName }
          }
          if (-not (Test-Path $exe)) { throw "導入された実行ファイルが見つかりません" }

          $measure = "target/startup-measurements.txt"
          if (Test-Path $measure) { Remove-Item $measure -Force }

          # 冷えたランナーの**初回起動だけ**が持つ一度きりのコスト（WebView2 ランタイムの
          # 初回読み込み。research.md「起動時間」は「Windows の初回起動はページキャッシュに
          # 乗っていないため定常状態より悪い」と記す）を計測区間へ混ぜない。要件 1.3 の根拠で
          # ある Tauri の公式ベンチは**ウォーム実行**であり、ここでも 1 回起動して捨ててから
          # 計測する。冷えた値も情報として出力する（判定には使わない）。
          $warmMeasure = $null
          $warm = Start-Process -FilePath $exe -PassThru
          $warmStart = $warm.StartTime
          $warmDeadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $warmDeadline) {
            Start-Sleep -Milliseconds 100
            if ($warm.HasExited) { break }
            $warm.Refresh()
            if ($warm.MainWindowHandle -ne 0) {
              $warmMeasure = [int]((Get-Date) - $warmStart).TotalMilliseconds
              break
            }
          }
          if (-not $warm.HasExited) { Stop-Process -Id $warm.Id -Force }
          $warmText = if ($null -ne $warmMeasure) { "$warmMeasure" } else { "(計測なし)" }
          Write-Host "参考: ウォームアップ起動（計測には使わない）: windows=$warmText"

          $p = Start-Process -FilePath $exe -PassThru
          $start = $p.StartTime
          $deadline = (Get-Date).AddSeconds(60)
          $title = $null
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 100
            if ($p.HasExited) { throw "アプリがウィンドウを出す前に終了しました (exit=$($p.ExitCode))" }
            $p.Refresh()
            if ($p.MainWindowHandle -ne 0) { $title = $p.MainWindowTitle; break }
          }
          if (-not $title) { throw "60 秒以内にウィンドウが現れませんでした" }
          if ($title -notmatch "jxcel") { throw "予期しないウィンドウタイトル: $title" }
          # 計測値は「観測した時刻」なので、実際の表示より最大 0.1 秒大きく出る（保守側）。
          $elapsedMs = [int]((Get-Date) - $start).TotalMilliseconds
          Set-Content -Path $measure -Value "windows=$elapsedMs" -Encoding ascii
          Write-Host "OK: ウィンドウ '$title' が現れました (pid=$($p.Id), 起動から $elapsedMs ms)"
          Write-Host "計測値: windows=${elapsedMs}（書き出し先 ${measure}）"
          Stop-Process -Id $p.Id -Force

      # 起動時間の予算判定（tasks.md 10.3 / 要件 1.3, 6.8）。
      #
      # 予算は**要件値の 2 秒**（SSD を搭載した 4 コア以上の一般的なデスクトップ環境で、
      # 起動から操作可能なウィンドウの表示まで）。判定は POSIX sh の
      # `scripts/check-startup-budget.sh` が行い、**引数なしで呼ぶ**（計測ファイルの場所も
      # 予算の閾値も既定値であり、CI から差し替えられない）。3 OS で同じスクリプトを使う。
      #
      # この段は `if:` を付けず 3 OS すべてで走る。各ランナーは自分の OS の起動検証だけを
      # 実行しており、**そのランナーが計測した 1 つの値**を判定する。マトリクスの 3 ジョブの
      # 出力（先の 3 つの起動検証の段と本スクリプトの両方）を合わせて 3 OS の計測値が CI の
      # 出力に現れ、予算超過のプラットフォームがあればそのランナーのこの段が非 0 で終わって
      # パイプライン全体が失敗する（要件 6.8）。3 つの値を 1 か所へ持ち寄って判定するには
      # ジョブの新設かジョブ間の依存が要り、**要件 6.2（プラットフォーム別の独立した検証
      # 系統を新設しない）に反する**ため、判定はランナーごとに閉じる。
      #
      # 余裕が最も薄いのは macOS（research.md の公式実測 1.564 秒）であり、実質的に最初に
      # 鳴るのは macOS の段である。判定は特定の 1 プラットフォームに絞らず、全計測値を同じ
      # 要件予算で行う（余裕最小のものが収まれば他も収まる、を系として満たす）。
      #
      # 終了コード: 0 = 予算内 / 1 = 予算超過 / 2 = 計測値が無い・解釈できない。
      # 2 は「計測が走らなかった」ことを無言で通さないための失敗である。
      - name: Startup time budget (2s from launch to operable window)
        shell: bash
        run: bash scripts/check-startup-budget.sh

      # ---------------------------------------------------------------------
      # 起動と描画の検証（tasks.md 10.4 / 要件 1.1, 1.2, 10.1, 10.4）
      #
      # 目的は 2 つである:
      #
      #   (1) 3 OS それぞれの**配布物**が起動し、ウィンドウが現れ、**初回描画が成立する**こと
      #       （要件 1.1, 1.2, 10.1）。ウィンドウの出現は直前の 1.5 の 3 段が既に確かめている
      #       （`check-x11-window.sh` / Swift スパイク / `MainWindowHandle`）が、**空の
      #       ウィンドウでも出現はする**。描画が成立したことの客観的な信号は 8.2 の
      #       `初回描画が成立した: label=… 画面=… 経過=… ms ラスタライザ=…` の記録行だけなので、
      #       ここで診断記録（4.4 の保存先）を読む。**この段は 10.3 の計測から分けてある** —
      #       計測の段（直前の 3 つの起動検証と予算判定）には一切触れず、別の起動として行う
      #       （計測値の意味を変えないため。10.3 の定義は「配布物を起動した瞬間 → ウィンドウを
      #       観測した瞬間」であり、この段の余分な待ちを計測区間へ混ぜてはならない）。
      #
      #   (2) **両方の最小画面**（`smoke-table` / `smoke-editor`）が 3 OS で描画されること
      #       （要件 10.4）。
      #
      # ## 検証用の形（`verification-triggers`）で起動する理由（重要）
      #
      # 要件 10.4 の完了状態は「配布物が起動し、表形式と文字編集の両方の画面が描画されたこと」
      # を求めるが、9.7 が 2 つの最小画面へ至る経路（`JXCEL_VERIFICATION_INITIAL_SCREEN`）は
      # **非既定の cargo feature `verification-triggers` の下にだけ存在する**。配布物（既定
      # ビルド）は環境変数を読まず、初期画面は 9.6 の空ウィンドウの画面のままである
      # （`src-tauri/src/window/mod.rs` の `initial_screen_script`。`strings` による不在確認が
      # 5.4 / 7.4 の片付けの規約）。したがって次の 2 択になる:
      #
      #   A. **配布物の検査はそのままにし**（起動＋ウィンドウ＋初回描画）、両画面は
      #      `--features verification-triggers` の**検証用の形**を起動して確かめる。
      #   B. 配布物にも両画面へ至る導線を与え（7.4 の登録口＋メニュー→フロントエンドの
      #      イベント）、3 OS でそれを駆動する。
      #
      # **A を採る。**理由:
      #   - B は「実用画面ではない・ユーザー向けの導線を持たない」という 9.7 の決定と
      #     `SmokeScreens` の契約（design.md「Frontend Layer」）に反する。ユーザーに見える
      #     メニュー項目を検証専用のために足すことは、配布物の挙動そのものを検証のために
      #     変えることになる。
      #   - B の駆動は OS ごとに別機構になる。macOS / Windows には AT-SPI が無く、メニューの
      #     キー注入は画面収録・アクセシビリティの許可に依存する（macOS の画面収録の許可は
      #     ランナーで安定して与えられない）。Linux では `XSendEvent` が使えるが、**3 OS 分の
      #     メニュー駆動を CI で安定させる保証が無い**。
      #   - A は配布物に検証専用のコードを一切足さない（上記の不在確認を破らない）。
      #   - **両方の形が共有するのは、10.4 の両画面のコード（`src/features/smoke/`）とシェルの
      #     登録簿・領域（`src/shell/Layout.tsx` / `src/shell/router.tsx`）である。**
      #     `npx tauri build` はそのたびに `beforeBuildCommand`（`npm run build`）をやり直すので、
      #     **2 つの形の `dist/` は同一ではない** — 検証用の形だけが検証専用の入口
      #     （`src/shell/verificationScreen.ts` / `src/shell/verificationBulk.ts`。前者は初期画面の
      #     選択、後者は 10.8 の一括転送の駆動）を持ち、配布物は Vite の `define`
      #     （`vite.config.ts` の `__JXCEL_VERIFICATION__`）がそれをバンドルから落とす。
      #     **以前の版のこのコメントは「埋め込み資産は配布物と同一である」と書いていたが、
      #     それは誤りであった**（検証専用入口の除外を入れる前から、検証専用の到達経路を持つ形と
      #     持たない形で `dist` は別物になり得る）。共有される資産は
      #     `scripts/check-bundle-forms.sh` が機械検査する（両方の形にスモーク画面と
      #     `jxcel-shell-region` があること、検証専用の識別子が配布物に無く検証用の形にあること）。
      #     配布物の描画は (1) の初回描画の記録が担保する。
      #
      # **トレードオフ（正直に記す）**: 検証用の形は**バンドルしない**リリース実行ファイル
      # （`JXCEL_VERIFICATION_BUILD=1 npx tauri build --no-bundle --features verification-triggers`
      # が作る `target/release/jxcel[.exe]`）を起動する。したがって CI が実測するのは「配布物
      # そのものが両画面を描く」ことではなく、「**配布物が起動して初回描画が成立し**、
      # **スモーク画面のコードとシェルの構造を共有する**検証用の形が両画面を描く」ことである。
      # 配布物の中に両画面へ至る入口が無いという 9.7 の決定と、要件 10.4 の文言の間の差は
      # ここに残る。
      #
      # ## 各 OS の証拠が何を証明するか（要件 1.1, 1.2）
      #
      #   - **Linux**: AppImage を**そのまま実行する**（実行権限は配布物が持つ。deb の導入も
      #     `apt` も使わない）。FUSE が使えないランナー向けの `APPIMAGE_EXTRACT_AND_RUN=1` は
      #     自分自身を一時領域へ展開する実行であり、インストールではない（1.5 と同じ退避）。
      #   - **macOS**: `.app` の中の実行ファイルを直接起動する（インストーラを使わない）。
      #     WebView は OS 提供の WKWebView。配布物は ad-hoc 署名であり、Gatekeeper / 公証は
      #     本スペックの非目標である（1.5）。
      #   - **Windows**: 配布物は NSIS インストーラである。**`/S` の無人導入**（直前の 1.5 の段）
      #     の後に、導入された実行ファイルを起動する（利用者の操作は無い）。WebView2 は導入済み
      #     ならそれを使い、無ければインストーラの bootstrapper が `/silent /install` で導入する
      #     （既定の downloadBootstrapper）。**導入前後のランタイムの有無は 1.5 の段が出力する**
      #     ので、どちらの経路を通ったかが CI のログに現れる。
      #   - **限界**: ランナーは素の利用者機ではない。Linux はビルド用の開発パッケージが入って
      #     おり（同梱ライブラリが壊れていても気付けない）、macOS / Windows は WebView が OS に
      #     同梱されている。したがって CI が証明するのは「配布物が追加のインストール手順を
      #     要求せず、そのまま起動して描画すること」であり、「依存が 1 つも欠けた最も素の環境で
      #     動くこと」ではない。
      #
      # ## 画面の識別（証拠の形。**要求ではなく、実際に描画された画面を証明する**）
      #
      # 証明に使うのは、8.2 の成立行が運ぶ `画面=<識別子>` である。フロントエンド
      # （`src/shell/renderHeartbeat.ts`）が通知の時点でシェルの領域
      # （`[data-testid="jxcel-shell-region"]` の `data-shell-screen`。9.1 の契約）を読み、
      # 境界の型 `RenderHeartbeatRequest.screen`（`crates/app-shell/src/ipc/mod.rs`）に載せ、
      # アダプタ（`src-tauri/src/watchdog.rs`）が
      # `初回描画が成立した: label=… 画面=… 経過=… ms ラスタライザ=…` の行に出し、診断記録
      # （4.4 の保存先）へ落ちる。**3 OS はいずれも同じ綴りの記録を出す**ので、段は
      # プラットフォームごとの別機構（macOS の画面収録の許可、Windows の UI Automation、
      # Linux の AT-SPI）を足さずに画面を判定できる。
      #
      # **報告されるのは「実際に描画されていた画面」である（要求した識別子ではない）。**
      # 起動時の指定が登録簿に無ければ、フロントエンドは警告 1 行を残して既定の初期画面へ
      # 落ちる（9.7 の契約。`src/shell/verificationScreen.ts`）ので、`画面=empty-window` が
      # 報告される。したがって**未登録の識別子を渡すと段は非 0 で落ちる**。旧い形は要求の行
      # `検証用の初期画面を指定した: screen=<識別子>`（`window/mod.rs` が**要求**を記録する
      # だけの行）を証明にしていたため、存在しない画面でも緑になった（レビューで再現された
      # 反証）。**要求の行は起動の識別として残すが、証明からは外す。**
      #
      # 識別子の綴りは画面ファイルの単一定義（`TABLE_SMOKE_SCREEN_ID` /
      # `EDITOR_SMOKE_SCREEN_ID`）と一致していなければならない。**配布物にも期待を渡す** —
      # 配布物は環境変数を読まないので要求は無視されるが、初期画面は 9.6 の空ウィンドウの画面
      # であり、`画面=empty-window` が報告されることを要求できる（配布物でも画面の報告経路が
      # 働いていることの証明になる）。
      #
      # 段が要求するものは 3 つである（**どれか 1 つでも欠けたらその段は非 0 で終わる**）:
      #   1. ウィンドウが現れたこと（1.5 と同じ観測）
      #   2. 8.2 の成立行（`初回描画が成立した: label=…`。ソフトウェアラスタライザ経由の
      #      `初回描画は成立したがソフトウェアラスタライザ経由である: label=…` も描画の成立
      #      である — 遅いだけで描かれている）
      #   3. **その成立行が `画面=<期待する識別子>` を報告していること**（実際に描画された画面）
      # 要求の行 `検証用の初期画面を指定した: screen=<識別子>` は、あれば起動の識別として出し、
      # **存在は要求しない**（配布物はこの行を出さない）。
      #
      # 診断記録の保存先（4.4 の解決）と、5.2 が書く記録中のファイル名 `jxcel.log`:
      #   Linux   : $XDG_DATA_HOME/{識別子}/logs（無ければ $HOME/.local/share/{識別子}/logs）
      #   macOS   : $HOME/Library/Logs/{識別子}（`logs` 接尾辞は付かない）
      #   Windows : %LOCALAPPDATA%\{識別子}\logs
      # 識別子は bundle identifier `com.jxcel.app`（4.4 / 5.1）。
      # ---------------------------------------------------------------------

      # 検証用の形（バンドルしない）。**配布物を上書きしない** — `--no-bundle` なので直前までに
      # 生成した配布物（AppImage / deb / .app / dmg / NSIS インストーラ）はそのまま残り、
      # `target/release/jxcel[.exe]` だけが差し替わる。
      #
      # **`JXCEL_VERIFICATION_BUILD=1` がフロントエンドを検証用の形にする**（`vite.config.ts` の
      # `__JXCEL_VERIFICATION__`）。cargo の feature は TypeScript を括れないため、検証専用の
      # モジュール（`src/shell/verificationScreen.ts` / `src/shell/verificationBulk.ts`）の出入りは
      # この環境変数が決める。`beforeBuildCommand`（`npm run build`）はこの環境変数を継承するので、
      # **tauri CLI のコマンド自体は変えずに済む**。`env:` で渡すのは、Windows ランナーの既定の
      # シェル（pwsh）では `VAR=1 cmd` の前置が使えないためである。
      #
      # したがって検証用の形の `dist/` は**配布物の `dist/` とは同一ではない**（配布物は
      # 検証専用の入口を持たない）。両者が共有するものは上の「方式 A」の節を参照。
      - name: Build verification form (no bundle, --features verification-triggers)
        env:
          JXCEL_VERIFICATION_BUILD: "1"
        run: npx tauri build --no-bundle --features verification-triggers

      # 10.4 の方式 A の前提（**両方の形がスモーク画面のコードとシェルの構造を共有する**）の
      # 機械検査（要件 10.4）。直前の 2 つのビルドはどちらも `npm run build` をやり直すので、
      # 埋め込み資産は同一ではない — **等しくなければならないもの**（両方の形に
      # `smoke-table` / `smoke-editor` / `jxcel-shell-region` があること）と、
      # **違わなければならないもの**（配布物の `dist/` に検証専用の識別子が無く、検証用の形には
      # あること＝検証の錠前が空回りしていないこと）を突き合わせる。入力は
      # `target/shipping-frontend-dist`（配布物のビルドの直後に退避したもの）と、いま書かれた `dist/`。
      - name: Check both frontend forms share the smoke-screen code
        shell: bash
        run: bash scripts/check-bundle-forms.sh target/shipping-frontend-dist dist

      # Linux の描画検証（tasks.md 10.4）。4 回起動する（配布物・smoke-table・smoke-editor・
      # 反証）。検査本体は POSIX sh の `scripts/check-x11-render.sh`（ローカルでも同じものを
      # 実行できる）。第 7 引数は**期待する「描画された画面」**である（要求した識別子ではない）。
      - name: Verify first paint and both smoke screens render (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          # 4.4 の解決（Linux はアプリケーションデータ領域の下の logs。空の XDG_DATA_HOME は
          # 未設定として $HOME へ落ちる — アプリ側の解決と同じ）。
          record="${XDG_DATA_HOME:-$HOME/.local/share}/com.jxcel.app/logs/jxcel.log"
          echo "診断記録: $record"
          set -- target/release/bundle/appimage/*.AppImage
          appimage=$1
          # 配布物は環境変数を読まない（9.7）ので初期画面は 9.6 の空ウィンドウの画面である。
          # それでも `画面=empty-window` を要求する — **配布物でも画面の報告経路が働いている
          # こと**の証明になる（要求は無視されるが、期待は成立する）。
          echo "検証 1/4: 配布物（AppImage）を直接起動する。追加のインストール手順は無い（deb の導入も apt も使わない）"
          if ! xvfb-run -a --server-args="-screen 0 1280x1024x24" \
               sh scripts/check-x11-render.sh "$appimage" jxcel 60 100 100 "$record" empty-window; then
            echo "FUSE 経由で起動できなかったため、APPIMAGE_EXTRACT_AND_RUN=1 で再試行します" >&2
            export APPIMAGE_EXTRACT_AND_RUN=1
            xvfb-run -a --server-args="-screen 0 1280x1024x24" \
              sh scripts/check-x11-render.sh "$appimage" jxcel 60 100 100 "$record" empty-window
          fi
          echo "検証 2/4: 表形式の最小画面 smoke-table（検証用の形。スモーク画面のコードとシェルの構造は配布物と共通）"
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            sh scripts/check-x11-render.sh target/release/jxcel jxcel 60 100 100 "$record" smoke-table
          echo "検証 3/4: 文字編集の最小画面 smoke-editor（検証用の形。スモーク画面のコードとシェルの構造は配布物と共通）"
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            sh scripts/check-x11-render.sh target/release/jxcel jxcel 60 100 100 "$record" smoke-editor
          # 反証: 埋め込み可能だが**登録簿に無い**識別子を期待として渡す。実際に描画されるのは
          # 既定の空ウィンドウの画面（9.7 の契約で既定へ落ちる）なので、検査は
          # 「描画された画面が期待と一致しない」で非 0 で落ちなければならない。**落ちなかった
          # らこの段を失敗させる** — 検査が描画された画面を見ていないことになる。
          echo "検証 4/4: 反証 — 登録簿に無い識別子 no-such-screen で検査が非 0 で落ちること"
          rc=0
          output=$(xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            sh scripts/check-x11-render.sh target/release/jxcel jxcel 60 100 100 "$record" no-such-screen 2>&1) || rc=$?
          printf '%s\n' "$output"
          if [ "$rc" -eq 0 ]; then
            echo "NG: 未登録の画面の識別子で検査が成功してしまった（描画された画面を証明していない）" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" |
            grep -q "描画された画面が期待と一致しません: 期待 screen=no-such-screen / 実際 screen=empty-window"; then
            echo "NG: 反証が「描画された画面の不一致」以外の理由で落ちた（検査器が動いていない可能性がある）" >&2
            exit 1
          fi
          echo "反証: 期待どおり非 0 で落ちました（実際に描画された画面は empty-window）"

      # macOS の描画検証（tasks.md 10.4）。3 回起動する（配布物・smoke-table・smoke-editor）。
      # ウィンドウの観測は 1.5 のスパイクと同じ CoreGraphics の列挙（所有者 pid・レイヤー・寸法のみ。
      # 画面収録の許可を要するウィンドウ名は使わない）。描画と**描画された画面**は診断記録を読む。
      #
      # **アプリの標準出力・標準誤差は診断記録とは別のファイルへ書く。**同じファイルへ書くと、
      # アプリ（`TargetKind::Stdout`）と診断記録（5.2 の `TargetKind::Folder`）が**独立した 2 つの
      # 書き手**として同じファイルを offset 0 と EOF から触り、アプリ側が先頭から上書きして
      # `初回描画が成立した` の行を壊しうる（偽の失敗）。Linux / Windows の段は最初から別ファイル
      # である（`>"$log"` / `Start-Process` の既定）。
      - name: Verify first paint and both smoke screens render (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # 4.4 の解決（macOS は $HOME/Library/Logs/{識別子}。`logs` 接尾辞は付かない）。
          record="$HOME/Library/Logs/com.jxcel.app/jxcel.log"
          appout="$RUNNER_TEMP/jxcel-app-output.log"
          mkdir -p "$(dirname "$record")"
          echo "診断記録: $record"
          echo "アプリの出力: ${appout}（記録とは別ファイル）"
          spike="$RUNNER_TEMP/check-render.swift"
          cat > "$spike" <<'SWIFT'
          import CoreGraphics
          import Darwin
          import Foundation

          // アプリを起動してウィンドウを観測し、診断記録から初回描画（8.2）と**描画された画面**
          // （10.4）の行を読む。
          // 引数: <実行ファイル> <期待する画面の識別子|空> <記録ファイル> <アプリ出力ファイル> <タイムアウト秒>
          //
          // **記録とアプリの出力は別のファイルである。**アプリの標準出力・標準誤差を記録へ
          // つなぐと、アプリと診断記録（`TargetKind::Folder`）が同じファイルへ独立に書く
          // ことになり、アプリ側が先頭から上書きして記録の行を壊しうる。計測（10.3）は
          // 1.5 の段が別に行うので、ここでは計時しない。
          let appPath = CommandLine.arguments[1]
          let expectedScreen = CommandLine.arguments[2]
          let recordPath = CommandLine.arguments[3]
          let appOutputPath = CommandLine.arguments[4]
          let timeoutSeconds = Double(CommandLine.arguments[5]) ?? 60.0

          // 8.2 の成立行は 2 つある（`Painted` とソフトウェアラスタライザ経由）。**どちらも
          // 描画の成立である**（後者は遅いだけ）。
          let heartbeatPatterns = [
              "初回描画が成立した: label=",
              "初回描画は成立したがソフトウェアラスタライザ経由である: label=",
          ]
          let requestedPattern = "検証用の初期画面を指定した: screen=\(expectedScreen)"

          func recordText() -> String {
              return (try? String(contentsOfFile: recordPath, encoding: .utf8)) ?? ""
          }

          /// 成立行が報告する**実際に描画されていた画面**を取る（`画面=<識別子>`）。
          func renderedScreen(in line: String) -> String? {
              guard let range = line.range(of: "画面=") else { return nil }
              let rest = line[range.upperBound...]
              return rest.split(separator: " ", maxSplits: 1).first.map { String($0) }
          }

          func tail(_ path: String, _ count: Int) -> [String] {
              return ((try? String(contentsOfFile: path, encoding: .utf8)) ?? "")
                  .split(separator: "\n").suffix(count).map { String($0) }
          }

          func fail(_ message: String) -> Never {
              FileHandle.standardError.write("NG: \(message)\n".data(using: .utf8)!)
              FileHandle.standardError.write("--- 診断記録（末尾）: \(recordPath) ---\n".data(using: .utf8)!)
              for line in tail(recordPath, 20) {
                  FileHandle.standardError.write("\(line)\n".data(using: .utf8)!)
              }
              FileHandle.standardError.write("--- アプリの出力（末尾）: \(appOutputPath) ---\n".data(using: .utf8)!)
              for line in tail(appOutputPath, 40) {
                  FileHandle.standardError.write("\(line)\n".data(using: .utf8)!)
              }
              exit(1)
          }

          // 記録とアプリの出力を空にしてから起動する（前回の起動の行で偽の成功をしない）。
          _ = FileManager.default.createFile(atPath: recordPath, contents: nil)
          _ = FileManager.default.createFile(atPath: appOutputPath, contents: nil)

          let process = Process()
          process.executableURL = URL(fileURLWithPath: appPath)
          var environment = ProcessInfo.processInfo.environment
          if expectedScreen.isEmpty {
              environment.removeValue(forKey: "JXCEL_VERIFICATION_INITIAL_SCREEN")
          } else {
              environment["JXCEL_VERIFICATION_INITIAL_SCREEN"] = expectedScreen
          }
          process.environment = environment
          // **アプリの出力は記録とは別のファイルへ。**配布物は環境変数を読まないので要求は
          // 無視されるが、期待（初期画面は 9.6 の空ウィンドウの画面）は成立する。
          if let handle = try? FileHandle(forWritingTo: URL(fileURLWithPath: appOutputPath)) {
              process.standardOutput = handle
              process.standardError = handle
          }

          let start = Date()
          do {
              try process.run()
          } catch {
              fail("アプリを起動できません: \(error)")
          }
          let pid = process.processIdentifier

          func stop() {
              process.terminate()
              Thread.sleep(forTimeInterval: 0.5)
              if process.isRunning { kill(process.processIdentifier, SIGKILL) }
          }

          // 1. ウィンドウの出現（1.5 と同じ観測: 通常レイヤーの 100x100 以上）。
          let windowDeadline = start.addingTimeInterval(timeoutSeconds)
          var windowLine: String? = nil
          while Date() < windowDeadline {
              if !process.isRunning {
                  stop()
                  fail("アプリがウィンドウを出す前に終了しました")
              }
              if let list = CGWindowListCopyWindowInfo([.optionAll], kCGNullWindowID) as? [[String: Any]] {
                  for window in list {
                      guard let owner = window[kCGWindowOwnerPID as String] as? Int, owner == Int(pid) else { continue }
                      guard let layer = window[kCGWindowLayer as String] as? Int, layer == 0 else { continue }
                      guard let bounds = window[kCGWindowBounds as String] as? [String: Any],
                            let width = bounds["Width"] as? Double, let height = bounds["Height"] as? Double,
                            width >= 100, height >= 100 else { continue }
                      let elapsedMs = Int(Date().timeIntervalSince(start) * 1000)
                      windowLine = "OK: ウィンドウ \(Int(width))x\(Int(height)) が現れました (pid=\(pid), 起動から \(elapsedMs) ms)"
                      break
                  }
              }
              if windowLine != nil { break }
              Thread.sleep(forTimeInterval: 0.1)
          }
          guard let observed = windowLine else {
              stop()
              fail("\(Int(timeoutSeconds)) 秒以内にウィンドウが現れませんでした")
          }
          print(observed)

          // 2. 初回描画（8.2）の成立行と、そこに載る**描画された画面**（10.4）を待つ。8.2 の
          //    期限はウィンドウ生成から 3 秒なので、これを大きく超える猶予で足りる。
          let renderDeadline = Date().addingTimeInterval(20.0)
          var heartbeat: String? = nil
          var actual: String? = nil
          while Date() < renderDeadline {
              for line in recordText().split(separator: "\n") {
                  let text = String(line)
                  if heartbeatPatterns.contains(where: { text.contains($0) }) {
                      heartbeat = text
                      actual = renderedScreen(in: text)
                  }
              }
              if heartbeat != nil {
                  // 期待が空なら成立だけでよい。期待があるなら**描画された画面**が一致する
                  // ことを要求する（通知はウィンドウごとに 1 回なので、待っても変わらない）。
                  if expectedScreen.isEmpty { break }
                  if actual == expectedScreen { break }
                  stop()
                  let actualText = actual ?? "（報告なし）"
                  fail("描画は成立しましたが、描画された画面が期待と一致しません: 期待 screen=\(expectedScreen) / 実際 screen=\(actualText)（起動時の指定が登録簿に無いか、描画が既定の画面へ落ちています）")
              }
              if !process.isRunning { break }
              Thread.sleep(forTimeInterval: 0.2)
          }
          guard let painted = heartbeat else {
              stop()
              fail("初回描画の成立行（'\(heartbeatPatterns[0])'）が 20 秒以内に現れませんでした（初回描画が成立していない）")
          }
          print("初回描画: \(painted)")
          if !expectedScreen.isEmpty {
              let actualText = actual ?? "（報告なし）"
              print("描画された画面: \(actualText)（期待 \(expectedScreen)）")
              // 要求の行は**証明ではなく起動の識別**として出す（あれば。配布物は出さない）。
              for line in recordText().split(separator: "\n") where String(line).contains(requestedPattern) {
                  print("初期画面の指定: \(line)")
              }
          }
          stop()
          exit(0)
          SWIFT
          # 3 回とも**期待する「描画された画面」**を渡す（配布物は要求を無視するが、初期画面は
          # 9.6 の空ウィンドウの画面なので `画面=empty-window` が成立する）。
          echo "検証 1/3: 配布物（.app）をそのまま起動する。追加のインストール手順は無い（インストーラを使わない）"
          swift "$spike" "target/release/bundle/macos/jxcel.app/Contents/MacOS/jxcel" "empty-window" "$record" "$appout" 60
          echo "検証 2/3: 表形式の最小画面 smoke-table（検証用の形。スモーク画面のコードとシェルの構造は配布物と共通）"
          swift "$spike" target/release/jxcel smoke-table "$record" "$appout" 60
          echo "検証 3/3: 文字編集の最小画面 smoke-editor（検証用の形。スモーク画面のコードとシェルの構造は配布物と共通）"
          swift "$spike" target/release/jxcel smoke-editor "$record" "$appout" 60

      # Windows の描画検証（tasks.md 10.4）。3 回起動する（配布物・smoke-table・smoke-editor）。
      # ウィンドウの観測は 1.5 の段と同じ `MainWindowHandle`。描画と**描画された画面**は診断記録を
      # 読む（第 2 引数は**期待する「描画された画面」**であり、要求した識別子ではない）。
      - name: Verify first paint and both smoke screens render (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 4.4 の解決（Windows は %LOCALAPPDATA%\{識別子}\logs）。
          $record = Join-Path $env:LOCALAPPDATA "com.jxcel.app\logs\jxcel.log"
          New-Item -ItemType Directory -Force -Path (Split-Path $record) | Out-Null
          Write-Host "診断記録: $record"

          # 8.2 の成立行は 2 つある（`Painted` とソフトウェアラスタライザ経由）。**どちらも
          # 描画の成立である**（後者は遅いだけ）。
          $heartbeatPatterns = @(
            "初回描画が成立した: label=",
            "初回描画は成立したがソフトウェアラスタライザ経由である: label="
          )

          function Test-Render {
            param(
              [string]$Exe,
              [string]$Expected,
              [string]$What
            )
            if (-not (Test-Path $Exe)) { throw "${What}: 実行ファイルがありません: $Exe" }
            # **記録は起動の前に空にする**（前回の起動の行で偽の成功をしない）。
            if (Test-Path $record) { Remove-Item $record -Force }
            if ($Expected) { $env:JXCEL_VERIFICATION_INITIAL_SCREEN = $Expected }
            else { Remove-Item Env:\JXCEL_VERIFICATION_INITIAL_SCREEN -ErrorAction SilentlyContinue }
            $p = Start-Process -FilePath $Exe -PassThru
            try {
              $deadline = (Get-Date).AddSeconds(60)
              $title = $null
              while ((Get-Date) -lt $deadline) {
                Start-Sleep -Milliseconds 100
                if ($p.HasExited) { throw "${What}: アプリがウィンドウを出す前に終了しました (exit=$($p.ExitCode))" }
                $p.Refresh()
                if ($p.MainWindowHandle -ne 0) { $title = $p.MainWindowTitle; break }
              }
              if (-not $title) { throw "${What}: 60 秒以内にウィンドウが現れませんでした" }
              if ($title -notmatch "jxcel") { throw "${What}: 予期しないウィンドウタイトル: $title" }
              Write-Host "OK: ウィンドウ '$title' が現れました (pid=$($p.Id))"

              $heartbeat = $null
              $actual = $null
              $renderDeadline = (Get-Date).AddSeconds(20)
              while ((Get-Date) -lt $renderDeadline) {
                Start-Sleep -Milliseconds 200
                if (Test-Path $record) {
                  foreach ($line in (Get-Content -Path $record -Encoding UTF8)) {
                    foreach ($pattern in $heartbeatPatterns) {
                      if ($line -like "*$pattern*") { $heartbeat = $line }
                    }
                  }
                }
                if ($heartbeat) {
                  # 成立行が報告するのは**実際に描画されていた画面**である。通知はウィンドウごとに
                  # 1 回なので、待っても変わらない（8.2 の契約）。
                  $match = [regex]::Match($heartbeat, "画面=(\S+)")
                  $actual = if ($match.Success) { $match.Groups[1].Value } else { "（報告なし）" }
                  if (-not $Expected) { break }
                  if ($actual -eq $Expected) { break }
                  throw "${What}: 描画は成立しましたが、描画された画面が期待と一致しません: 期待 screen=$Expected / 実際 screen=${actual}（起動時の指定が登録簿に無いか、描画が既定の画面へ落ちています）"
                }
              }
              if (-not $heartbeat) { throw "${What}: 初回描画の成立行が 20 秒以内に現れませんでした（初回描画が成立していない）" }
              Write-Host "初回描画: $heartbeat"
              if ($Expected) {
                Write-Host "描画された画面: ${actual}（期待 ${Expected}）"
                # 要求の行は**証明ではなく起動の識別**として出す（あれば。配布物は出さない）。
                foreach ($line in (Get-Content -Path $record -Encoding UTF8)) {
                  if ($line -like "*検証用の初期画面を指定した: screen=$Expected*") { Write-Host "初期画面の指定: $line" }
                }
              }
            } finally {
              if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
              # プロセスの終了を待ってから戻る。次回の起動は診断記録を削除するので、直前の
              # プロセスが記録のハンドルを握ったままだと削除が失敗しうる（無言の取りこぼしを作らない）。
              if ($p) { $p.WaitForExit(5000) | Out-Null }
            }
          }

          # 導入先は 1.5 の段と同じ前提（既定の installMode は currentUser）。見つからない場合は
          # 1.5 の段と同じ探索に退避する（導入先が変わっても偽の失敗をしない）。
          $installed = Join-Path $env:LOCALAPPDATA "jxcel\jxcel.exe"
          if (-not (Test-Path $installed)) {
            $found = Get-ChildItem -Path $env:LOCALAPPDATA -Filter "jxcel.exe" -Recurse -Depth 3 -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) { $installed = $found.FullName }
          }
          if (-not (Test-Path $installed)) { throw "導入された実行ファイルが見つかりません: $installed" }
          # 配布物は環境変数を読まない（9.7）ので初期画面は 9.6 の空ウィンドウの画面である。
          # それでも `画面=empty-window` を要求する（配布物でも画面の報告経路が働くことの証明）。
          Write-Host "検証 1/3: 配布物（NSIS インストーラで /S 導入済みの実行ファイル）を起動する。追加の操作は無い"
          Test-Render -Exe $installed -Expected "empty-window" -What "配布物"
          Write-Host "検証 2/3: 表形式の最小画面 smoke-table（検証用の形。スモーク画面のコードとシェルの構造は配布物と共通）"
          Test-Render -Exe "target/release/jxcel.exe" -Expected "smoke-table" -What "画面 smoke-table"
          Write-Host "検証 3/3: 文字編集の最小画面 smoke-editor（検証用の形。スモーク画面のコードとシェルの構造は配布物と共通）"
          Test-Render -Exe "target/release/jxcel.exe" -Expected "smoke-editor" -What "画面 smoke-editor"

      # ---------------------------------------------------------------------
      # 単一インスタンス化と複数ウィンドウの経路の検証（tasks.md 10.5 / 要件 1.5, 2.3, 2.6）
      #
      # 3 つの経路を実測する:
      #   (a) アプリ起動中に配布物を再実行しても 2 つ目が常駐せず、既存のアプリにウィンドウが増える
      #   (b) ドキュメントを開くとウィンドウが増え、既存のウィンドウが閉じない（新しいウィンドウは doc-*）
      #   (c) 委譲先が拒否を返すとウィンドウが閉じず、拒否しないときは閉じる
      #
      # ## 実測する形（配布物と検証用の形の分担）
      #
      # 9.7 の片付けの規約により**配布物（既定のビルド）は検証専用の環境変数を読まない**。
      # したがって (a)/(b) は**配布物そのもの**で測り、(c) は非既定の `verification-triggers` を
      # 有効にした**検証用の形**（`target/release/jxcel[.exe]`。直前の 10.4 の段がビルドする）で
      # 測る。(c) の拒否は 7.6 の検証専用の委譲先（`JXCEL_VERIFICATION_DENY_CLOSE=<ラベル>`）で
      # 起こす。配布物に検証専用の識別子が入っていないこともこの節が確認する（5.4 の片付け）。
      #
      # ## 各 OS の証拠が何を証明し、何を証明しないか
      #
      #   - **Linux**: X のウィンドウツリー（`xwininfo -root -tree`。1.5 / 10.3 / 10.4 と同じ実装を
      #     `scripts/lib/x11-window.sh` から使う）で**ウィンドウの数と識別子**を数え、
      #     `WM_DELETE_WINDOW` を `XSendEvent`（`event_mask=0`）で送って閉鎖要求を起こす。
      #     ウィンドウのラベル（`doc-*` か）と拒否の往復は**診断記録**から取る。同じウィンドウ
      #     識別子が残っていることまで見られるので、**「既存が閉じない」をウィンドウ単位で**証明できる。
      #   - **macOS**: ウィンドウは CoreGraphics の列挙（10.4 と同じ。所有者 pid・レイヤー・寸法のみ。
      #     画面収録の許可を要するウィンドウ名は使わない）で数え、2 つ目の終了は `Process` で見る。
      #     数と pid だけなので**「増えた 1 枚がどのラベルか」は識別子では追えない**（同じ pid の
      #     ウィンドウ数が 1 増えたことまでが観測である。ラベルは診断記録の
      #     `ウィンドウを開いた: label=…` が示す）。**(c) の閉鎖要求は外から注入できない** —
      #     macOS で他プロセスのウィンドウを閉じる手段はアクセシビリティ API だけで、GitHub の
      #     macOS ランナーはそれを許可しない（actions/runner-images#8214。10.4 が画面収録の許可に
      #     依存しない判断をしたのと同じ理由）。したがって **(c) の拒否と許可の実測は Linux と
      #     Windows の段が担い**、macOS の段は注入できない事実を出力に残す。許可が与えられた
      #     環境では同じ段が閉じるボタンの押下で (c) を実測する（分岐は共通である）。
      #   - **Windows**: ウィンドウは `EnumWindows`（所有者 pid と**題名の完全一致**で絞る。
      #     単一インスタンスのプラグインは同名の隠しウィンドウ `com.jxcel.app-siw` を可視で作るため、
      #     題名の一致が要る）で数え、閉鎖要求は `PostMessage(WM_CLOSE)` で起こす（同一利用者・
      #     同一セッションなので許可は要らない）。ウィンドウハンドルの集合で「既存が閉じない」を
      #     見られる。ラベルは診断記録から取る。**限界**: ランナーは素の利用者機ではない（10.4 と同じ）。
      #
      # ## 終了コード
      #
      # Linux の段は `scripts/check-multi-window.sh`（0 = 3 経路すべて期待どおり / 1 = 検査失敗 /
      # 2 = 入力が使えない）が判定する。macOS / Windows の段は各スパイクが同じ 3 値で終わる。
      # **無言で通る経路は無い**（ウィンドウが現れない・2 つ目が終了しない・拒否が効かない、
      # のいずれも非 0 になる）。
      # ---------------------------------------------------------------------

      - name: Verify single instance and multi-window paths (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          # 4.4 の解決（Linux はアプリケーションデータ領域の下の logs。空の XDG_DATA_HOME は
          # 未設定として $HOME へ落ちる — アプリ側の解決と同じ）。
          record="${XDG_DATA_HOME:-$HOME/.local/share}/com.jxcel.app/logs/jxcel.log"
          echo "診断記録: $record"
          set -- target/release/bundle/appimage/*.AppImage
          appimage=$1
          # 展開先を変えた後（`cd` の後）でも同じファイルを指せるよう絶対パスにする。
          appimage=$(CDPATH='' cd -- "$(dirname -- "$appimage")" && pwd)/$(basename -- "$appimage")
          document="$RUNNER_TEMP/jxcel-10-5-document.txt"
          # 7.7 は位置を読まないが、渡す位置は実在させる（検査側も実在を要求する）。
          printf 'jxcel 10.5 の検証で開くドキュメント（内容は読まれない。tasks.md 7.7）\n' > "$document"

          # 配布物の実行ファイルに検証専用の識別子が入っていないこと（5.4 の片付けの規約）。
          # **AppImage の中身は squashfs（圧縮）である** — AppImage をそのまま `strings` にかけても
          # 圧縮された中身は現れないので、**取り出してから**調べる（`--appimage-extract` は FUSE を
          # 要さない。10.2 が補助プロセスの取り出しに使っているのと同じ機構）。
          extract="$RUNNER_TEMP/jxcel-10-5-extract"
          rm -rf "$extract"
          mkdir -p "$extract"
          ( cd "$extract" && "$appimage" --appimage-extract 'usr/bin/jxcel' >/dev/null )
          # **`strings -a … | grep -q` を使わない**（`grep -q` が早く読むのをやめると `strings` が
          # EPIPE で非 0 終了し、`pipefail` の下では一致していても pipeline が失敗する。macOS の
          # 段で実際に偽の失敗になった。`grep -c` は最後まで読む）。
          if [ "$(strings -a "$extract/squashfs-root/usr/bin/jxcel" | grep -c 'JXCEL_VERIFICATION' || true)" -ne 0 ]; then
            echo "NG: 配布物の実行ファイルに検証専用の識別子が入っています" >&2
            strings -a "$extract/squashfs-root/usr/bin/jxcel" | grep 'JXCEL_VERIFICATION' >&2
            exit 1
          fi
          rm -rf "$extract"
          if [ "$(strings -a target/release/jxcel | grep -c 'JXCEL_VERIFICATION_DENY_CLOSE' || true)" -eq 0 ]; then
            echo "NG: 検証用の形に JXCEL_VERIFICATION_DENY_CLOSE がありません（--features verification-triggers のビルドではない）" >&2
            exit 1
          fi
          echo "検証 (片付け): 配布物の実行ファイルに JXCEL_VERIFICATION は無く（strings -a で 0 件）、検証用の形は JXCEL_VERIFICATION_DENY_CLOSE を持つ"

          # 単一インスタンスはプラットフォームの機構に依存する（Linux は D-Bus のセッションバス。
          # design.md の既知のリスク）。ランナーの既定のバスを使い、`dbus-run-session` があるなら
          # **専用のバス**を用意して検査する（どちらでも同じ検査が走る）。
          check_multi_window() {
            if command -v dbus-run-session >/dev/null 2>&1; then
              xvfb-run -a --server-args="-screen 0 1280x1024x24" \
                dbus-run-session -- sh scripts/check-multi-window.sh \
                  "$appimage" target/release/jxcel jxcel 60 100 100 "$record" "$document" doc-1
            else
              xvfb-run -a --server-args="-screen 0 1280x1024x24" \
                sh scripts/check-multi-window.sh \
                  "$appimage" target/release/jxcel jxcel 60 100 100 "$record" "$document" doc-1
            fi
          }

          if ! check_multi_window; then
            echo "FUSE 経由で配布物を起動できなかったため、APPIMAGE_EXTRACT_AND_RUN=1 で再試行します" >&2
            export APPIMAGE_EXTRACT_AND_RUN=1
            check_multi_window
          fi

      # macOS の段（tasks.md 10.5）。ウィンドウの観測は 1.5 / 10.4 と同じ CoreGraphics の列挙で、
      # 2 つ目の起動の終了は `Process` で見る。**(c) の閉鎖要求はアクセシビリティ API でしか
      # 注入できない**（macOS にウィンドウマネージャの閉鎖プロトコルは無い）。GitHub の macOS
      # ランナーはその許可を与えない（actions/runner-images#8214）ため、**許可が無い場合は
      # (c) を注入せず、その事実を出力に残す** — (c) の拒否と許可の実測は Linux と Windows の
      # 段が担う。許可がある環境（開発機など）では同じ分岐が閉じるボタンの押下で (c) を実測する。
      - name: Verify single instance and multi-window paths (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # 4.4 の解決（macOS は $HOME/Library/Logs/{識別子}。`logs` 接尾辞は付かない）。
          record="$HOME/Library/Logs/com.jxcel.app/jxcel.log"
          mkdir -p "$(dirname "$record")"
          echo "診断記録: $record"
          dist="target/release/bundle/macos/jxcel.app/Contents/MacOS/jxcel"
          verify="target/release/jxcel"
          if [ ! -x "$dist" ]; then
            echo "NG: 配布物の実行ファイルがありません: $dist" >&2
            exit 1
          fi
          if [ ! -x "$verify" ]; then
            echo "NG: 検証用の形の実行ファイルがありません: $verify" >&2
            exit 1
          fi
          # 配布物に検証専用の識別子が入っていないこと（5.4 の片付けの規約）と、検証用の形には
          # 入っていること。(c) が実測するのは検証用の形である。
          #
          # **`strings -a … | grep -q` を使わない。** `grep -q` は一致した時点で読むのをやめる
          # （＝書き手のパイプを閉じる）ので、`strings` が EPIPE で非 0 終了し、`set -o pipefail`
          # の下では**一致していても pipeline が失敗する**（実測: 2026-09-12 の macOS のランナー。
          # Xcode の `strings` が `error: … strings: failed to flush output` を出し、
          # 下の「DENY_CLOSE が無い」が**偽の失敗**になった）。**`grep -c` は最後まで読む**。
          dist_markers=$(strings -a "$dist" | grep -c 'JXCEL_VERIFICATION' || true)
          if [ "$dist_markers" -ne 0 ]; then
            echo "NG: 配布物の実行ファイルに検証専用の識別子が入っています（$dist_markers 件）" >&2
            exit 1
          fi
          verify_markers=$(strings -a "$verify" | grep -c 'JXCEL_VERIFICATION_DENY_CLOSE' || true)
          if [ "$verify_markers" -eq 0 ]; then
            echo "NG: 検証用の形に JXCEL_VERIFICATION_DENY_CLOSE がありません（--features verification-triggers のビルドではない）" >&2
            exit 1
          fi
          echo "検証 (片付け): 配布物の実行ファイルに JXCEL_VERIFICATION は無く（strings -a で 0 件）、検証用の形は JXCEL_VERIFICATION_DENY_CLOSE を持つ"
          document="$RUNNER_TEMP/jxcel-10-5-document.txt"
          printf 'jxcel 10.5 の検証で開くドキュメント（内容は読まれない。tasks.md 7.7）\n' > "$document"
          output_prefix="$RUNNER_TEMP/jxcel-10-5-app"
          spike="$RUNNER_TEMP/check-multi-window.swift"
          cat > "$spike" <<'SWIFT'
          import ApplicationServices
          import CoreGraphics
          import Darwin
          import Foundation

          // 単一インスタンス化と複数ウィンドウの 3 経路を macOS 上で検査する（tasks.md 10.5）。
          // 引数: <配布物> <検証用の形> <記録ファイル> <アプリ出力の接頭辞> <ドキュメント位置>
          //       <題名> <タイムアウト秒>
          //
          // ウィンドウの観測は CoreGraphics（所有者 pid・レイヤー・寸法のみ。10.4 と同じ）。
          // **2 つのプロセスを同時に動かすので、数えるのは 1 つ目の pid のウィンドウだけ**である。
          let distApp = CommandLine.arguments[1]
          let verifyApp = CommandLine.arguments[2]
          let recordPath = CommandLine.arguments[3]
          let outputPrefix = CommandLine.arguments[4]
          let documentPath = CommandLine.arguments[5]
          let title = CommandLine.arguments[6]
          let timeoutSeconds = Double(CommandLine.arguments[7]) ?? 60.0

          var running: [Process] = []
          var outputCounter = 0

          func note(_ message: String) {
              print(message)
              fflush(stdout)
          }

          func recordLines() -> [String] {
              let text = (try? String(contentsOfFile: recordPath, encoding: .utf8)) ?? ""
              return text.split(separator: "\n", omittingEmptySubsequences: false).map(String.init)
          }

          // 記録の `<offset>` 行目より後から正規表現に一致する最初の行を待つ。
          func findLine(_ pattern: String, from offset: Int, seconds: Double) -> String? {
              let deadline = Date().addingTimeInterval(seconds)
              while true {
                  let lines = recordLines()
                  if lines.count > offset {
                      for line in lines[offset...] where line.range(of: pattern, options: .regularExpression) != nil {
                          return line
                      }
                  }
                  if Date() >= deadline { return nil }
                  Thread.sleep(forTimeInterval: 0.2)
              }
          }

          func countLines(_ pattern: String, from offset: Int) -> Int {
              let lines = recordLines()
              guard lines.count > offset else { return 0 }
              return lines[offset...].filter { $0.range(of: pattern, options: .regularExpression) != nil }.count
          }

          func windowCount(of pid: pid_t) -> Int {
              guard let list = CGWindowListCopyWindowInfo([.optionAll], kCGNullWindowID) as? [[String: Any]] else {
                  return 0
              }
              var count = 0
              for window in list {
                  guard let owner = window[kCGWindowOwnerPID as String] as? Int, owner == Int(pid) else { continue }
                  guard let layer = window[kCGWindowLayer as String] as? Int, layer == 0 else { continue }
                  guard let bounds = window[kCGWindowBounds as String] as? [String: Any],
                        let width = bounds["Width"] as? Double, let height = bounds["Height"] as? Double,
                        width >= 100, height >= 100 else { continue }
                  count += 1
              }
              return count
          }

          func waitForWindowCount(of pid: pid_t, atLeast expected: Int, seconds: Double) -> Int? {
              let deadline = Date().addingTimeInterval(seconds)
              while true {
                  let count = windowCount(of: pid)
                  if count >= expected { return count }
                  if Date() >= deadline { return nil }
                  Thread.sleep(forTimeInterval: 0.1)
              }
          }

          func waitForWindowsGone(of pid: pid_t, seconds: Double) -> Bool {
              let deadline = Date().addingTimeInterval(seconds)
              while true {
                  if windowCount(of: pid) == 0 { return true }
                  if Date() >= deadline { return false }
                  Thread.sleep(forTimeInterval: 0.1)
              }
          }

          func stopAll() {
              for process in running where process.isRunning {
                  process.terminate()
              }
              Thread.sleep(forTimeInterval: 0.5)
              for process in running where process.isRunning {
                  kill(process.processIdentifier, SIGKILL)
                  process.waitUntilExit()
              }
          }

          func fail(_ message: String) -> Never {
              FileHandle.standardError.write("NG: \(message)\n".data(using: .utf8)!)
              FileHandle.standardError.write("--- 診断記録（末尾）: \(recordPath) ---\n".data(using: .utf8)!)
              for line in recordLines().suffix(30) {
                  FileHandle.standardError.write("\(line)\n".data(using: .utf8)!)
              }
              stopAll()
              exit(1)
          }

          // アプリを起動する。検証専用の環境変数は親から漏らさず、`denyClose` のときだけ
          // `JXCEL_VERIFICATION_DENY_CLOSE` を、`exitAfterMs` のときだけ
          // `JXCEL_VERIFICATION_EXIT_AFTER_MS` を渡す（配布物はどちらも読まない）。
          func launch(_ executable: String, arguments: [String], denyClose: String?, exitAfterMs: String? = nil) -> Process {
              outputCounter += 1
              let outputPath = "\(outputPrefix)-\(outputCounter).log"
              _ = FileManager.default.createFile(atPath: outputPath, contents: nil)
              let process = Process()
              process.executableURL = URL(fileURLWithPath: executable)
              process.arguments = arguments
              var environment = ProcessInfo.processInfo.environment
              environment.removeValue(forKey: "JXCEL_VERIFICATION_DENY_CLOSE")
              environment.removeValue(forKey: "JXCEL_VERIFICATION_INITIAL_SCREEN")
              environment.removeValue(forKey: "JXCEL_VERIFICATION_EXIT_AFTER_MS")
              if let denyClose = denyClose {
                  environment["JXCEL_VERIFICATION_DENY_CLOSE"] = denyClose
              }
              if let exitAfterMs = exitAfterMs {
                  environment["JXCEL_VERIFICATION_EXIT_AFTER_MS"] = exitAfterMs
              }
              process.environment = environment
              if let handle = try? FileHandle(forWritingTo: URL(fileURLWithPath: outputPath)) {
                  process.standardOutput = handle
                  process.standardError = handle
              }
              do {
                  try process.run()
              } catch {
                  fail("アプリを起動できません: \(executable): \(error)")
              }
              running.append(process)
              return process
          }

          func waitForExit(_ process: Process, seconds: Double) -> Bool {
              let deadline = Date().addingTimeInterval(seconds)
              while process.isRunning {
                  if Date() >= deadline { return false }
                  Thread.sleep(forTimeInterval: 0.1)
              }
              return true
          }

          func stop(_ process: Process) {
              if process.isRunning { process.terminate() }
              let deadline = Date().addingTimeInterval(10)
              while process.isRunning && Date() < deadline { Thread.sleep(forTimeInterval: 0.1) }
              if process.isRunning { kill(process.processIdentifier, SIGKILL) }
              let reapDeadline = Date().addingTimeInterval(5)
              while process.isRunning && Date() < reapDeadline { Thread.sleep(forTimeInterval: 0.1) }
              process.waitUntilExit()
          }

          // アクセシビリティ API で「閉じる」ボタンを押す（許可が無ければ false）。
          func pressCloseButton(of pid: pid_t) -> Bool {
              guard AXIsProcessTrusted() else { return false }
              let application = AXUIElementCreateApplication(pid)
              var windowsValue: CFTypeRef?
              guard AXUIElementCopyAttributeValue(application, kAXWindowsAttribute as CFString, &windowsValue) == .success,
                    let windows = windowsValue as? [AXUIElement], let window = windows.first else { return false }
              var buttonValue: CFTypeRef?
              guard AXUIElementCopyAttributeValue(window, kAXCloseButtonAttribute as CFString, &buttonValue) == .success,
                    let button = buttonValue, CFGetTypeID(button) == AXUIElementGetTypeID() else { return false }
              return AXUIElementPerformAction(button as! AXUIElement, kAXPressAction as CFString) == .success
          }

          // **記録は消さない**（起動中のアプリが書き続ける）。各段の開始時の行数から後だけを調べる。
          _ = FileManager.default.createFile(atPath: recordPath, contents: nil)

          note("検証 (a)(b): 1 つ目として配布物を起動する（引数なし → ドキュメントを関連付けないウィンドウ）")
          let phaseAB = recordLines().count
          let first = launch(distApp, arguments: [], denyClose: nil)
          guard let firstWindows = waitForWindowCount(of: first.processIdentifier, atLeast: 1, seconds: timeoutSeconds) else {
              fail("1 つ目のウィンドウが \(Int(timeoutSeconds)) 秒以内に現れませんでした")
          }
          guard findLine("ウィンドウを開いた: label=empty-1 ", from: phaseAB, seconds: 10) != nil else {
              fail("1 つ目のウィンドウが label=empty-1 として記録に現れません")
          }
          note("検証 (a): 1 つ目の起動: pid=\(first.processIdentifier) ウィンドウ数=\(firstWindows)")

          note("検証 (a)(b): 同じ配布物を再度実行する（ドキュメント位置を渡す → 単一インスタンスが引数を引き渡す）")
          let second = launch(distApp, arguments: [documentPath], denyClose: nil)
          if !waitForExit(second, seconds: timeoutSeconds) {
              stop(second)
              fail("2 つ目の起動が \(Int(timeoutSeconds)) 秒以内に終了しません（常駐している。単一インスタンスが成立していない）")
          }
          if second.terminationStatus != 0 {
              fail("2 つ目の起動が終了コード \(second.terminationStatus) で終わった（0 であるべき）")
          }
          note("検証 (a): 2 つ目の起動は終了コード 0 で終わった（常駐しない）")
          if !first.isRunning {
              fail("2 つ目の起動の後に 1 つ目のプロセスが終了した")
          }
          guard let secondWindows = waitForWindowCount(of: first.processIdentifier, atLeast: firstWindows + 1, seconds: timeoutSeconds) else {
              fail("2 つ目の起動の後、ウィンドウ数が \(firstWindows + 1) 以上になりませんでした（引き継いだ側がウィンドウを提示していない）")
          }
          // **引き継ぎの行は待ち時間を長く取る（30 秒）。** 実測（2026-09-12 の macOS の
          // ランナー）: 3 つ目の起動（引数なし）が終了してから**最初のインスタンスが
          // `二重起動を引き継ぎました … ドキュメント要求なし` を記録するまで 10.4 秒**かかり、
          // 10 秒では足りなかった（最初のインスタンスはその間も生きており、他の行は書いている）。
          // 引き継ぎの**利用者から見える効果**（2 つ目が常駐せず、ウィンドウが増える）は別の
          // 主張として短い期限で見ているので、記録の行そのものは長めに待つ。
          guard let handover = findLine("二重起動を引き継ぎました.*ドキュメント要求 ", from: phaseAB, seconds: 30) else {
              fail("引き継ぎの行（二重起動を引き継ぎました … ドキュメント要求 …）が記録に現れません")
          }
          guard let docLabelLine = findLine("ウィンドウを開いた: label=doc-", from: phaseAB, seconds: 10) else {
              fail("新しいウィンドウが label=doc-*（ドキュメント付き）として記録に現れません")
          }
          let docLabel = docLabelLine.components(separatedBy: "label=").last?.components(separatedBy: " ").first ?? "(不明)"
          note("検証 (b): ウィンドウ数=\(secondWindows)（1 つ目=\(firstWindows) から 1 増えた。同じ pid のウィンドウを数えている）")
          note("検証 (b): 新しいウィンドウのラベル=\(docLabel)（doc-* ＝ ドキュメント付き。ラベルは記録が出す）")
          note("検証 (b): 記録（引き継ぎ）: \(handover)")

          note("検証 (a): 引数なしで再度実行する（既にあるウィンドウを前面に出すだけで、新しいウィンドウを作らない）")
          let phaseArgless = recordLines().count
          let third = launch(distApp, arguments: [], denyClose: nil)
          if !waitForExit(third, seconds: timeoutSeconds) {
              stop(third)
              fail("引数なしの 2 つ目の起動が \(Int(timeoutSeconds)) 秒以内に終了しません")
          }
          if third.terminationStatus != 0 {
              fail("引数なしの 2 つ目の起動が終了コード \(third.terminationStatus) で終わった（0 であるべき）")
          }
          guard let argless = findLine("二重起動を引き継ぎました.*ドキュメント要求なし", from: phaseArgless, seconds: 30) else {
              fail("引数なしの引き継ぎの行（… ドキュメント要求なし）が記録に現れません")
          }
          let settleEnd = Date().addingTimeInterval(3)
          while Date() < settleEnd {
              if windowCount(of: first.processIdentifier) != secondWindows {
                  fail("引数なしの 2 つ目の起動でウィンドウ数が \(secondWindows) から変わった（新しいウィンドウを作ってはならない）")
              }
              Thread.sleep(forTimeInterval: 0.2)
          }
          note("検証 (a): 引数なしの 2 つ目の起動も終了コード 0 で終わり、ウィンドウ数=\(secondWindows) のまま変わらない")
          note("検証 (a): 記録（引数なしの引き継ぎ）: \(argless)")

          note("検証: 配布物のインスタンスを片付ける")
          let firstPid = first.processIdentifier
          stop(first)
          if !waitForWindowsGone(of: firstPid, seconds: timeoutSeconds) {
              fail("配布物のウィンドウが \(Int(timeoutSeconds)) 秒以内に消えませんでした")
          }

          let phaseDeny = recordLines().count
          note("検証 (c): 検証用の形を起動する（JXCEL_VERIFICATION_DENY_CLOSE=doc-1 → doc-1 の終了を拒否する委譲先）")
          let denied = launch(verifyApp, arguments: [documentPath], denyClose: "doc-1")
          guard let deniedWindows = waitForWindowCount(of: denied.processIdentifier, atLeast: 1, seconds: timeoutSeconds) else {
              fail("検証用の形のウィンドウが \(Int(timeoutSeconds)) 秒以内に現れませんでした")
          }
          guard findLine("ウィンドウを開いた: label=doc-1 ", from: phaseDeny, seconds: 10) != nil else {
              fail("検証用の形が doc-1 というラベルのウィンドウを開いていません（拒否の対象が存在しない）")
          }
          guard findLine("初回描画が成立した: label=doc-1 ", from: phaseDeny, seconds: 20) != nil
                || findLine("初回描画は成立したがソフトウェアラスタライザ経由である: label=doc-1 ", from: phaseDeny, seconds: 1) != nil else {
              fail("初回描画の成立行が現れません（購読が張られたことを確認できない）")
          }
          note("検証 (c): ウィンドウ数=\(deniedWindows)")

          if AXIsProcessTrusted() {
              note("検証 (c): アクセシビリティ許可あり — 閉じるボタンで閉鎖要求を注入する")
              if pressCloseButton(of: denied.processIdentifier) {
                  guard let denyLine = findLine("can_close_window: 呼び出し元ウィンドウ = doc-1 / 判定 = 拒否", from: phaseDeny, seconds: 10) else {
                      fail("拒否の往復（can_close_window の判定 = 拒否）が記録に現れません")
                  }
                  let settleDeny = Date().addingTimeInterval(3)
                  while Date() < settleDeny {
                      if windowCount(of: denied.processIdentifier) < deniedWindows {
                          fail("拒否されたはずのウィンドウが閉じた（委譲先の拒否が効いていない）")
                      }
                      if !denied.isRunning {
                          fail("拒否された後にプロセスが終了した")
                      }
                      Thread.sleep(forTimeInterval: 0.2)
                  }
                  let roundTrips = countLines("can_close_window: 呼び出し元ウィンドウ = doc-1 ", from: phaseDeny)
                  if roundTrips != 1 {
                      fail("1 回の終了要求に対する拒否の往復が \(roundTrips) 回だった（1 回であるべき。7.6 の実測）")
                  }
                  note("検証 (c): 拒否 — ウィンドウ数=\(deniedWindows) のまま、プロセス pid=\(denied.processIdentifier) も生存")
                  note("検証 (c): 記録（拒否の往復）: \(denyLine)")
                  note("検証 (c): 拒否の往復の回数=\(roundTrips)（1 回の終了要求につき 1 回）")

                  stop(denied)
                  let phaseAllow = recordLines().count
                  note("検証 (c-2): 対照 — 検証用の形を起動する（JXCEL_VERIFICATION_DENY_CLOSE なし → 常に許可する委譲先）")
                  let allowed = launch(verifyApp, arguments: [documentPath], denyClose: nil)
                  guard waitForWindowCount(of: allowed.processIdentifier, atLeast: 1, seconds: timeoutSeconds) != nil else {
                      fail("対照のウィンドウが \(Int(timeoutSeconds)) 秒以内に現れませんでした")
                  }
                  guard findLine("初回描画が成立した: label=doc-1 ", from: phaseAllow, seconds: 20) != nil
                        || findLine("初回描画は成立したがソフトウェアラスタライザ経由である: label=doc-1 ", from: phaseAllow, seconds: 1) != nil else {
                      fail("対照の初回描画の成立行が現れません")
                  }
                  if pressCloseButton(of: allowed.processIdentifier) {
                      if !waitForWindowsGone(of: allowed.processIdentifier, seconds: timeoutSeconds) {
                          fail("拒否しない委譲先で閉鎖要求を送ったが、ウィンドウが消えませんでした（許可が効いていない）")
                      }
                      note("検証 (c-2): ウィンドウは消えました")
                      // **macOS の慣習に合わせる（要件 2.9。`Residency::CURRENT` = StayResident）。**
                      // 最後のウィンドウを閉じてもプロセスは**終了しない**。ここで「終了する」ことを
                      // 期待してはならない — 期待すると、プラットフォームの慣習どおりの常駐を
                      // 「欠陥」として報告してしまう（旧い形がそうなっていた）。**要件 2.8
                      // （最後のウィンドウが閉じたら終了する）は Linux と Windows の段が実測する** —
                      // `vetoes_exit` が拒否するのは macOS の `code: None` だけである。
                      let settleResident = Date().addingTimeInterval(3)
                      while Date() < settleResident {
                          if !allowed.isRunning {
                              fail("最後のウィンドウを閉じた後にプロセスが終了しました（macOS は常駐する。要件 2.9）")
                          }
                          Thread.sleep(forTimeInterval: 0.2)
                      }
                      note("検証 (c-2): 最後のウィンドウを閉じてもプロセス pid=\(allowed.processIdentifier) は常駐している（要件 2.9）")
                      stop(allowed)
                  } else {
                      note("検証 (c-2): 対照の閉じるボタンを押せなかった（注入できず）")
                      stop(allowed)
                  }
              } else {
                  note("検証 (c): アクセシビリティ許可はあるが、閉じるボタンを押せなかった（注入できず）")
                  stop(denied)
              }
          } else {
              note("macOS: アクセシビリティ許可が無いため、外部からウィンドウの閉鎖要求を注入できない（GitHub の macOS ランナーは許可を与えない。actions/runner-images#8214）。**経路 (c) の拒否と許可の実測は Linux と Windows の段が担う** — この段は (a)/(b) と、検証用の形が doc-1 を開くことまでを実測した。許可が与えられた環境ではこの分岐が閉じるボタンの押下で同じ検査を行う。")
              stop(denied)
          }

          // 検証 (d): **明示的な終了は常駐の慣習でもプロセスを終わらせる**（要件 2.9、5.4 の
          // 完了状態）。検証用の引き金 `<ミリ秒>` は 5.4 の明示的な終了（`request_exit`）そのもので、
          // メニューの「終了」項目と終了コマンドが呼ぶ関数と同じである。**アクセシビリティ許可を
          // 要さない**ので、許可の無いランナーでもこの検査は成立する（(c) と違い注入が要らない）。
          // 待ちは 6 秒にしてある — ウィンドウの出現（起動予算 2 秒。要件 1.3）より確実に後に
          // 終了させるためである（2 秒だと出現と終了が競合しうる）。
          note("検証 (d): 検証用の形を起動し、明示的な終了（JXCEL_VERIFICATION_EXIT_AFTER_MS=6000 → request_exit）でプロセスが終わることを確かめる")
          let quitting = launch(verifyApp, arguments: [], denyClose: nil, exitAfterMs: "6000")
          guard waitForWindowCount(of: quitting.processIdentifier, atLeast: 1, seconds: timeoutSeconds) != nil else {
              fail("明示的な終了の検証でウィンドウが \(Int(timeoutSeconds)) 秒以内に現れませんでした")
          }
          if !waitForExit(quitting, seconds: timeoutSeconds) {
              stop(quitting)
              fail("明示的な終了（request_exit）の後にプロセスが終了しませんでした（常駐の慣習でも明示的な終了は効かなければならない。要件 2.9 / 5.4）")
          }
          if quitting.terminationStatus != 0 {
              fail("明示的な終了が終了コード \(quitting.terminationStatus) で終わった（通常終了は 0）")
          }
          note("検証 (d): 明示的な終了でプロセスは終了コード 0 で終わった（常駐の慣習でも明示的な終了は確実に効く）")

          stopAll()
          note("検証 (後始末): 起動したプロセスをすべて終了した")
          exit(0)
          SWIFT
          swift "$spike" "$dist" "$verify" "$record" "$output_prefix" "$document" "jxcel" 60
          # この段が起動したプロセスが残っていないことを段の出力で確かめる（残ると後続の段が
          # 単一インスタンスの機構に引き継がれ、ウィンドウが出ない偽の失敗になる）。
          if pgrep -x jxcel >/dev/null 2>&1; then
            echo "NG: 後始末の後に jxcel のプロセスが残っています" >&2
            pgrep -l -x jxcel >&2
            exit 1
          fi
          echo "検証 (後始末): jxcel のプロセスは残っていない（pgrep -x jxcel で 0 件）"

      # Windows の段（tasks.md 10.5）。ウィンドウは `EnumWindows` で数え（所有者 pid と**題名の
      # 完全一致**で絞る — 単一インスタンスのプラグインは同じ pid に可視の隠しウィンドウ
      # `com.jxcel.app-siw` を作るため、題名の一致が要る）、閉鎖要求は `PostMessage(WM_CLOSE)` で
      # 起こす（同一利用者・同一セッションなので許可は要らない）。**(a)/(b) は配布物（NSIS で /S
      # 導入済みの実行ファイル）、(c) は検証用の形**で測る（10.4 と同じ前提）。
      - name: Verify single instance and multi-window paths (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $title = "jxcel"
          $record = Join-Path $env:LOCALAPPDATA "com.jxcel.app\logs\jxcel.log"
          New-Item -ItemType Directory -Force -Path (Split-Path $record) | Out-Null
          Write-Host "診断記録: $record"

          # 導入先は 1.5 の段と同じ前提（既定の installMode は currentUser）。見つからない場合は
          # 1.5 の段と同じ探索に退避する（導入先が変わっても偽の失敗をしない）。
          $installed = Join-Path $env:LOCALAPPDATA "jxcel\jxcel.exe"
          if (-not (Test-Path $installed)) {
            $found = Get-ChildItem -Path $env:LOCALAPPDATA -Filter "jxcel.exe" -Recurse -Depth 3 -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) { $installed = $found.FullName }
          }
          if (-not (Test-Path $installed)) { throw "導入された実行ファイルが見つかりません: $installed" }
          $verify = "target/release/jxcel.exe"
          if (-not (Test-Path $verify)) { throw "検証用の形が見つかりません: $verify" }
          $document = Join-Path $env:RUNNER_TEMP "jxcel-10-5-document.txt"
          Set-Content -Path $document -Value "jxcel 10.5 の検証で開くドキュメント（内容は読まれない。tasks.md 7.7）" -Encoding UTF8

          # 配布物に検証専用の識別子が入っていないこと（5.4 の片付けの規約）と、検証用の形には
          # 入っていること。バイト列を Latin-1 で文字列にして部分一致を見る（`findstr` は
          # バイナリに対して信頼できない）。
          function Test-ByteString {
            param([string]$Path, [string]$Needle)
            $text = [System.Text.Encoding]::Latin1.GetString([System.IO.File]::ReadAllBytes($Path))
            return $text.Contains($Needle)
          }
          if (Test-ByteString -Path $installed -Needle "JXCEL_VERIFICATION") {
            throw "配布物の実行ファイルに検証専用の識別子が入っています: $installed"
          }
          if (-not (Test-ByteString -Path $verify -Needle "JXCEL_VERIFICATION_DENY_CLOSE")) {
            throw "検証用の形に JXCEL_VERIFICATION_DENY_CLOSE がありません（--features verification-triggers のビルドではない）"
          }
          Write-Host "検証 (片付け): 配布物に JXCEL_VERIFICATION は無く（バイト列の照合で 0 件）、検証用の形は JXCEL_VERIFICATION_DENY_CLOSE を持つ"

          # ウィンドウの列挙と閉鎖要求の送信（1 つの型にまとめる）。**here-string を使わない** —
          # YAML の中では終端 `"@` を行頭に置けず、PowerShell の here-string が成立しない。
          $windowApi = @(
            'using System;',
            'using System.Collections.Generic;',
            'using System.Runtime.InteropServices;',
            'using System.Text;',
            '',
            'public static class JxcelWindowApi {',
            '  public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);',
            '  [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);',
            '  [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint processId);',
            '  [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowTextLength(IntPtr hWnd);',
            '  [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int count);',
            '  [DllImport("user32.dll")] public static extern bool IsWindow(IntPtr hWnd);',
            '  [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr hWnd, uint message, IntPtr wParam, IntPtr lParam);',
            '  public const uint WM_CLOSE = 0x0010;',
            '  public static List<IntPtr> WindowsOf(int ownerPid, string title) {',
            '    var result = new List<IntPtr>();',
            '    EnumWindows(delegate(IntPtr hWnd, IntPtr lParam) {',
            '      uint owner;',
            '      GetWindowThreadProcessId(hWnd, out owner);',
            '      if (owner != (uint)ownerPid) { return true; }',
            '      int length = GetWindowTextLength(hWnd);',
            '      if (length <= 0) { return true; }',
            '      var text = new StringBuilder(length + 1);',
            '      GetWindowText(hWnd, text, text.Capacity);',
            '      if (text.ToString() == title) { result.Add(hWnd); }',
            '      return true;',
            '    }, IntPtr.Zero);',
            '    return result;',
            '  }',
            '}'
          ) -join "`n"
          Add-Type -TypeDefinition $windowApi

          function Get-HandleLabel {
            # **`[object]` で受けて `@()` で包む。** PowerShell は 1 要素の配列を関数の戻り値で
            # スカラー（`IntPtr`）へ開いてしまうため、`IEnumerable` で受けると
            # 「1 枚だけのとき」に引数の型変換で落ちる（実測: Windows のメニュー検査。
            # `Wait-Windows` が 1 枚を返した時点で
            # `Cannot convert the "655462" value of type "System.IntPtr" to type
            # "System.Collections.IEnumerable"`）。
            param([object]$Handles)
            return ((@($Handles) | ForEach-Object { '0x{0:x}' -f $_.ToInt64() }) -join ' ')
          }
          function Get-InstanceCount {
            return @(Get-Process -Name "jxcel" -ErrorAction SilentlyContinue).Count
          }
          function Get-RecordLines {
            param([int]$Skip = 0)
            if (-not (Test-Path $record)) { return @() }
            $lines = @(Get-Content -Path $record -Encoding UTF8 -ErrorAction SilentlyContinue)
            if ($lines.Count -le $Skip) { return @() }
            return $lines[$Skip..($lines.Count - 1)]
          }
          function Find-RecordLine {
            param([int]$Skip, [string]$Pattern, [int]$Seconds = 10)
            $deadline = (Get-Date).AddSeconds($Seconds)
            while ((Get-Date) -lt $deadline) {
              $hit = Get-RecordLines -Skip $Skip | Where-Object { $_ -match $Pattern } | Select-Object -First 1
              if ($hit) { return $hit }
              Start-Sleep -Milliseconds 200
            }
            return $null
          }
          function Get-RecordCount {
            param([int]$Skip, [string]$Pattern)
            return @(Get-RecordLines -Skip $Skip | Where-Object { $_ -match $Pattern }).Count
          }
          function Wait-Windows {
            param([int]$OwnerPid, [int]$AtLeast, [int]$Seconds)
            $deadline = (Get-Date).AddSeconds($Seconds)
            while ((Get-Date) -lt $deadline) {
              $handles = @([JxcelWindowApi]::WindowsOf($OwnerPid, $title))
              if ($handles.Count -ge $AtLeast) { return $handles }
              Start-Sleep -Milliseconds 100
            }
            return $null
          }
          function Wait-WindowsGone {
            param([int]$OwnerPid, [int]$Seconds)
            $deadline = (Get-Date).AddSeconds($Seconds)
            while ((Get-Date) -lt $deadline) {
              if (@([JxcelWindowApi]::WindowsOf($OwnerPid, $title)).Count -eq 0) { return $true }
              Start-Sleep -Milliseconds 100
            }
            return $false
          }
          function Wait-Exit {
            param([System.Diagnostics.Process]$Target, [int]$Seconds)
            return $Target.WaitForExit($Seconds * 1000)
          }
          function Stop-Instance {
            param([System.Diagnostics.Process]$Target)
            if (-not $Target.HasExited) { $Target.Kill() }
            $Target.WaitForExit(10000) | Out-Null
          }
          function Send-Close {
            param([System.Collections.IEnumerable]$Handles)
            foreach ($handle in $Handles) {
              [JxcelWindowApi]::PostMessage($handle, [JxcelWindowApi]::WM_CLOSE, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null
            }
          }

          Write-Host "検証 (a)(b): 1 つ目として配布物を起動する（引数なし → ドキュメントを関連付けないウィンドウ）"
          $phaseAB = @(Get-RecordLines).Count
          $first = Start-Process -FilePath $installed -PassThru
          if (-not (Wait-Windows -OwnerPid $first.Id -AtLeast 1 -Seconds 60)) {
            Stop-Instance $first
            throw "1 つ目のウィンドウが現れませんでした"
          }
          if (-not (Find-RecordLine -Skip $phaseAB -Pattern "ウィンドウを開いた: label=empty-1 " -Seconds 10)) {
            Stop-Instance $first
            throw "1 つ目のウィンドウが label=empty-1 として記録に現れません"
          }
          $firstHandles = @([JxcelWindowApi]::WindowsOf($first.Id, $title))
          Write-Host "検証 (a): 1 つ目の起動: pid=$($first.Id) ウィンドウ数=$($firstHandles.Count) ハンドル=$(Get-HandleLabel -Handles $firstHandles)"

          Write-Host "検証 (a)(b): 同じ配布物を再度実行する（ドキュメント位置を渡す → 単一インスタンスが引数を引き渡す）"
          $second = Start-Process -FilePath $installed -ArgumentList $document -PassThru
          if (-not (Wait-Exit -Target $second -Seconds 60)) {
            Stop-Instance $second
            throw "2 つ目の起動が終了しません（2 つ目が常駐している。単一インスタンスが成立していない）"
          }
          if ($second.ExitCode -ne 0) {
            throw "2 つ目の起動が終了コード $($second.ExitCode) で終わった（0 であるべき）"
          }
          Write-Host "検証 (a): 2 つ目の起動は終了コード 0 で終わった（常駐しない）"
          if ($first.HasExited) { throw "2 つ目の起動の後に 1 つ目のプロセスが終了した" }
          if ((Get-InstanceCount) -ne 1) {
            throw "常駐しているインスタンスが $(Get-InstanceCount) 件になった（1 件であるべき。2 つ目は常駐してはならない）"
          }
          Write-Host "検証 (a): 常駐インスタンス数=$(Get-InstanceCount)（2 つ目は常駐していない）"

          $secondHandles = Wait-Windows -OwnerPid $first.Id -AtLeast ($firstHandles.Count + 1) -Seconds 60
          if (-not $secondHandles) {
            throw "2 つ目の起動の後、ウィンドウ数が $($firstHandles.Count + 1) 以上になりませんでした（引き継いだ側がウィンドウを提示していない）"
          }
          foreach ($handle in $firstHandles) {
            if (-not [JxcelWindowApi]::IsWindow($handle)) {
              throw "ドキュメントを開いたときに既存のウィンドウが閉じた（既存のウィンドウを閉じてはならない）"
            }
          }
          $handover = Find-RecordLine -Skip $phaseAB -Pattern "二重起動を引き継ぎました.*ドキュメント要求 " -Seconds 10
          if (-not $handover) { throw "引き継ぎの行（二重起動を引き継ぎました … ドキュメント要求 …）が記録に現れません" }
          $docLabelLine = Find-RecordLine -Skip $phaseAB -Pattern "ウィンドウを開いた: label=doc-" -Seconds 10
          if (-not $docLabelLine) { throw "新しいウィンドウが label=doc-*（ドキュメント付き）として記録に現れません" }
          $docLabel = (($docLabelLine -split "label=")[1] -split " ")[0]
          Write-Host "検証 (b): ウィンドウ数=$($secondHandles.Count)（1 つ目=$($firstHandles.Count) から 1 増えた） 既存のハンドル=$(Get-HandleLabel -Handles $firstHandles) は残っている"
          Write-Host "検証 (b): 新しいウィンドウのラベル=${docLabel}（doc-* ＝ ドキュメント付き。ラベルは記録が出す）"
          Write-Host "検証 (b): 記録（引き継ぎ）: $handover"

          Write-Host "検証 (a): 引数なしで再度実行する（既にあるウィンドウを前面に出すだけで、新しいウィンドウを作らない）"
          $phaseArgless = @(Get-RecordLines).Count
          $third = Start-Process -FilePath $installed -PassThru
          if (-not (Wait-Exit -Target $third -Seconds 60)) {
            Stop-Instance $third
            throw "引数なしの 2 つ目の起動が終了しません"
          }
          if ($third.ExitCode -ne 0) {
            throw "引数なしの 2 つ目の起動が終了コード $($third.ExitCode) で終わった（0 であるべき）"
          }
          $argless = Find-RecordLine -Skip $phaseArgless -Pattern "二重起動を引き継ぎました.*ドキュメント要求なし" -Seconds 10
          if (-not $argless) { throw "引数なしの引き継ぎの行（… ドキュメント要求なし）が記録に現れません" }
          $settle = (Get-Date).AddSeconds(3)
          while ((Get-Date) -lt $settle) {
            if (@([JxcelWindowApi]::WindowsOf($first.Id, $title)).Count -ne $secondHandles.Count) {
              throw "引数なしの 2 つ目の起動でウィンドウ数が $($secondHandles.Count) から変わった（新しいウィンドウを作ってはならない）"
            }
            Start-Sleep -Milliseconds 200
          }
          Write-Host "検証 (a): 引数なしの 2 つ目の起動も終了コード 0 で終わり、ウィンドウ数=$($secondHandles.Count) のまま変わらない"
          Write-Host "検証 (a): 記録（引数なしの引き継ぎ）: $argless"

          Write-Host "検証: 配布物のインスタンスを片付ける"
          Stop-Instance $first
          if (-not (Wait-WindowsGone -OwnerPid $first.Id -Seconds 60)) {
            throw "配布物のウィンドウが消えませんでした"
          }

          $phaseDeny = @(Get-RecordLines).Count
          Write-Host "検証 (c): 検証用の形を起動する（JXCEL_VERIFICATION_DENY_CLOSE=doc-1 → doc-1 の終了を拒否する委譲先）"
          $env:JXCEL_VERIFICATION_DENY_CLOSE = "doc-1"
          try {
            $denied = Start-Process -FilePath $verify -ArgumentList $document -PassThru
          } finally {
            Remove-Item Env:\JXCEL_VERIFICATION_DENY_CLOSE -ErrorAction SilentlyContinue
          }
          if (-not (Wait-Windows -OwnerPid $denied.Id -AtLeast 1 -Seconds 60)) {
            Stop-Instance $denied
            throw "検証用の形のウィンドウが現れませんでした"
          }
          if (-not (Find-RecordLine -Skip $phaseDeny -Pattern "ウィンドウを開いた: label=doc-1 " -Seconds 10)) {
            Stop-Instance $denied
            throw "検証用の形が doc-1 というラベルのウィンドウを開いていません（拒否の対象が存在しない）"
          }
          if (-not (Find-RecordLine -Skip $phaseDeny -Pattern "初回描画が成立した: label=doc-1 " -Seconds 20) -and
              -not (Find-RecordLine -Skip $phaseDeny -Pattern "初回描画は成立したがソフトウェアラスタライザ経由である: label=doc-1 " -Seconds 1)) {
            Stop-Instance $denied
            throw "初回描画の成立行が現れません（購読が張られたことを確認できない）"
          }
          $denyHandles = @([JxcelWindowApi]::WindowsOf($denied.Id, $title))
          Write-Host "検証 (c): ウィンドウ数=$($denyHandles.Count) ハンドル=$(Get-HandleLabel -Handles $denyHandles)"
          Write-Host "検証 (c): WM_CLOSE を送る（拒否される委譲先）"
          Send-Close -Handles $denyHandles
          $denyLine = Find-RecordLine -Skip $phaseDeny -Pattern "can_close_window: 呼び出し元ウィンドウ = doc-1 / 判定 = 拒否" -Seconds 10
          if (-not $denyLine) {
            Stop-Instance $denied
            throw "拒否の往復（can_close_window の判定 = 拒否）が記録に現れません"
          }
          $settleDeny = (Get-Date).AddSeconds(3)
          while ((Get-Date) -lt $settleDeny) {
            $live = @([JxcelWindowApi]::WindowsOf($denied.Id, $title))
            if ($live.Count -lt $denyHandles.Count) {
              throw "拒否されたはずのウィンドウが閉じた（委譲先の拒否が効いていない）"
            }
            foreach ($handle in $denyHandles) {
              if (-not [JxcelWindowApi]::IsWindow($handle)) {
                throw "拒否されたはずのウィンドウ $(Get-HandleLabel -Handles @($handle)) が消えた"
              }
            }
            if ($denied.HasExited) { throw "拒否された後にプロセス（pid=$($denied.Id)）が終了した" }
            Start-Sleep -Milliseconds 200
          }
          $roundTrips = Get-RecordCount -Skip $phaseDeny -Pattern "can_close_window: 呼び出し元ウィンドウ = doc-1 "
          if ($roundTrips -ne 1) {
            throw "1 回の終了要求に対する拒否の往復が $roundTrips 回だった（1 回であるべき。7.6 の実測）"
          }
          Write-Host "検証 (c): 拒否 — ウィンドウは残り（$(Get-HandleLabel -Handles $denyHandles)）、プロセス pid=$($denied.Id) も生存"
          Write-Host "検証 (c): 記録（拒否の往復）: $denyLine"
          Write-Host "検証 (c): 拒否の往復の回数=${roundTrips}（1 回の終了要求につき 1 回）"

          Stop-Instance $denied
          if (-not (Wait-WindowsGone -OwnerPid $denied.Id -Seconds 60)) {
            throw "拒否の検証の後始末でウィンドウが消えませんでした"
          }

          $phaseAllow = @(Get-RecordLines).Count
          Write-Host "検証 (c): 対照 — 検証用の形を起動する（JXCEL_VERIFICATION_DENY_CLOSE なし → 常に許可する委譲先）"
          $allowed = Start-Process -FilePath $verify -ArgumentList $document -PassThru
          if (-not (Wait-Windows -OwnerPid $allowed.Id -AtLeast 1 -Seconds 60)) {
            Stop-Instance $allowed
            throw "対照のウィンドウが現れませんでした"
          }
          if (-not (Find-RecordLine -Skip $phaseAllow -Pattern "初回描画が成立した: label=doc-1 " -Seconds 20) -and
              -not (Find-RecordLine -Skip $phaseAllow -Pattern "初回描画は成立したがソフトウェアラスタライザ経由である: label=doc-1 " -Seconds 1)) {
            Stop-Instance $allowed
            throw "対照の初回描画の成立行が現れません"
          }
          $allowHandles = @([JxcelWindowApi]::WindowsOf($allowed.Id, $title))
          Write-Host "検証 (c): WM_CLOSE を送る（拒否しない委譲先）"
          Send-Close -Handles $allowHandles
          if (-not (Wait-WindowsGone -OwnerPid $allowed.Id -Seconds 60)) {
            throw "拒否しない委譲先で WM_CLOSE を送ったが、ウィンドウが消えませんでした（許可が効いていない）"
          }
          if (-not (Wait-Exit -Target $allowed -Seconds 60)) {
            throw "最後のウィンドウが閉じた後にプロセスが終了しませんでした（要件 2.8）"
          }
          if ($allowed.ExitCode -ne 0) {
            throw "対照のプロセスが終了コード $($allowed.ExitCode) で終わった（0 であるべき）"
          }
          $allowLine = Find-RecordLine -Skip $phaseAllow -Pattern "判定 = 許可" -Seconds 5
          Write-Host "検証 (c): 対照 — ウィンドウは消え（$(Get-HandleLabel -Handles $allowHandles)）、プロセスは終了コード 0 で終わった"
          Write-Host "検証 (c): 記録（許可の往復）: $allowLine"

          if ((Get-InstanceCount) -ne 0) {
            throw "後始末の後に常駐しているインスタンスが $(Get-InstanceCount) 件あります"
          }
          Write-Host "検証 (後始末): 常駐インスタンス数=0（残存プロセスなし）"
          Write-Host "OK: 単一インスタンス化と複数ウィンドウの 3 経路（(a) 再実行が常駐せずウィンドウが増える / (b) 新しいウィンドウが doc-* で既存が閉じない / (c) 拒否では閉じず許可では閉じる）を検証した"

      # ---------------------------------------------------------------------
      # メニューとショートカットの検証（tasks.md 10.6 / 要件 3.2, 3.5, 3.6）
      #
      # 3 つの主張を 3 OS で確かめる:
      #   (1) 登録した項目がそのプラットフォームのメニューに現れ、選択が登録元へ通知される
      #   (2) フォーカスされているウィンドウにだけショートカットが作用する
      #   (3) ショートカットの表示がプラットフォームの表記に従う
      #
      # ## 経路がプラットフォームで違うという前提（10.6 の本文）
      #
      # 7.4 / 7.5 が吸収した差がここに現れる: **macOS はアプリ全体のメニュー 1 つ**（トップレベルは
      # すべて部分メニュー）、**Windows / Linux はウィンドウ単位**。したがって「メニューを読む」
      # 手段も「活性化する」手段も OS ごとに別であり、**開発機（Linux）だけでは 3 OS を確認
      # できない**。競合の検出（要件 3.4）は環境に依らないので 10.6 は扱わない（`menu.rs` の
      # テストが担当する）。
      #
      # ## 各 OS の証拠が何を証明し、何を証明しないか
      #
      #   - **Linux（`scripts/check-menu-shortcut.sh` が 1 本で行う。AT-SPI + XSendEvent。最も強い）**
      #     * (1) 表示 — **AT-SPI** で実アプリのアクセシビリティ木を読む（9.5 が実測した手段。
      #       `[menu bar] → [menu] ファイル / 診断 → [menu item] …`。アクセシビリティの木は
      #       `busctl` で D-Bus を直接叩いて読む — ランナーに `gir1.2-atspi` が無いため）。
      #       **配布物（AppImage）に対して行う**ので、配布物のメニューそのものが読まれる。
      #       あわせて**配布物に検証専用の項目が現れないこと**も要求する（5.4 / 7.4 の片付けの
      #       規約を AT-SPI 側からも見る）。
      #     * (1) 通知 — AT-SPI の `org.a11y.atspi.Action.DoAction` で「診断 > 記録の保存場所を
      #       表示」を**実際に活性化**し、記録の 2 行（`メニュー項目が選択された: 登録元=app-shell
      #       項目=app-shell.diagnostics-log-location 対象ウィンドウ=…` と、登録元が送った
      #       `診断の導線の要求を送った: ウィンドウ = … / 導線 = 記録の保存場所`）を要求する。
      #       **活性化の経路が本物であること**が Linux の段の強みである（AT-SPI の読みだけでは
      #       「項目が存在する」ことしか言えず、記録だけでは「活性化が届いた」ことを言えない。
      #       両方を要求する）。
      #     * (2) フォーカス — 検証用の形を 2 枚（起動時のウィンドウ + 単一インスタンスの引き継ぎで
      #       開くドキュメント付きのウィンドウ）開き、`XSetInputFocus` でフォーカスを移して
      #       `XSendEvent`（`event_mask=0`。7.5 の実測手段。**XTEST はこのツールキットに届かない**）
      #       で `Ctrl+Shift+J` を送る。7.5 の `verification.probe` が残す
      #       `[検証] ショートカットが作用した対象ウィンドウ=…` が**フォーカス中のラベルと一致する
      #       こと**、**フォーカスを移すと追随すること**、**1 回の押下で作用するのが 1 枚だけである
      #       こと**（もう一方のラベルの行が 0 件であること）を要求する。
      #     * (3) 表示の表記 — **GTK が報告するキーバインド**（`<Primary>q` /
      #       `<Primary><Shift>l` など）を AT-SPI から読む。`<Primary>` は GTK の「主修飾キー」の
      #       表記であり、**アプリの自己申告ではなく基盤の表記**である。アクセラレータを割り当てて
      #       いない項目（`verification.document-only`）の報告が**空であること**も要求する（対照）。
      #       加えて検証用の形の記録から、**基盤へ渡した綴りが `ctrl+…` へ解決されていること**を
      #       要求する。
      #     * 限界: アクセシビリティの橋（`GTK_MODULES=gail:atk-bridge`。この段が設定する）が
      #       読み込まれている必要がある。無ければアプリが AT-SPI の一覧に現れず、検査は exit 1 で
      #       落ちる（**黙って通らない**）。GTK が描く字形そのもの（`Ctrl+Shift+L`）は記録に
      #       現れない（7.5 はポップアップの画素で確かめた）。この段が覆うのは「基盤がその綴りを
      #       受理して項目のアクセラレータとして保持していること」までである。
      #   - **Windows（`GetMenu` / `GetMenuStringW` / `GetMenuItemID` と `WM_COMMAND`）** —
      #     ネイティブのメニューバーは Win32 で**実際に読める**。
      #     * (1) 表示 — **配布物**（NSIS で `/S` 導入した実行ファイル）のウィンドウのメニューバーを
      #       列挙し、部分メニューと項目の文字列を要求する。**muda 0.19.3 の Windows 実装は
      #       アクセラレータを項目の文字列へ埋め込む**（`format!("{text}\t{}", accelerator)` を
      #       `AppendMenuW` へ渡す）ので、`GetMenuStringW` が返す `終了\tCtrl+Q` は
      #       **プラットフォームが実際に描く文字列**である（要件 3.3 の表示の証拠）。
      #       配布物に検証専用の項目が現れないことも要求する。
      #     * (1) 通知 — `GetMenuItemID` でコマンド識別子を取り、`PostMessage(hwnd, WM_COMMAND,
      #       id, 0)` で**実際に活性化**する（muda のウィンドウサブクラスが `WM_COMMAND` の
      #       LOWORD を項目の識別子として解決し、tauri 2.11.5 は `msg_hook` で
      #       `TranslateAcceleratorW` を各メニューの `haccel` に当てるので、クリックもキー入力も
      #       同じ経路を通る）。記録の 2 行を要求する。
      #     * (2) フォーカス — 検証用の形を 2 枚開き、`SetForegroundWindow` で前面にしたうえで
      #       `keybd_event` で `Ctrl+Shift+J` を送り、対象が前面のウィンドウと一致し、移すと
      #       追随することを要求する。**前面化できない環境では主張しない** —
      #       `GetForegroundWindow` で確認し、効かなければ「注入できず」と出力して (2) を飛ばす
      #       （偽の緑を作らない。10.5 の macOS (c) と同じ型）。**キー入力そのものを実測するのは
      #       この段と Linux の段だけである。**
      #     * (3) 表示の表記 — 上で読んだ**実際のメニュー項目の文字列**（`Ctrl+Q` など）で確かめる。
      #     * 限界: ランナーは素の利用者機ではない（10.4 と同じ）。
      #   - **macOS（アプリ全体のメニューの記録 + `menu.rs` のテスト）** — ネイティブのメニューを
      #     外部から読む唯一の手段はアクセシビリティ API（AX）であり、**GitHub の macOS ランナーは
      #     その許可を与えない**（actions/runner-images#8214。10.4 が画面収録の許可に依存しない
      #     判断をしたのと同じ理由であり、10.5 も閉鎖要求の注入で同じ判断をしている）。
      #     * (1) 表示 — **アプリが実際に組み立てて `AppHandle::set_menu` へ渡したメニュー**を、
      #       10.6 が `verification-triggers` の下へ足した記録行（`[検証] メニューを配置した:
      #       配置=アプリ全体 項目=…`）から読む。**検証用の形で測る**（配布物には検証専用の
      #       コードが入らない — 9.7 の片付けの規約）。記録は**部分メニューの位置・表示名・
      #       基盤へ渡した綴り**を運ぶ。
      #     * (3) 表示の表記 — 同じ記録で、**`Cmd` が `super+…` へ解決されていること**を要求する
      #       （非 macOS の `ctrl+…` との差がここに現れる）。**描画（`⌘Q`）そのものは読めない**。
      #     * (2) フォーカスと (1) の通知 — **キー入力の配送もメニューの活性化も外部から注入
      #       できない**ので、macOS 上では `menu.rs` のテスト（項目 → 登録元の通知の seam と、
      #       対象ウィンドウの解決の規則。`Test` の段と同じものをこの段でも名指しで走らせ、
      #       結果を出力に残す）で確かめる。**これは「プラットフォームが配送すること」の証明では
      #       ない** — 配送の実測は Linux と Windows の段が担う。
      #     * **未検証として残るもの**: macOS のランナーでは、クリックやキー入力を AppKit が
      #       メニューへ配送する経路を実測できない。許可が与えられた環境（開発機）では AX で同じ
      #       ことができるが、この段はそれを要求しない（不要な不安定さを持ち込まない）。
      #
      # ## 検証用の形（`verification-triggers`）を使う理由
      #
      # 7.5 の `verification.probe` / `verification.document-only` と 10.6 の配置の記録は
      # **非既定の cargo feature の下にしか無い**（配布物に検証専用のコードを入れない決定。
      # 5.4 / 7.4 の片付け）。直前の 10.4 の段が `npx tauri build --no-bundle --features
      # verification-triggers` で `target/release/jxcel[.exe]` を作っている。配布物に検証専用の
      # 識別子が入っていないことは 10.5 の段が既に確かめている。
      #
      # ## 終了コード
      #
      # Linux の段は `scripts/check-menu-shortcut.sh`（0 = 3 つの主張すべて成立 / 1 = 検査失敗 /
      # 2 = 入力が使えない）が判定する。macOS / Windows の段は各スパイクが同じ 3 値で終わる。
      # **無言で通る経路は無い**（メニューが読めない・項目が無い・通知が無い・対象が一致しない、
      # のいずれも非 0 になる）。macOS の (2) だけは注入できないことを明示して飛ばす。
      # ---------------------------------------------------------------------

      # Linux の段（tasks.md 10.6）。検査本体は POSIX sh の
      # `scripts/check-menu-shortcut.sh`（ローカルでも同じものを実行できる）である。
      #
      # AT-SPI の前提を出力に残す: アクセシビリティの木を読むには GTK のアクセシビリティの橋
      # （`GTK_MODULES=gail:atk-bridge`。検査器が自分で設定する）、D-Bus のセッションバス
      # （`dbus-run-session` があれば専用のものを使う。10.5 と同じ退避）、at-spi2-core
      # （`at-spi-bus-launcher`）が要る。**無ければ検査は非 0 で落ちる**（ここでは人の読める形で
      # 前提を出すだけである）。
      #
      # 検査は 3 つの主張を 1 回の実行で確かめ、そのあと**反証**を 1 回行う（検証用の形の代わりに
      # 配布物を渡すと、7.5 の検証専用の項目が無いので非 0 で落ちなければならない。落ちなければ
      # 検査が項目を本当に見ていないことになる）。
      - name: Verify menu items and shortcuts (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          # 4.4 の解決（Linux はアプリケーションデータ領域の下の logs。空の XDG_DATA_HOME は
          # 未設定として $HOME へ落ちる — アプリ側の解決と同じ）。
          record="${XDG_DATA_HOME:-$HOME/.local/share}/com.jxcel.app/logs/jxcel.log"
          echo "診断記録: $record"
          set -- target/release/bundle/appimage/*.AppImage
          appimage=$1
          # 展開先を変えた後（`cd` の後）でも同じファイルを指せるよう絶対パスにする。
          appimage=$(CDPATH='' cd -- "$(dirname -- "$appimage")" && pwd)/$(basename -- "$appimage")

          # **配布物の AppImage をそのまま起動する。** この段が確かめるのは**配布物のメニューの
          # 内容**であり、同梱ライブラリの組み合わせではない（自己完結性そのものは 10.3 / 10.4 の
          # 起動検証と `check-shipping-bundle.sh` が担う）。
          #
          # **a11y スタックを入れ替える処置（AppImage の展開＋ホストのライブラリ）は要らない。**
          # 以前それを足したのは、検査器が `org.a11y.atspi.Action.GetActions` を呼んでいて、
          # **22.04 の libatk-bridge 2.38 がそれで被検体を abort させる**ためだった
          # （`scripts/check-menu-shortcut.sh` の「キーバインドは AT-SPI から読まない」を参照。
          # 同梱のものでもホストのものでも 2.38 なので、入れ替えでは直らない）。
          # **この段は `GetActions` を呼ばない**ので、配布物をそのまま使える。
          # FUSE が使えないランナーでは起動の置き場が `APPIMAGE_EXTRACT_AND_RUN=1` へ退避する。
          shipping="$appimage"
          document="$RUNNER_TEMP/jxcel-10-6-document.txt"
          # 7.7 は位置を読まないが、渡す位置は実在させる（検査側も実在を要求する）。
          printf 'jxcel 10.6 の検証で開くドキュメント（内容は読まれない。tasks.md 7.7）\n' > "$document"

          # `at-spi-bus-launcher` はディストリビューションによって PATH 上に無く
          # `/usr/libexec` に置かれる（実測: ubuntu-22.04 のランナー）。
          at_spi_launcher=""
          for candidate in at-spi-bus-launcher /usr/libexec/at-spi-bus-launcher \
                           /usr/lib/at-spi2-core/at-spi-bus-launcher; do
            if command -v "$candidate" >/dev/null 2>&1; then
              at_spi_launcher=$candidate
              break
            fi
          done
          if [ -n "$at_spi_launcher" ]; then
            echo "AT-SPI: at-spi-bus-launcher あり（$at_spi_launcher。at-spi2-core が導入されている）"
          else
            echo "AT-SPI: at-spi-bus-launcher が無い（at-spi2-core が無い。メニューの AT-SPI 読みは成立しない）" >&2
          fi
          echo "AT-SPI: busctl = $(command -v busctl || echo '(見つからない)') $(busctl --version 2>/dev/null | head -n 1)"

          # <検証用の実行ファイル> を差し替えて検査を走らせる（反証で配布物を渡すため）。
          run_check() {
            _verify=$1
            if command -v dbus-run-session >/dev/null 2>&1; then
              xvfb-run -a --server-args="-screen 0 1280x1024x24" \
                dbus-run-session -- env GTK_MODULES=gail:atk-bridge \
                sh scripts/check-menu-shortcut.sh \
                  "$shipping" "$_verify" jxcel 60 100 100 "$record" "$document"
            else
              xvfb-run -a --server-args="-screen 0 1280x1024x24" \
                env GTK_MODULES=gail:atk-bridge \
                sh scripts/check-menu-shortcut.sh \
                  "$shipping" "$_verify" jxcel 60 100 100 "$record" "$document"
            fi
          }

          echo "検証: 配布物のメニュー項目（AT-SPI）・選択の通知・フォーカス先への作用・解決済みの綴り"
          run_check target/release/jxcel

          # 反証: 検証用の形の代わりに配布物を渡す（7.5 の検証専用の項目が無い）。
          echo "反証: 検証用の形の代わりに配布物を渡す（検証専用の項目が無いので非 0 で落ちるはず）"
          rc=0
          output=$(run_check "$shipping" 2>&1) || rc=$?
          printf '%s\n' "$output" | tail -n 20
          if [ "$rc" -eq 0 ]; then
            echo "NG: 検証専用の項目が無いのに検査が成功してしまった（検査が項目を本当に見ていない）" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -q "に項目 '検証: 対象ウィンドウを記録' がありません"; then
            echo "NG: 反証が「検証専用の項目の不在」以外の理由で落ちた（検査器が動いていない可能性がある）" >&2
            exit 1
          fi
          echo "反証: 期待どおり非 0 で落ちました（検証専用の項目が無いことを検査が見ている）"

      # macOS の段（tasks.md 10.6）。検証用の形を起動し、**アプリが組み立てて `set_menu` へ渡した
      # アプリ全体のメニュー**を記録から読む（AX の許可が無いランナーでは、これが唯一の客観的な
      # 観測である）。記録・アプリの出力は**別のファイル**にする（10.4 と同じ理由 — 同一ファイル
      # だと 2 人の書き手が同じ offset を触りうる）。
      #
      # (2) フォーカスへの作用と (1) の通知の seam は、同じランナーで走る `menu.rs` のテストで
      # 名指しに確かめ、その結果を出力に残す（**プラットフォームの配送ではない**ことを明記する）。
      - name: Verify menu items and shortcuts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # 4.4 の解決（macOS は $HOME/Library/Logs/{識別子}。`logs` 接尾辞は付かない）。
          record="$HOME/Library/Logs/com.jxcel.app/jxcel.log"
          output="$RUNNER_TEMP/jxcel-10-6-macos-output.log"
          mkdir -p "$(dirname "$record")" "$(dirname "$output")"
          echo "診断記録: $record"
          echo "アプリの出力: ${output}（記録とは別ファイル）"
          verify="target/release/jxcel"
          if [ ! -x "$verify" ]; then
            echo "NG: 検証用の形の実行ファイルがありません: $verify" >&2
            exit 1
          fi
          # 記録は消さない（起動中のアプリが書き続ける）。**段の開始時の行数**を取り、それ以降だけを
          # 調べる（前の段の行で偽の成功をしない）。
          phase=0
          if [ -f "$record" ]; then
            phase=$(wc -l < "$record" | tr -d ' ')
          fi
          : > "$output"
          "$verify" >"$output" 2>&1 &
          pid=$!
          cleanup() {
            if kill -0 "$pid" 2>/dev/null; then
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT INT TERM

          # 起動の直後に書かれる「配置の記録」を待つ（登録はウィンドウの生成より前である）。
          line=""
          deadline=$(( $(date +%s) + 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            line=$(tail -n "+$((phase + 1))" "$record" 2>/dev/null |
              grep -E '\[検証\] メニューを配置した: ' | tail -n 1 || true)
            [ -n "$line" ] && break
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ -z "$line" ]; then
            echo "NG: 配置の記録（[検証] メニューを配置した: …）が 60 秒以内に現れませんでした（--features verification-triggers のビルドではないか、起動できていない）" >&2
            tail -n 40 "$record" >&2 || true
            tail -n 40 "$output" >&2 || true
            exit 1
          fi
          echo "検証（配置の記録）: $line"
          for expected in \
            "配置=アプリ全体" \
            "項目数=7" \
            "app-shell.open-document(ファイル > 開く…, ショートカット=super+KeyO)" \
            "app-shell.quit(ファイル > 終了, ショートカット=super+KeyQ)" \
            "verification.document-only(ファイル > 検証: ドキュメント付きのみ, ショートカット=(なし))" \
            "verification.probe(ファイル > 検証: 対象ウィンドウを記録, ショートカット=shift+super+KeyJ)" \
            "app-shell.diagnostics-export(診断 > 診断情報を書き出す…, ショートカット=shift+super+KeyE)" \
            "app-shell.diagnostics-log-location(診断 > 記録の保存場所を表示, ショートカット=shift+super+KeyL)" \
            "app-shell.diagnostics-verbosity(診断 > 記録の詳細度…, ショートカット=shift+super+KeyV)"
          do
            case "$line" in
              *"$expected"*) ;;
              *)
                echo "NG: 配置の記録に ${expected} がありません（アプリ全体のメニューの位置・表示名・解決済みの綴りが期待と違う）" >&2
                exit 1
                ;;
            esac
          done
          echo "OK: macOS: アプリ全体のメニュー（配置=アプリ全体）に 7 項目が期待の位置・表示名で並び、ショートカットは super+…（Cmd）へ解決されている"

          # 記録が「配置」だけを覆うことを明示する（配布物のメニューは AX 無しには読めない）。
          echo "限界: macOS ではアクセシビリティ許可が無いため、ネイティブのメニューを外部から読めず、クリック・キー入力を配送できない（actions/runner-images#8214）"
          echo "限界: したがって (2) フォーカス先への作用の実測は Linux と Windows の段が担い、この段は通知の seam と対象の規則をクレートのテストで確かめる"

          # (2) フォーカスと (1) の通知の seam（`テストが 1 本だけの dispatch を通る`）。
          echo "検証（macOS）: menu.rs のテスト（項目 → 登録元の通知・対象ウィンドウの解決）"
          cargo test -p jxcel --bin jxcel menu:: 2>&1 | tee "$RUNNER_TEMP/jxcel-10-6-menu-tests.txt"
          grep -q 'test result: ok' "$RUNNER_TEMP/jxcel-10-6-menu-tests.txt" ||
            { echo "NG: menu.rs のテストが成立しませんでした" >&2; exit 1; }
          echo "OK: macOS: 通知の seam と対象ウィンドウの解決の 20 テストがこのランナーで成立した（プラットフォームの配送そのものは未検証）"

          # 検証用の形が残っていないことを確かめる（後続の段に残さない）。**ゾンビは数えない**
          # （終了したプロセスが名前を保持しても常駐してはいない。10.5 の Linux 検査と同じ判断）。
          cleanup
          if kill -0 "$pid" 2>/dev/null; then
            echo "NG: 後始末の後に jxcel（pid=${pid}）が残っています" >&2
            exit 1
          fi
          remaining=$(ps -Ao stat=,comm= | awk '$1 !~ /^Z/ && $2 == "jxcel" { n += 1 } END { print n + 0 }')
          if [ "$remaining" -ne 0 ]; then
            echo "NG: 後始末の後に jxcel のプロセスが残っています（${remaining} 件）" >&2
            ps -Ao pid=,stat=,comm= | awk '$3 == "jxcel"' >&2
            exit 1
          fi
          echo "検証（後始末）: jxcel のプロセスは残っていない（ゾンビを除いて 0 件）"

      # Windows の段（tasks.md 10.6）。配布物のメニューバーを Win32 で読み、`WM_COMMAND` で
      # 実際に活性化し、検証用の形の 2 枚でフォーカス先への作用を実測する。**`EnumWindows` は
      # 所有者 pid と**題名の完全一致**で絞る（単一インスタンスのプラグインは同じ pid に可視の
      # 隠しウィンドウ `com.jxcel.app-siw` を作るため、10.5 と同じ前提が要る）。
      - name: Verify menu items and shortcuts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $title = "jxcel"
          $record = Join-Path $env:LOCALAPPDATA "com.jxcel.app\logs\jxcel.log"
          New-Item -ItemType Directory -Force -Path (Split-Path $record) | Out-Null
          Write-Host "診断記録: $record"

          # 導入先は 1.5 の段と同じ前提（既定の installMode は currentUser）。見つからない場合は
          # 1.5 の段と同じ探索に退避する（導入先が変わっても偽の失敗をしない）。
          $installed = Join-Path $env:LOCALAPPDATA "jxcel\jxcel.exe"
          if (-not (Test-Path $installed)) {
            $found = Get-ChildItem -Path $env:LOCALAPPDATA -Filter "jxcel.exe" -Recurse -Depth 3 -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) { $installed = $found.FullName }
          }
          if (-not (Test-Path $installed)) { throw "導入された実行ファイルが見つかりません: $installed" }
          $verify = "target/release/jxcel.exe"
          if (-not (Test-Path $verify)) { throw "検証用の形が見つかりません: ${verify}（--features verification-triggers のビルドではない）" }
          $document = Join-Path $env:RUNNER_TEMP "jxcel-10-6-document.txt"
          Set-Content -Path $document -Value "jxcel 10.6 の検証で開くドキュメント（内容は読まれない。tasks.md 7.7）" -Encoding UTF8

          # メニューの列挙・活性化・前面化・キー送信（1 つの型にまとめる）。**here-string を
          # 使わない** — YAML の中では終端 `"@` を行頭に置けず、PowerShell の here-string が
          # 成立しない（10.5 の段と同じ）。
          $menuApi = @(
            'using System;',
            'using System.Collections.Generic;',
            'using System.Text;',
            'using System.Runtime.InteropServices;',
            '',
            'public static class JxcelMenuApi {',
            '  public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);',
            '  [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);',
            '  [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint processId);',
            '  [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowTextLength(IntPtr hWnd);',
            '  [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int count);',
            '  [DllImport("user32.dll")] public static extern bool IsWindow(IntPtr hWnd);',
            '  [DllImport("user32.dll")] public static extern IntPtr GetMenu(IntPtr hWnd);',
            '  [DllImport("user32.dll")] public static extern int GetMenuItemCount(IntPtr hMenu);',
            '  [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetMenuStringW(IntPtr hMenu, uint uIDItem, StringBuilder text, int count, uint flags);',
            '  [DllImport("user32.dll")] public static extern IntPtr GetSubMenu(IntPtr hMenu, int position);',
            '  [DllImport("user32.dll")] public static extern uint GetMenuItemID(IntPtr hMenu, int position);',
            '  [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr hWnd, uint message, IntPtr wParam, IntPtr lParam);',
            '  [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int command);',
            '  [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);',
            '  [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();',
            '  [DllImport("user32.dll")] public static extern void keybd_event(byte key, byte scan, uint flags, UIntPtr extra);',
            '  public const uint MF_BYPOSITION = 0x400;',
            '  public const uint WM_COMMAND = 0x0111;',
            '  public const uint KEYEVENTF_KEYUP = 0x0002;',
            '  public const int SW_RESTORE = 9;',
            '  public const byte VK_CONTROL = 0x11;',
            '  public const byte VK_SHIFT = 0x10;',
            '  public const byte VK_J = 0x4A;',
            '  public static List<IntPtr> WindowsOf(int ownerPid, string title) {',
            '    var result = new List<IntPtr>();',
            '    EnumWindows(delegate(IntPtr hWnd, IntPtr lParam) {',
            '      uint owner;',
            '      GetWindowThreadProcessId(hWnd, out owner);',
            '      if (owner != (uint)ownerPid) { return true; }',
            '      int length = GetWindowTextLength(hWnd);',
            '      if (length <= 0) { return true; }',
            '      var text = new StringBuilder(length + 1);',
            '      GetWindowText(hWnd, text, text.Capacity);',
            '      if (text.ToString() == title) { result.Add(hWnd); }',
            '      return true;',
            '    }, IntPtr.Zero);',
            '    return result;',
            '  }',
            '  public static string ItemText(IntPtr menu, int position) {',
            '    var text = new StringBuilder(512);',
            '    GetMenuStringW(menu, (uint)position, text, text.Capacity, MF_BYPOSITION);',
            '    return text.ToString();',
            '  }',
            '  public static void SendShortcut() {',
            '    keybd_event(VK_CONTROL, 0, 0, UIntPtr.Zero);',
            '    keybd_event(VK_SHIFT, 0, 0, UIntPtr.Zero);',
            '    keybd_event(VK_J, 0, 0, UIntPtr.Zero);',
            '    keybd_event(VK_J, 0, KEYEVENTF_KEYUP, UIntPtr.Zero);',
            '    keybd_event(VK_SHIFT, 0, KEYEVENTF_KEYUP, UIntPtr.Zero);',
            '    keybd_event(VK_CONTROL, 0, KEYEVENTF_KEYUP, UIntPtr.Zero);',
            '  }',
            '}'
          ) -join "`n"
          Add-Type -TypeDefinition $menuApi

          function Get-RecordLines {
            param([int]$Skip = 0)
            if (-not (Test-Path $record)) { return @() }
            $lines = @(Get-Content -Path $record -Encoding UTF8 -ErrorAction SilentlyContinue)
            if ($lines.Count -le $Skip) { return @() }
            return $lines[$Skip..($lines.Count - 1)]
          }
          function Find-RecordLine {
            param([int]$Skip, [string]$Pattern, [int]$Seconds = 10)
            $deadline = (Get-Date).AddSeconds($Seconds)
            while ((Get-Date) -lt $deadline) {
              $hit = Get-RecordLines -Skip $Skip | Where-Object { $_ -match $Pattern } | Select-Object -First 1
              if ($hit) { return $hit }
              Start-Sleep -Milliseconds 200
            }
            return $null
          }
          function Get-RecordCount {
            param([int]$Skip, [string]$Pattern)
            return @(Get-RecordLines -Skip $Skip | Where-Object { $_ -match $Pattern }).Count
          }
          function Wait-Windows {
            param([int]$OwnerPid, [int]$AtLeast, [int]$Seconds)
            $deadline = (Get-Date).AddSeconds($Seconds)
            while ((Get-Date) -lt $deadline) {
              $handles = @([JxcelMenuApi]::WindowsOf($OwnerPid, $title))
              if ($handles.Count -ge $AtLeast) { return $handles }
              Start-Sleep -Milliseconds 100
            }
            return $null
          }
          function Wait-Exit {
            param([System.Diagnostics.Process]$Target, [int]$Seconds)
            return $Target.WaitForExit($Seconds * 1000)
          }
          function Stop-Instance {
            param([System.Diagnostics.Process]$Target)
            if ($Target -and -not $Target.HasExited) { $Target.Kill() }
            if ($Target) { $Target.WaitForExit(10000) | Out-Null }
          }
          function Get-HandleLabel {
            # **`[object]` で受けて `@()` で包む。** PowerShell は 1 要素の配列を関数の戻り値で
            # スカラー（`IntPtr`）へ開いてしまうため、`IEnumerable` で受けると
            # 「1 枚だけのとき」に引数の型変換で落ちる（実測: Windows のメニュー検査。
            # `Wait-Windows` が 1 枚を返した時点で
            # `Cannot convert the "655462" value of type "System.IntPtr" to type
            # "System.Collections.IEnumerable"`）。
            param([object]$Handles)
            return ((@($Handles) | ForEach-Object { '0x{0:x}' -f $_.ToInt64() }) -join ' ')
          }
          function Wait-Menu {
            # **メニューバーが付くのを待つ。** アプリは**ウィンドウを出した後**にメニューを付ける
            # — `WebviewWindowBuilder::build()` が戻ってから（WebView2 の初期化の後）
            # `Window::set_menu` を呼ぶため、ウィンドウが列挙できるようになった直後の 1 回の
            # `GetMenu` は 0 を返しうる（実測: ウィンドウの出現は起動から 162 ms、初回描画は
            # 583 ms。メニューの付与はその間）。**1 回読んで 0 なら失敗**としていたため、
            # ウィンドウを観測した直後の読みが偽の失敗になっていた（2026-09-12 の CI の実測）。
            param([IntPtr]$Handle, [int]$Seconds = 30)
            $deadline = (Get-Date).AddSeconds($Seconds)
            while ((Get-Date) -lt $deadline) {
              $menu = [JxcelMenuApi]::GetMenu($Handle)
              if ($menu -ne [IntPtr]::Zero) { return $menu }
              Start-Sleep -Milliseconds 100
            }
            return [IntPtr]::Zero
          }
          function Show-RecordTail {
            # メニューが付かなかったときの原因（アプリが付与に失敗したのか、付ける前に
            # 終わったのか）は記録にしか現れないので、失敗の直前に出す。
            if (Test-Path $record) {
              Write-Host "--- 診断記録（末尾）: $record ---"
              Get-Content -Path $record -Encoding UTF8 -ErrorAction SilentlyContinue |
                Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host "--- 診断記録: $record（存在しません） ---"
            }
          }
          # メニューバーを「部分メニュー名 → (項目の文字列 → コマンド識別子)」として読む。
          function Get-MenuTree {
            param([IntPtr]$Menu)
            $tree = [ordered]@{}
            $count = [JxcelMenuApi]::GetMenuItemCount($Menu)
            for ($i = 0; $i -lt $count; $i++) {
              $label = [JxcelMenuApi]::ItemText($Menu, $i)
              $sub = [JxcelMenuApi]::GetSubMenu($Menu, $i)
              if ($sub -eq [IntPtr]::Zero) { continue }
              $items = [ordered]@{}
              $n = [JxcelMenuApi]::GetMenuItemCount($sub)
              for ($j = 0; $j -lt $n; $j++) {
                $items[[JxcelMenuApi]::ItemText($sub, $j)] = [JxcelMenuApi]::GetMenuItemID($sub, $j)
              }
              $tree[$label] = $items
            }
            return $tree
          }
          function Assert-MenuItem {
            param($Tree, [string]$Menu, [string]$Item, [string]$What)
            if (-not $Tree.Contains($Menu)) {
              throw "${What}: 部分メニュー '$Menu' がありません（あるのは $($Tree.Keys -join ', ')）"
            }
            $items = $Tree[$Menu]
            if (-not $items.Contains($Item)) {
              throw "${What}: '$Menu' に項目 '$Item' がありません（あるのは $($items.Keys -join ' / ')）"
            }
            Write-Host "OK: Win32: $Menu > $Item （コマンド識別子=$($items[$Item])）"
          }
          # そのウィンドウを前面へ出せたかを返す（**効かなければ主張しない**）。
          function Set-ForegroundChecked {
            param([IntPtr]$Handle)
            [JxcelMenuApi]::ShowWindow($Handle, [JxcelMenuApi]::SW_RESTORE) | Out-Null
            [JxcelMenuApi]::SetForegroundWindow($Handle) | Out-Null
            $deadline = (Get-Date).AddSeconds(5)
            while ((Get-Date) -lt $deadline) {
              if ([JxcelMenuApi]::GetForegroundWindow() -eq $Handle) { return $true }
              Start-Sleep -Milliseconds 200
            }
            return $false
          }

          # -------------------------------------------------------------------
          # (1) 配布物: メニューバーの読み（項目の出現とショートカットの表示）と活性化（通知）
          # -------------------------------------------------------------------
          $phaseShipping = @(Get-RecordLines).Count
          $shipping = Start-Process -FilePath $installed -PassThru
          try {
            # **題名の完全一致で絞る**（単一インスタンスのプラグインは同じ pid に可視の隠し
            # ウィンドウ `com.jxcel.app-siw` を作る。`MainWindowHandle` はそれを指しうる）。
            $shippingHandles = Wait-Windows -OwnerPid $shipping.Id -AtLeast 1 -Seconds 60
            if (-not $shippingHandles) {
              if ($shipping.HasExited) { throw "配布物がウィンドウを出す前に終了しました (exit=$($shipping.ExitCode))" }
              throw "配布物のウィンドウが 60 秒以内に現れませんでした"
            }
            if ($shippingHandles.Count -ne 1) { throw "配布物のウィンドウが $($shippingHandles.Count) 枚あります（1 枚であるべき）" }
            Write-Host "検証 1/2: 配布物: ウィンドウ '$title' pid=$($shipping.Id) ハンドル=$(Get-HandleLabel -Handles $shippingHandles)"

            $menu = Wait-Menu -Handle $shippingHandles[0]
            if ($menu -eq [IntPtr]::Zero) {
              Show-RecordTail
              throw "配布物のウィンドウにメニューバーがありません（GetMenu が 0 のまま 30 秒待ちました）"
            }
            $tree = Get-MenuTree -Menu $menu
            Write-Host "OK: Win32: 配布物のウィンドウのメニューバーを読んだ（部分メニュー: $($tree.Keys -join ', ')）"
            Assert-MenuItem $tree "ファイル" "開く…`tCtrl+O" "配布物"
            Assert-MenuItem $tree "ファイル" "終了`tCtrl+Q" "配布物"
            Assert-MenuItem $tree "診断" "診断情報を書き出す…`tCtrl+Shift+E" "配布物"
            Assert-MenuItem $tree "診断" "記録の保存場所を表示`tCtrl+Shift+L" "配布物"
            Assert-MenuItem $tree "診断" "記録の詳細度…`tCtrl+Shift+V" "配布物"
            foreach ($menuLabel in $tree.Keys) {
              foreach ($itemLabel in $tree[$menuLabel].Keys) {
                if ($itemLabel -like "*検証*") {
                  throw "配布物のメニューに検証専用の項目 '$itemLabel' が現れています（既定のビルドに入ってはならない）"
                }
              }
            }
            Write-Host "検証 1/2: 配布物のメニューに検証専用の項目は現れない（アクセラレータは項目の文字列に埋め込まれている）"

            Write-Host "検証 1/2: 診断 > 記録の保存場所を表示 を WM_COMMAND で活性化する（選択が登録元へ通知されること）"
            # **活性化の前にウィンドウを前面へ出す。** ウィンドウ単位のメニューでも、基盤の
            # メニューイベントは発生元のウィンドウを運ばない（tauri 2.11.5 の `MenuEvent` は
            # 項目の識別子だけ）ので、アプリは**活性化の時点のフォーカス**から対象ウィンドウを
            # 解決する（7.5 の `activation_target`）。前面化していないと対象が決まらず、
            # 通知は `対象ウィンドウ=(対象なし)` になり、登録元は要求を送らない
            # （実測: 2026-09-12 の Windows のランナー。Linux の段は `XSetInputFocus` で同じことを
            # している）。
            if (-not (Set-ForegroundChecked -Handle $shippingHandles[0])) {
              Show-RecordTail
              throw "配布物のウィンドウを前面へ出せませんでした（活性化の対象が決まらず、通知が (対象なし) になります）"
            }
            # **フォーカスの通知がアプリへ届いてから活性化する**（届く前に送ると対象が (対象なし)
            # のままになる。上の待ちは `GetForegroundWindow` の一致までしか見ていない）。
            Start-Sleep -Milliseconds 500
            # 送り先は**メニューを読んだのと同じウィンドウ**（`MainWindowHandle` は単一
            # インスタンスの隠しウィンドウを指しうる）。
            $itemId = $tree["診断"]["記録の保存場所を表示`tCtrl+Shift+L"]
            if (-not [JxcelMenuApi]::PostMessage($shippingHandles[0], [JxcelMenuApi]::WM_COMMAND, [IntPtr]$itemId, [IntPtr]::Zero)) {
              throw "WM_COMMAND を送れませんでした（コマンド識別子=${itemId}）"
            }
            $notified = Find-RecordLine -Skip $phaseShipping -Pattern "メニュー項目が選択された: 登録元=app-shell 項目=app-shell.diagnostics-log-location " -Seconds 10
            if (-not $notified) { throw "活性化の通知の行（メニュー項目が選択された: 登録元=app-shell 項目=app-shell.diagnostics-log-location …）が記録に現れません" }
            Write-Host "検証 1/2: 記録（通知）: $notified"
            $requested = Find-RecordLine -Skip $phaseShipping -Pattern "診断の導線の要求を送った: ウィンドウ = [a-z0-9_-]+ / 導線 = 記録の保存場所" -Seconds 10
            if (-not $requested) { throw "登録元が要求を送った行（診断の導線の要求を送った: ウィンドウ = … / 導線 = 記録の保存場所）が記録に現れません" }
            Write-Host "検証 1/2: 記録（登録元の処理）: $requested"
          } finally {
            Stop-Instance $shipping
          }

          # -------------------------------------------------------------------
          # (2) 検証用の形: フォーカスされているウィンドウにだけショートカットが作用すること
          # -------------------------------------------------------------------
          $phaseShortcut = @(Get-RecordLines).Count
          Write-Host "検証 2/2: 検証用の形を起動する（1 枚目はドキュメントなし）"
          $first = Start-Process -FilePath $verify -PassThru
          $second = $null
          try {
            $firstHandles = Wait-Windows -OwnerPid $first.Id -AtLeast 1 -Seconds 60
            if (-not $firstHandles) { throw "検証用の形のウィンドウが 60 秒以内に現れませんでした" }
            if (-not (Find-RecordLine -Skip $phaseShortcut -Pattern "ウィンドウを開いた: label=empty-1 " -Seconds 10)) {
              throw "1 枚目のウィンドウが label=empty-1 として記録に現れません"
            }
            Write-Host "検証 2/2: 1 枚目: ラベル=empty-1 ハンドル=$(Get-HandleLabel -Handles $firstHandles)"

            $subPhase = @(Get-RecordLines).Count
            if (-not (Set-ForegroundChecked -Handle $firstHandles[0])) {
              Write-Host "限界: 1 枚目を前面にできなかった（SetForegroundWindow が効かない環境）。フォーカス先への作用の実測は Linux の段が担う。"
            } else {
              [JxcelMenuApi]::SendShortcut()
              $emptyHit = Find-RecordLine -Skip $subPhase -Pattern "\[検証\] ショートカットが作用した対象ウィンドウ=empty-1$" -Seconds 10
              if (-not $emptyHit) { throw "1 枚目にフォーカスしたときのショートカットの対象が empty-1 として記録に現れません（ショートカットが作用していないか、対象がフォーカスと一致していません）" }
              if ((Get-RecordCount -Skip $subPhase -Pattern "\[検証\] ショートカットが作用した対象ウィンドウ=doc-1$") -ne 0) {
                throw "1 枚目にフォーカスしたのに doc-1 へ作用しました"
              }
              Write-Host "検証 2/2: 記録（1 枚目にフォーカス）: $emptyHit"
            }

            Write-Host "検証 2/2: 同じ検証用の形をドキュメント位置つきで再度実行する（単一インスタンスが引き継ぐ）"
            $second = Start-Process -FilePath $verify -ArgumentList $document -PassThru
            if (-not (Wait-Exit -Target $second -Seconds 60)) {
              throw "2 つ目の起動が 60 秒以内に終了しません（2 つ目が常駐している）"
            }
            if ($second.ExitCode -ne 0) { throw "2 つ目の起動が終了コード $($second.ExitCode) で終わった（0 であるべき）" }
            $allHandles = Wait-Windows -OwnerPid $first.Id -AtLeast ($firstHandles.Count + 1) -Seconds 60
            if (-not $allHandles) { throw "2 つ目の起動の後、ウィンドウ数が $($firstHandles.Count + 1) 以上になりませんでした" }
            $newHandles = @($allHandles | Where-Object { $firstHandles -notcontains $_ })
            if ($newHandles.Count -ne 1) { throw "増えたウィンドウが 1 枚ではありません（$($newHandles.Count) 枚）" }
            $docLine = Find-RecordLine -Skip $phaseShortcut -Pattern "ウィンドウを開いた: label=doc-" -Seconds 10
            if (-not $docLine) { throw "新しいウィンドウが label=doc-* として記録に現れません" }
            $docLabel = (($docLine -split "label=")[1] -split " ")[0]

            # **2 枚目のウィンドウにも自分用のメニューバーがある**（ウィンドウ単位の配置。要件 3.6）。
            $secondMenu = Wait-Menu -Handle $newHandles[0]
            if ($secondMenu -eq [IntPtr]::Zero) {
              Show-RecordTail
              throw "2 枚目のウィンドウにメニューバーがありません（ウィンドウ単位のメニューが付いていない。GetMenu が 0 のまま 30 秒待ちました）"
            }
            $secondTree = Get-MenuTree -Menu $secondMenu
            Assert-MenuItem $secondTree "ファイル" "検証: 対象ウィンドウを記録`tCtrl+Shift+J" "2 枚目（ウィンドウ単位のメニュー）"
            Write-Host "検証 2/2: 2 枚目: ラベル=$docLabel ハンドル=$(Get-HandleLabel -Handles $newHandles)（1 枚目とは別のハンドル）"

            $subPhase2 = @(Get-RecordLines).Count
            if (-not (Set-ForegroundChecked -Handle $newHandles[0])) {
              Write-Host "限界: 2 枚目を前面にできなかった（SetForegroundWindow が効かない環境）。フォーカス先への作用の実測は Linux の段が担う。"
            } else {
              [JxcelMenuApi]::SendShortcut()
              $docHit = Find-RecordLine -Skip $subPhase2 -Pattern "\[検証\] ショートカットが作用した対象ウィンドウ=$docLabel$" -Seconds 10
              if (-not $docHit) { throw "2 枚目にフォーカスしたときのショートカットの対象が $docLabel として記録に現れません（フォーカス先へ振り向いていない）" }
              if ((Get-RecordCount -Skip $subPhase2 -Pattern "\[検証\] ショートカットが作用した対象ウィンドウ=$docLabel$") -ne 1) {
                throw "2 枚目にフォーカスしたときの作用が 1 回ではありません"
              }
              if ((Get-RecordCount -Skip $subPhase2 -Pattern "\[検証\] ショートカットが作用した対象ウィンドウ=empty-1$") -ne 0) {
                throw "2 枚目にフォーカスしたのに empty-1 へ作用しました（フォーカスされていないウィンドウに作用している）"
              }
              Write-Host "検証 2/2: 記録（2 枚目にフォーカス）: $docHit"

              # フォーカスを 1 枚目へ戻すと対象も戻ること（追随すること）。
              $subPhase3 = @(Get-RecordLines).Count
              if (Set-ForegroundChecked -Handle $firstHandles[0]) {
                [JxcelMenuApi]::SendShortcut()
                $backHit = Find-RecordLine -Skip $subPhase3 -Pattern "\[検証\] ショートカットが作用した対象ウィンドウ=empty-1$" -Seconds 10
                if (-not $backHit) { throw "フォーカスを 1 枚目へ戻したときの対象が empty-1 として記録に現れません（フォーカスの移動に追随していない）" }
                if ((Get-RecordCount -Skip $subPhase3 -Pattern "\[検証\] ショートカットが作用した対象ウィンドウ=$docLabel$") -ne 0) {
                  throw "フォーカスを 1 枚目へ戻したのに $docLabel へ作用しました"
                }
                Write-Host "検証 2/2: 記録（フォーカスを 1 枚目へ戻した）: $backHit"
                Write-Host "OK: Windows: ショートカットの対象はフォーカスに追随した（キー入力の実測）"
              } else {
                Write-Host "限界: 1 枚目へ戻す前面化が効かなかったため、追随の実測は行わなかった"
              }
            }
          } finally {
            Stop-Instance $second
            Stop-Instance $first
          }

          if (@(Get-Process -Name "jxcel" -ErrorAction SilentlyContinue).Count -ne 0) {
            throw "後始末の後に常駐しているインスタンスが残っています"
          }
          Write-Host "検証（後始末）: 常駐インスタンス数=0（残存プロセスなし）"
          Write-Host "OK: Windows: 配布物のメニューバー（項目とアクセラレータの文字列）・WM_COMMAND による活性化の通知・2 枚のウィンドウのフォーカス先への作用を検証した"
      # ---------------------------------------------------------------------
      # 補助プロセスの終了保証の検証（tasks.md 10.7 / 要件 5.6）
      #
      # 3 条件を 3 OS それぞれで実測する。**残存プロセス数が 0 であることがこの段の出力に現れる**:
      #
      #   (a) 通常終了        — `sidecar:<ms>` で補助プロセスを起動し、通常終了した後に残存 0
      #   (b) 強制終了        — `sidecar:<ms>` で起動し、アプリを強制終了した後に残存 0。
      #                         **こちらが本番の経路である**（異常終了では終了処理が走らない）
      #   (c) 孫あり・通常終了 — `sidecar-grandchild:<ms>` で補助プロセスに孫を作らせ、通常終了の
      #                         後に残存 0（**3.3 のプロセスグループ / Job Object が孫まで届く**）
      #   (d) 補助: 孫あり・強制終了 → 親監視の届かない孫を次回起動の掃除（3.5）が除去する
      #
      # ## どの機構が何を保証するか（3.3 / 3.5 / 5.6 の実装に基づく）
      #
      #   - **通常終了**: 5.6 の `RunEvent::Exit` → `shutdown_all` が、3.3 の機構（Unix は
      #     `setpgid` したプロセスグループへの `killpg`、Windows は Job Object の
      #     `TerminateJobObject`）で**孫まで**終了させる。(c) がこれを直接確かめる。
      #   - **強制終了（Unix / macOS）**: `RunEvent::Exit` が届かず `killpg` も走らない。実効的な
      #     機構は**補助プロセス自身の親監視**（1.6 / 3.5 が注入する `--parent-pid`）だけである。
      #     検出間隔は `crates/sidecar-smoke` の `POLL_INTERVAL` = 100 ms。**(b) がこれを確かめる。**
      #     孫は親監視を持たない（`--idle`。3.3 の注記）ため強制終了の後に残り得る。それを
      #     終わらせるのは**3.5 の起動時の掃除だけ**であり、**(d) がそれを確かめる**。
      #   - **強制終了（Windows）**: Job Object の `JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE` を
      #     **カーネルが強制する**（アプリの異常終了後も有効な唯一の機構。3.3）。孫もジョブに入る
      #     ので、(b) と (d) の双方で残存 0 になる。
      #   - **macOS の掃除**: `ps -axo pid=,comm=` の**名前照合**だけに頼る。`comm` はカーネルの
      #     `p_comm` で 16 文字に切詰められ、起動時の絶対パスを返さないため、8.1 は macOS に期待
      #     パスを与えない（与えると掃除が無音の no-op になる）。(d) が macOS における名前照合の
      #     掃除を実測する — **3.5 / 8.1 の申し送りが求めていた確認はこれである**。
      #
      # ## 検証用の形（`verification-triggers`）で起動する理由
      #
      # `sidecar:<ms>` / `sidecar-grandchild:<ms>` の引き金は 5.4 / 10.7 が**非既定の feature の
      # 下にだけ**置いている（配布物に検証専用の環境変数の読み取りを入れない決定。5.4 / 7.4 の
      # 片付け）。したがってこの段は、直前の 10.4 の段が作る**バンドルしない検証用の形**
      # （`target/release/jxcel[.exe]`）を起動する。**配布物は書き換えない** — AppImage / deb /
      # `.app` / dmg / NSIS はそのまま残り、後続の 10.2 の検証と成果物の保存がそのまま働く。
      # 配布物に検証専用の識別子が無いことは 10.5 の段が `strings` で確かめている。
      #
      # ## 「本当に起動したか」の事前条件（**残存 0 が空振りで通らないようにする**）
      #
      # 残存 0 を判定する前に、**補助プロセスが実際に動いていること**を要求し、さらにその
      # コマンドラインが**この段が起動したアプリの識別子**を `--parent-pid` に持つことまで要求する
      # （監督が `child_args` で注入する。3.2 / 3.5）。補助プロセスが現れなければ、その時点で非 0
      # になる（補助プロセスを 1 つも起動しない実行が「残存 0」で緑になる経路は無い）。
      #
      # ## 残存の数え方（**照合の限界を明記する**）
      #
      #   - **Linux**: 8.1 の解決先の絶対パス（`<実行ファイルのディレクトリ>/../share/jxcel/
      #     sidecar-smoke`。deb / システムインストールと同じ形）と `/proc/<pid>/exe` が一致する
      #     ものだけを数える（3.5 と同じく、名前だけでなく実行ファイルで照合する）。検査本体は
      #     POSIX sh の `scripts/check-sidecar-termination.sh`（ローカルでも同じものを実行できる）。
      #   - **macOS**: 同じ検査器を使う。`/proc` が無いため `ps -axo pid=,comm=` を使い、
      #     **`comm` の名前（`sidecar-smoke`。13 文字で 16 文字の切詰めに収まる）だけで照合する**。
      #     絶対パス照合は効かない（8.1 が macOS に期待パスを与えない理由と同じ）。
      #   - **Windows**: PowerShell の `Get-Process` を `Path`（期待する実行ファイルの絶対パス
      #     `target\release\sidecar-smoke.exe`）で絞って数える。**Job Object の経路を実測するのは
      #     この段だけである。**
      #
      # ## 後始末
      #
      # どの段も、起動したアプリと残存する補助プロセスを終了させてから抜ける（後続の段へ持ち越さ
      # ない）。片付けは判定より後に走るので、検証の失敗（残存ありで非 0）を覆い隠さない。
      #
      # ## この環境（Linux）で確認できないこと
      #
      # macOS / Windows の段は**このホストでは実行できず、CI が唯一の実行の場**である。Linux の
      # 検査器は `uname` を差し替えて macOS の分岐（`ps` による名前照合）を実行して確かめてあるが、
      # **実際の macOS の `ps` の出力形式・`comm` の切詰め・Job Object の強制は CI だけが実測する。**
      # ---------------------------------------------------------------------

      # Linux の終了保証の検証（tasks.md 10.7）。検査器は 4 つの条件（通常終了・強制終了・
      # 孫あり・孫あり強制終了 → 次回起動の掃除）を 1 回の実行で検証する。非 0 はそのまま
      # パイプラインの失敗になる。
      - name: Verify sidecar termination (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          # 8.1 の解決規則（Linux は `usr/share/jxcel/sidecar-smoke`。AppImage は ${APPDIR}、
          # それ以外は実行ファイルの 1 つ上の `share/jxcel`）に合わせ、**検証用の形から見た
          # 解決先**へ staging した原本を複製する（deb / システムインストールと同じ形）。
          # `tauri-build` は Linux では externalBin を複製しないため、この段が要る。
          set -- sidecars/sidecar-smoke-*
          staged=$1
          if [ ! -f "$staged" ]; then
            echo "NG: 原本がありません（先に bash scripts/stage-sidecars.sh）: $staged" >&2
            exit 1
          fi
          mkdir -p target/share/jxcel
          cp "$staged" target/share/jxcel/sidecar-smoke
          chmod 755 target/share/jxcel/sidecar-smoke
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            sh scripts/check-sidecar-termination.sh target/release/jxcel 60

      # macOS の終了保証の検証（tasks.md 10.7）。同じ検査器を macOS の分岐で走らせる
      # （`/proc` が無いので `ps -axo pid=,comm=` の名前照合になる）。`externalBin` の原本は
      # `tauri-build` が実行ファイルの隣（`target/release/sidecar-smoke`）へ複製している。
      - name: Verify sidecar termination (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          if [ ! -x target/release/sidecar-smoke ]; then
            echo "NG: 8.1 の解決先の補助プロセスがありません（--features verification-triggers のビルドか確認）: target/release/sidecar-smoke" >&2
            exit 1
          fi
          sh scripts/check-sidecar-termination.sh target/release/jxcel 60

      # Windows の終了保証の検証（tasks.md 10.7）。**Job Object の経路を実測する唯一の段**である。
      # 3 条件に加えて、孫ありで強制終了した後に次回起動の掃除が走ることも確かめる（Job Object が
      # カーネルとして孫まで終了させるので、掃除が見る残存は 0 件になる。それでも掃除の記録行は出る）。
      #
      # **既知の窓（`job_windows.rs` の doc）**: `CreateProcess` と `AssignProcessToJobObject` の
      # 間に子が孫を起動すると、その孫はジョブの外に残りうる。この段は `--spawn-grandchild` で
      # 孫を起動直後に作らせるため、**その窓を実際に踏む唯一の検証である**。この段が赤くなった
      # ときに最初に疑うべきはこの窓であり、マージン（数十 µs 対 数 ms）を実測できるのは CI だけである。
      - name: Verify sidecar termination (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $verify = "target\release\jxcel.exe"
          $sidecarPath = "target\release\sidecar-smoke.exe"
          if (-not (Test-Path $verify)) { throw "検証用の形が見つかりません: ${verify}（--features verification-triggers のビルドではない）" }
          if (-not (Test-Path $sidecarPath)) { throw "8.1 の解決先の補助プロセスが見つかりません: $sidecarPath" }
          $expected = (Resolve-Path $sidecarPath).Path
          $record = Join-Path $env:LOCALAPPDATA "com.jxcel.app\logs\jxcel.log"

          # 期待する実行ファイルに属する補助プロセスだけを数える（名前だけでなくパスで照合する）。
          function Get-Sidecars {
            @(Get-Process -Name "sidecar-smoke" -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -and ($_.Path -eq $expected) })
          }

          function Show-Sidecars {
            param([string]$Phase)
            $procs = Get-Sidecars
            foreach ($p in $procs) {
              $cmd = ""
              try { $cmd = (Get-CimInstance Win32_Process -Filter "ProcessId=$($p.Id)").CommandLine } catch { $cmd = "(取得できない)" }
              Write-Host "    pid=$($p.Id) path=$($p.Path) args=$cmd"
            }
            Write-Host "  ${Phase}: 補助プロセスの数: $($procs.Count)"
          }

          # 補助プロセス（と孫）が現れるまで待ち、**そのコマンドラインがこのアプリの識別子を
          # --parent-pid に持つこと**まで確かめる（起動していないのに残存 0 で通る経路を作らない）。
          function Wait-Started {
            param([int]$Want, [int]$AppPid, [int]$Seconds)
            $deadline = (Get-Date).AddSeconds($Seconds)
            do {
              $procs = Get-Sidecars
              if ($procs.Count -ge $Want) {
                foreach ($p in $procs) {
                  $cmd = ""
                  try { $cmd = (Get-CimInstance Win32_Process -Filter "ProcessId=$($p.Id)").CommandLine } catch { $cmd = "" }
                  if ($cmd -match "--parent-pid\s+$AppPid(\s|$)") { return $procs }
                }
              }
              Start-Sleep -Milliseconds 200
            } while ((Get-Date) -lt $deadline)
            return @()
          }

          function Wait-Zero {
            param([int]$Seconds)
            $deadline = (Get-Date).AddSeconds($Seconds)
            do {
              if (@(Get-Sidecars).Count -eq 0) { return $true }
              Start-Sleep -Milliseconds 100
            } while ((Get-Date) -lt $deadline)
            return (@(Get-Sidecars).Count -eq 0)
          }

          function Confirm-Exit {
            param($Process, [string]$Phase, [int]$Seconds)
            if (-not $Process.WaitForExit($Seconds * 1000)) {
              throw "NG: ${Phase} アプリが $Seconds 秒以内に終了しませんでした"
            }
            if ($Process.ExitCode -ne 0) {
              throw "NG: ${Phase} アプリの終了コードが $($Process.ExitCode)（通常終了は 0 であるべき）"
            }
          }

          try {
            # ---- (a) 通常終了 ----
            Write-Host "== (a) 通常終了（sidecar:8000） =="
            $env:JXCEL_VERIFICATION_EXIT_AFTER_MS = "sidecar:8000"
            $p = Start-Process -FilePath $verify -PassThru
            $procs = @(Wait-Started -Want 1 -AppPid $p.Id -Seconds 60)
            if ($procs.Count -lt 1) { throw "NG: (a) 補助プロセス（--parent-pid=$($p.Id)）が 60 秒以内に現れませんでした" }
            Write-Host "(a) 補助プロセスが動作していることを観測した:"
            Show-Sidecars "(a) 起動を観測"
            Confirm-Exit -Process $p -Phase "(a)" -Seconds 60
            if (-not (Wait-Zero 15)) { Show-Sidecars "(a) 残存"; throw "NG: (a) 通常終了の後に補助プロセスが残っています" }
            Write-Host "(a) 通常終了の後の一覧（残存 0）:"
            Show-Sidecars "(a) 通常終了の後"
            Write-Host "OK: (a) 通常終了の後に補助プロセスは残らない（5.6 の shutdown_all → 3.3 の Job Object）"

            # ---- (b) 強制終了（本番の経路） ----
            Write-Host "== (b) 強制終了（Stop-Process -Force。本番の経路） =="
            $env:JXCEL_VERIFICATION_EXIT_AFTER_MS = "sidecar:600000"
            $p = Start-Process -FilePath $verify -PassThru
            $procs = @(Wait-Started -Want 1 -AppPid $p.Id -Seconds 60)
            if ($procs.Count -lt 1) { throw "NG: (b) 補助プロセス（--parent-pid=$($p.Id)）が 60 秒以内に現れませんでした" }
            Write-Host "(b) 強制終了の前の一覧:"
            Show-Sidecars "(b) 強制終了の前"
            $killed = $p.Id
            Write-Host "(b) アプリ（pid=${killed}）へ Stop-Process -Force を送る（終了処理は走らない）"
            $sw = [Diagnostics.Stopwatch]::StartNew()
            Stop-Process -Id $p.Id -Force
            $p.WaitForExit(10000) | Out-Null
            if (-not (Wait-Zero 15)) { Show-Sidecars "(b) 残存"; throw "NG: (b) 強制終了の後に補助プロセスが残っています" }
            $sw.Stop()
            Write-Host "(b) 強制終了から約 $([int]$sw.ElapsedMilliseconds) ms で残存 0 になった"
            Write-Host "(b) 強制終了の後の一覧（残存 0）:"
            Show-Sidecars "(b) 強制終了の後"
            Write-Host "OK: (b) 強制終了の後に補助プロセスは残らない（Windows の機構は 3.3 の Job Object。"
            Write-Host "        カーネルが強制するため終了処理が走らない異常終了の後も有効）"

            # ---- (c) 孫あり・通常終了 ----
            Write-Host "== (c) 孫プロセスあり・通常終了（sidecar-grandchild:8000） =="
            $env:JXCEL_VERIFICATION_EXIT_AFTER_MS = "sidecar-grandchild:8000"
            $p = Start-Process -FilePath $verify -PassThru
            $procs = @(Wait-Started -Want 2 -AppPid $p.Id -Seconds 60)
            if ($procs.Count -lt 2) { throw "NG: (c) 補助プロセスと孫の 2 つ（--parent-pid=$($p.Id)）が 60 秒以内に現れませんでした（観測: $($procs.Count) 件）" }
            Write-Host "(c) 補助プロセスと孫が動作していることを観測した:"
            Show-Sidecars "(c) 起動を観測"
            Confirm-Exit -Process $p -Phase "(c)" -Seconds 60
            if (-not (Wait-Zero 15)) { Show-Sidecars "(c) 残存"; throw "NG: (c) 通常終了の後に補助プロセスが残っています（孫を含む）" }
            Write-Host "(c) 通常終了の後の一覧（残存 0）:"
            Show-Sidecars "(c) 通常終了の後"
            Write-Host "OK: (c) 孫を持つ補助プロセスも通常終了で残らない（3.3 の Job Object が孫まで届く）"

            # ---- (d) 補助: 孫あり・強制終了 → 次回起動の掃除 ----
            Write-Host "== (d) 補助: 孫あり・強制終了 → 次回起動の掃除（3.5） =="
            $env:JXCEL_VERIFICATION_EXIT_AFTER_MS = "sidecar-grandchild:600000"
            $p = Start-Process -FilePath $verify -PassThru
            $procs = @(Wait-Started -Want 2 -AppPid $p.Id -Seconds 60)
            if ($procs.Count -lt 2) { throw "NG: (d) 補助プロセスと孫の 2 つ（--parent-pid=$($p.Id)）が 60 秒以内に現れませんでした（観測: $($procs.Count) 件）" }
            Write-Host "(d) 強制終了の前の一覧（補助プロセスと孫）:"
            Show-Sidecars "(d) 強制終了の前"
            $sw = [Diagnostics.Stopwatch]::StartNew()
            Stop-Process -Id $p.Id -Force
            $p.WaitForExit(10000) | Out-Null
            if (-not (Wait-Zero 15)) {
              Show-Sidecars "(d) 残存"
              throw "NG: (d) 強制終了の後に孫が残っています（Job Object の KILL_ON_JOB_CLOSE が孫まで届いていない）"
            }
            $sw.Stop()
            Write-Host "(d) 強制終了から約 $([int]$sw.ElapsedMilliseconds) ms で孫を含めて残存 0 になった（Job Object はカーネルが強制する）"
            Write-Host "(d) 強制終了の後の一覧（残存 0）:"
            Show-Sidecars "(d) 強制終了の後"
            # 次回起動で起動時の残留掃除（3.5）を走らせ、その記録行を出す（Job Object が既に 0 に
            # した場合でも掃除そのものは走る。掃除の経路が生きていることを記録でも確かめる）。
            $before = 0
            if (Test-Path $record) { $before = @(Get-Content -LiteralPath $record).Count }
            $env:JXCEL_VERIFICATION_EXIT_AFTER_MS = "exit:2500"
            $q = Start-Process -FilePath $verify -PassThru
            Confirm-Exit -Process $q -Phase "(d) 次回起動" -Seconds 60
            $sweepLine = $null
            if (Test-Path $record) {
              $sweepLine = @(Get-Content -LiteralPath $record | Select-Object -Skip $before) |
                Where-Object { $_ -match "残留プロセスの掃除で" } | Select-Object -Last 1
            }
            if (-not $sweepLine) { throw "NG: (d) 次回起動の掃除の記録（残留プロセスの掃除で N 件を終了した）が現れませんでした: $record" }
            Write-Host "(d) 記録（5.1 の起動時の掃除）: $sweepLine"
            if (-not (Wait-Zero 15)) { Show-Sidecars "(d) 残存"; throw "NG: (d) 次回起動の掃除の後も補助プロセスが残っています" }
            Write-Host "(d) 掃除の後の一覧（残存 0）:"
            Show-Sidecars "(d) 掃除の後"
            Write-Host "OK: (d) 孫ありで強制終了しても残存 0（Job Object）であり、次回起動の掃除も走る（3.5）"
          } finally {
            Remove-Item Env:\JXCEL_VERIFICATION_EXIT_AFTER_MS -ErrorAction SilentlyContinue
            Get-Process -Name "jxcel" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Sidecars | Stop-Process -Force -ErrorAction SilentlyContinue
            Write-Host "検証（後始末）: 残存するアプリと補助プロセスを終了した"
          }
          # 後始末の完了を待ってから主張する（`Stop-Process` は非同期であり、直後の列挙が
          # 間に合わないことがある。偽の失敗を作らない）。
          $cleanDeadline = (Get-Date).AddSeconds(10)
          while ((Get-Date) -lt $cleanDeadline -and @(Get-Process -Name "jxcel" -ErrorAction SilentlyContinue).Count -ne 0) {
            Start-Sleep -Milliseconds 100
          }
          if (@(Get-Process -Name "jxcel" -ErrorAction SilentlyContinue).Count -ne 0) { throw "後始末の後に常駐しているインスタンスが残っています" }
          if (-not (Wait-Zero 10)) { Show-Sidecars "後始末"; throw "後始末の後に補助プロセスが残っています" }
          Write-Host "検証（後始末）: 残存プロセス数=0（アプリ・補助プロセスとも）"
          Write-Host "OK: Windows: 通常終了・強制終了・孫ありの 3 条件すべてで残存補助プロセスが 0 であることを検証した"
      # ---------------------------------------------------------------------
      # 一括転送の検証（tasks.md 10.8 / 要件 4.5）
      #
      # **10 万行規模のデータが 1 回の呼び出しで受け渡せること**と、**呼び出し回数が行数に
      # 比例しないこと**を、実アプリの生バイト経路（7.2 の `bulk_echo`）で実測する。
      #
      # ## 駆動の仕組み（配布物に検証用の入口を残さない）
      #
      # 検証用の形（`target/release/jxcel[.exe]`）を環境変数
      # `JXCEL_VERIFICATION_BULK_ROWS=<行数の一覧>`（例 `100,100000`）付きで起動する。Rust
      # （`src-tauri/src/window/mod.rs` の `bulk_rows_script`。`verification-triggers` の下にだけ
      # 存在する）がその値を**ウィンドウの初期化スクリプト**としてグローバルへ載せ、フロント
      # エンド（`src/shell/verificationBulk.ts`）が初回描画の後に**行数ごとに 1 回ずつ**
      # `invokeRaw("bulk_echo", …)` を呼ぶ。**コマンドも権限も増やしていない**（`emit` は
      # `core:default` に含まれる既存の許可の範囲）。**配布物（既定のビルド）は環境変数も
      # 初期化スクリプトも持たない**ので、一括転送は 1 件も起きない（5.4 / 7.4 の片付けと同じ規約。
      # 10.5 の段が `strings` で不在を確かめている）。
      #
      # ## 証拠の形（2 つの独立した事実を突き合わせる）
      #
      #   - **呼び出し回数**は `bulk_echo` 自身が呼び出しごとに記録する `受信バイト数 = <N>` の
      #     行数から数える（7.2 の実装。アプリの記録であって、フロントエンドの自己申告ではない）。
      #   - **送信バイト数・受信バイト数・往復のバイト一致・呼び出し回数**はフロントエンドが
      #     イベントで報告し、Rust のリスナ（`verification-triggers` の下にだけ存在する）が
      #     記録へ 1 行で写す（`一括転送の結果: {"rows":…,"sentBytes":…,"byteIdentical":true,…}`）。
      #   検査器は両者を突き合わせるので、**どちらか一方の自己申告だけでは通らない**。
      #
      # ## 主張（tasks.md 10.8 の完了状態）
      #
      #   (i) **10 万行が 1 回の呼び出しで**: 100,000 行（4,700,000 B）の転送について、
      #       `bulk_echo` の記録行がちょうど 1 行であり、送信・受信のバイト数が一致し、
      #       往復が`byteIdentical=true` であること。
      #  (ii) **呼び出し回数が行数に比例しない**: 2 つの大きさ（100 行 = 4,700 B と 100,000 行 =
      #       4,700,000 B）で**同じ定数 1** であること、かつ一覧の件数を超える余分な呼び出しが
      #       1 件も無いこと。**2 つの大きさは必須である** — 1 件では定数であることを示せない
      #       （検査器が 1 件の一覧を入力として拒否する）。
      #
      # ## 「本当に実行されたか」の錠前（空振りで緑にしない）
      #
      # 判定の前に、**要求の行**（検証用の形の Rust だけが出す）と**行数ごとの `bulk_echo` の行**と
      # **行数ごとの結果の行**の 3 つすべてを要求する。期待バイト数は `行数 × 1 行あたり 47 B` と
      # して**検査器が計算し直す**（フロントエンドの申告を信用しない）ので、期待値が 0 以下に
      # なることはない。転送が 1 件も起きなければ（引き金を読まない・起動しない・失敗した）、
      # どの段も必ず非 0 で落ちる。**この錠前そのものを各段の 2 番目の検証で実測する** —
      # 配布物（既定のビルド）に対して同じ検査を走らせ、**非 0 で落ちることを要求する**。
      #
      # ## ペイロードの大きさと 7.2 の上限（64 MiB）の関係
      #
      #   1 行 47 B であり、100,000 行 = 4,700,000 B（約 4.48 MiB）、100 行 = 4,700 B。検証用の
      #   環境変数の上限は 1,000,000 行 = 47,000,000 B（約 44.8 MiB）で、**7.2 の 64 MiB
      #   （67,108,864 B）の内側**に収まる（上限を超える入力は空の応答になるため、検証が経路の
      #   上限に当たる値を使わない）。
      #
      # ## この環境（Linux）で確認できないこと
      #
      # macOS / Windows の段は**このホストでは実行できず、CI が唯一の実行の場**である。検査器は
      # Linux / macOS で同じ POSIX sh が走り（`scripts/check-bulk-transfer.sh`。X11 に依存しない
      # ため macOS でもそのまま使える）、Windows の段は同じ主張を PowerShell で組む。
      # **macOS のプロセス起動と Windows の `Start-Process` による起動・記録の読み取りは CI だけが
      # 実測する。**
      # ---------------------------------------------------------------------

      # Linux の一括転送の検証（tasks.md 10.8）。1 回目の検証は検証用の形で 2 つの大きさ
      # （100 行と 100,000 行）を 1 回ずつ転送させ、2 回目は**配布物を渡して非 0 で落ちることを
      # 要求する**（「本当に実行されたか」の錠前の実測。FUSE に依存しないよう展開実行で起動する）。
      - name: Verify bulk transfer of a 100k-row payload (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          # 4.4 の解決（Linux はアプリケーションデータ領域の下の logs。空の XDG_DATA_HOME は
          # 未設定として $HOME へ落ちる — アプリ側の解決と同じ）。
          record="${XDG_DATA_HOME:-$HOME/.local/share}/com.jxcel.app/logs/jxcel.log"
          echo "診断記録: $record"
          # 記録は**追記式**であり、検査器は失敗時に記録の末尾 40 行を出力へダンプする。したがって
          # **出力全体を grep してはいけない** — 直前の実行（陽性）が書いた行がダンプに混ざり、
          # 前の実行の要求行で「引き金を読んでいない」判定が壊れ、前の実行の掃除行で「起動した」
          # 判定が偽に成立する（いずれも実際に起きた）。以下の判定は**各実行の直前に取った行数より
          # 後ろの行だけ**を見る（Windows の段の `$beforeNeg` と同じ規律）。
          record_lines() {
            if [ -f "$record" ]; then wc -l < "$record" | tr -d ' '; else echo 0; fi
          }
          # `<開始行数>` より後の行だけから `grep -E` の一致数を出す（記録が無ければ 0）。
          count_after() {
            if [ ! -f "$record" ]; then echo 0; return 0; fi
            tail -n "+$(( $1 + 1 ))" "$record" 2>/dev/null | grep -c -E "$2" || true
          }

          set -- target/release/bundle/appimage/*.AppImage
          appimage=$1
          echo "検証 1/2: 検証用の形で 100 行と 100,000 行を 1 回ずつ転送し、呼び出し回数が一定であることを検証する"
          before_pos=$(record_lines)
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            sh scripts/check-bulk-transfer.sh target/release/jxcel 60 "$record" 100,100000
          # 陽性の主張も**この実行が書いた行だけ**で確かめる（検査器の内部判定は起動直前の行数から
          # 始まるが、段の側でも同じ範囲を要求し、「前の段の行で満たされた」経路を塞ぐ）。
          if [ "$(count_after "$before_pos" '検証用の一括転送を要求した:')" -ne 1 ]; then
            echo "NG: 検証 1/2 で検証用の形が引き金を読んだ記録が 1 行ではありません（前の段の行では満たせない）" >&2
            exit 1
          fi
          if [ "$(count_after "$before_pos" '残留プロセスの掃除で')" -lt 1 ]; then
            echo "NG: 検証 1/2 で検証用の形が起動した形跡がありません（起動しなかった実行を成功と取り違えない）" >&2
            exit 1
          fi
          echo "検証 2/2: 反証 — 配布物（既定のビルド）は検証用の引き金を読まないので転送は起きない。検査は非 0 で落ちなければならない"
          before_neg=$(record_lines)
          rc=0
          output=$(APPIMAGE_EXTRACT_AND_RUN=1 \
            xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            sh scripts/check-bulk-transfer.sh "$appimage" 20 "$record" 100,100000 2>&1) || rc=$?
          printf '%s\n' "$output"
          if [ "$rc" -eq 0 ]; then
            echo "NG: 配布物に対して検査が成功してしまった（転送が 1 件も起きていないのに通っている）" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -q '一括転送の結果が'; then
            echo "NG: 反証が「結果の行が現れない」以外の理由で落ちた（検査器が動いていない可能性がある）" >&2
            exit 1
          fi
          # **配布物が起動していたこと**まで要求する — 起動しなかった場合も「結果が現れない」に
          # なるので、それだけでは錠前の実測にならない。**直前の行数より後**の掃除行だけを数える
          # （出力のダンプに残る前の実行の行では満たせない）。
          if [ "$(count_after "$before_neg" '残留プロセスの掃除で')" -lt 1 ]; then
            echo "NG: 反証で配布物が起動した形跡がありません（起動しなかった実行を錠前の実測と取り違えない）" >&2
            exit 1
          fi
          # **この実行が書いた行**に要求行が 1 行も無いこと（前の実行の要求行では判定しない）。
          if [ "$(count_after "$before_neg" '検証用の一括転送を要求した:')" -ne 0 ]; then
            echo "NG: 配布物が検証用の引き金を読んでいます（既定のビルドに検証用の経路が入っている）" >&2
            exit 1
          fi
          echo "反証: 期待どおり非 0 で落ちました（配布物は起動したが、検証用の引き金を読まないため転送が起きない）"
          # 展開実行（`APPIMAGE_EXTRACT_AND_RUN=1`）は AppImage のランタイムが一時ディレクトリへ
          # 展開する。検査器はプロセスを子孫ごと終了するが、ランタイムの後始末は走らないので、
          # この段が作った展開先をここで片付ける（後続の段へ持ち越さない）。
          rm -rf /tmp/appimage_extracted_* 2>/dev/null || true

      # macOS の一括転送の検証（tasks.md 10.8）。同じ POSIX sh の検査器をそのまま使う（この検査は
      # X11 に依存しない — アプリを起動し、記録の行を読むだけである）。反証は配布物（`.app` の
      # 実行ファイル）に対して行い、非 0 で落ちることを要求する。
      - name: Verify bulk transfer of a 100k-row payload (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # 4.4 の解決（macOS は $HOME/Library/Logs/{識別子}。`logs` 接尾辞は付かない）。
          record="$HOME/Library/Logs/com.jxcel.app/jxcel.log"
          echo "診断記録: $record"
          # 記録は**追記式**であり、検査器は失敗時に記録の末尾 40 行を出力へダンプする。したがって
          # **出力全体を grep してはいけない** — 直前の実行（陽性）が書いた行がダンプに混ざり、
          # 前の実行の要求行で「引き金を読んでいない」判定が壊れ、前の実行の掃除行で「起動した」
          # 判定が偽に成立する（いずれも実際に起きた）。以下の判定は**各実行の直前に取った行数より
          # 後ろの行だけ**を見る（Windows の段の `$beforeNeg` と同じ規律）。
          record_lines() {
            if [ -f "$record" ]; then wc -l < "$record" | tr -d ' '; else echo 0; fi
          }
          # `<開始行数>` より後の行だけから `grep -E` の一致数を出す（記録が無ければ 0）。
          count_after() {
            if [ ! -f "$record" ]; then echo 0; return 0; fi
            tail -n "+$(( $1 + 1 ))" "$record" 2>/dev/null | grep -c -E "$2" || true
          }

          echo "検証 1/2: 検証用の形で 100 行と 100,000 行を 1 回ずつ転送し、呼び出し回数が一定であることを検証する"
          before_pos=$(record_lines)
          sh scripts/check-bulk-transfer.sh target/release/jxcel 60 "$record" 100,100000
          # 陽性の主張も**この実行が書いた行だけ**で確かめる（検査器の内部判定は起動直前の行数から
          # 始まるが、段の側でも同じ範囲を要求し、「前の段の行で満たされた」経路を塞ぐ）。
          if [ "$(count_after "$before_pos" '検証用の一括転送を要求した:')" -ne 1 ]; then
            echo "NG: 検証 1/2 で検証用の形が引き金を読んだ記録が 1 行ではありません（前の段の行では満たせない）" >&2
            exit 1
          fi
          if [ "$(count_after "$before_pos" '残留プロセスの掃除で')" -lt 1 ]; then
            echo "NG: 検証 1/2 で検証用の形が起動した形跡がありません（起動しなかった実行を成功と取り違えない）" >&2
            exit 1
          fi
          echo "検証 2/2: 反証 — 配布物（.app）は検証用の引き金を読まないので転送は起きない。検査は非 0 で落ちなければならない"
          before_neg=$(record_lines)
          rc=0
          output=$(sh scripts/check-bulk-transfer.sh \
            target/release/bundle/macos/jxcel.app/Contents/MacOS/jxcel 20 "$record" 100,100000 2>&1) || rc=$?
          printf '%s\n' "$output"
          if [ "$rc" -eq 0 ]; then
            echo "NG: 配布物に対して検査が成功してしまった（転送が 1 件も起きていないのに通っている）" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -q '一括転送の結果が'; then
            echo "NG: 反証が「結果の行が現れない」以外の理由で落ちた（検査器が動いていない可能性がある）" >&2
            exit 1
          fi
          # **配布物が起動していたこと**まで要求する — 起動しなかった場合も「結果が現れない」に
          # なるので、それだけでは錠前の実測にならない。**直前の行数より後**の掃除行だけを数える
          # （出力のダンプに残る前の実行の行では満たせない）。
          if [ "$(count_after "$before_neg" '残留プロセスの掃除で')" -lt 1 ]; then
            echo "NG: 反証で配布物が起動した形跡がありません（起動しなかった実行を錠前の実測と取り違えない）" >&2
            exit 1
          fi
          # **この実行が書いた行**に要求行が 1 行も無いこと（前の実行の要求行では判定しない）。
          if [ "$(count_after "$before_neg" '検証用の一括転送を要求した:')" -ne 0 ]; then
            echo "NG: 配布物が検証用の引き金を読んでいます（既定のビルドに検証用の経路が入っている）" >&2
            exit 1
          fi
          echo "反証: 期待どおり非 0 で落ちました（配布物は起動したが、検証用の引き金を読まないため転送が起きない）"

      # Windows の一括転送の検証（tasks.md 10.8）。同じ 2 つの主張を PowerShell で組む
      # （起動と記録の読み取りは 10.4 / 10.5 / 10.7 と同じ手段）。配布物は **1.5 の段**（Windows の
      # ウィンドウ検証）が `/S` で導入した `%LOCALAPPDATA%\jxcel\jxcel.exe` である（10.5 以降の
      # 段は導入済みのものを消費するだけである）。
      - name: Verify bulk transfer of a 100k-row payload (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $verify = "target\release\jxcel.exe"
          $dist = Join-Path $env:LOCALAPPDATA "jxcel\jxcel.exe"
          $recordPath = Join-Path $env:LOCALAPPDATA "com.jxcel.app\logs\jxcel.log"
          if (-not (Test-Path $verify)) { throw "検証用の形が見つかりません: ${verify}（--features verification-triggers のビルドではない）" }
          if (-not (Test-Path $dist)) { throw "配布物が見つかりません: ${dist}（1.5 の段の /S 導入が先に必要）" }
          Write-Host "診断記録: $recordPath"

          # 1 行あたりのバイト数と行数の一覧（`scripts/check-bulk-transfer.sh` と同じ値。検査器は
          # フロントエンドの申告を信用せず、期待バイト数をここで計算し直す）。
          $lineBytes = 47
          $sizes = @(100, 100000)

          function Get-Lines {
            param([int]$Skip)
            if (-not (Test-Path $recordPath)) { return @() }
            $all = @(Get-Content -Path $recordPath -Encoding UTF8 -ErrorAction SilentlyContinue)
            if ($all.Count -le $Skip) { return @() }
            return $all[$Skip..($all.Count - 1)]
          }
          function Get-Count {
            param([int]$Skip, [string]$Pattern)
            return @(Get-Lines -Skip $Skip | Where-Object { $_ -match $Pattern }).Count
          }
          function Stop-App {
            param($Process)
            if ($null -eq $Process) { return }
            if (-not $Process.HasExited) { Stop-Process -Id $Process.Id -Force -ErrorAction SilentlyContinue }
            $deadline = (Get-Date).AddSeconds(10)
            while (-not $Process.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 100 }
          }

          # 1 回の起動で、行数ごとに 1 回ずつ転送させ、記録から 2 つの主張を判定する。
          function Test-Transfer {
            param([string]$Exe, [string]$Phase, [int]$TimeoutSeconds)
            $skip = 0
            if (Test-Path $recordPath) { $skip = @(Get-Content -Path $recordPath -Encoding UTF8).Count }
            $env:JXCEL_VERIFICATION_BULK_ROWS = ($sizes -join ",")
            $p = $null
            try {
              $p = Start-Process -FilePath $Exe -PassThru
            } finally {
              Remove-Item Env:\JXCEL_VERIFICATION_BULK_ROWS -ErrorAction SilentlyContinue
            }
            try {
              $deadline = (Get-Date).AddSeconds($TimeoutSeconds)
              while ((Get-Date) -lt $deadline) {
                if ((Get-Count -Skip $skip -Pattern '一括転送の結果:.*"invocations":') -ge $sizes.Count) { break }
                if ($p.HasExited) { break }
                Start-Sleep -Milliseconds 200
              }
              $observed = Get-Count -Skip $skip -Pattern '一括転送の結果:.*"invocations":'
              if ($observed -lt $sizes.Count) {
                throw "($Phase) 行数ごとの一括転送の結果が $TimeoutSeconds 秒以内に現れませんでした（観測 $observed 行。期待 $($sizes.Count) 行。転送が 1 件も起きていないか、失敗しています）"
              }
              $request = Get-Count -Skip $skip -Pattern '検証用の一括転送を要求した:'
              if ($request -ne 1) {
                throw "($Phase) 要求の行（'検証用の一括転送を要求した:'）が 1 行ではありません（観測 $request 行。検証用の形で起動していないか、環境変数が解釈されていません）"
              }
              $requestLine = @(Get-Lines -Skip $skip | Where-Object { $_ -match '検証用の一括転送を要求した:' })[0]
              Write-Host "($Phase) 要求の記録: $requestLine"
              $total = Get-Count -Skip $skip -Pattern 'jxcel::commands::bulk.*受信バイト数 = '
              if ($total -ne $sizes.Count) {
                throw "($Phase) 一括転送の呼び出しの合計が行数の件数と一致しません（観測 $total 回。期待 $($sizes.Count) 回 = 行数ごとにちょうど 1 回）"
              }
              foreach ($rows in $sizes) {
                $bytes = $rows * $lineBytes
                if ($bytes -le 0) { throw "($Phase) 行数 $rows の期待バイト数が 0 以下です（ペイロードが空である）" }
                $calls = Get-Count -Skip $skip -Pattern ("jxcel::commands::bulk.*受信バイト数 = " + $bytes + "$")
                if ($calls -ne 1) {
                  throw "($Phase) 行数 ${rows}（期待 $bytes B）の bulk_echo の記録行が 1 行ではありません（観測 $calls 行。1 回の呼び出しで受け渡せていないか、重複しています）"
                }
                $results = @(Get-Lines -Skip $skip | Where-Object {
                  $_ -match ('"rows":' + $rows + '[,}]') -and
                  $_ -match ('"sentBytes":' + $bytes + '[,}]') -and
                  $_ -match ('"receivedBytes":' + $bytes + '[,}]') -and
                  $_ -match '"byteIdentical":true' -and
                  $_ -match '"invocations":1[,}]'
                })
                if ($results.Count -ne 1) {
                  throw "($Phase) 行数 ${rows}（期待 $bytes B）の一括転送の結果が 1 行ではありません（観測 $($results.Count) 行。送信・受信のバイト数・バイト一致・呼び出し回数 1 のいずれかが期待と一致しません）"
                }
                Write-Host "($Phase) 行数=$rows 呼び出し回数=1 期待バイト数=$bytes / $($results[0])"
              }
              Write-Host "($Phase) OK: 行数の一覧（$($sizes -join ',')）のすべてで、1 回の呼び出しがちょうど 1 行であり、往復のバイト数が一致した"
              Write-Host "($Phase) OK: 呼び出し回数は行数によらず定数 1 である（合計 $total 回 = 行数の件数 $($sizes.Count) 件。行数に比例しない）"
            } finally {
              Stop-App $p
            }
          }

          Write-Host "検証 1/2: 検証用の形で 100 行と 100,000 行を 1 回ずつ転送し、呼び出し回数が一定であることを検証する"
          Test-Transfer -Exe $verify -Phase "検証 1/2" -TimeoutSeconds 60
          Write-Host "検証 2/2: 反証 — 配布物（既定のビルド）は検証用の引き金を読まないので転送は起きない。検査は失敗しなければならない"
          $beforeNeg = 0
          if (Test-Path $recordPath) { $beforeNeg = @(Get-Content -Path $recordPath -Encoding UTF8).Count }
          $failed = $false
          try {
            Test-Transfer -Exe $dist -Phase "検証 2/2" -TimeoutSeconds 20
          } catch {
            $failed = $true
            Write-Host "反証: 期待どおり失敗しました: $($_.Exception.Message)"
          }
          if (-not $failed) {
            throw "NG: 配布物に対して検査が成功してしまった（転送が 1 件も起きていないのに通っている）"
          }
          # **配布物が起動していたこと**まで要求する — 起動しなかった場合も「結果が現れない」に
          # なるので、それだけでは錠前の実測にならない（起動行が記録にあることを確かめる）。
          if ((Get-Count -Skip $beforeNeg -Pattern '残留プロセスの掃除で') -lt 1) {
            throw "NG: 反証で配布物が起動した形跡がありません（起動しなかった実行を錠前の実測と取り違えない）"
          }
          if ((Get-Count -Skip $beforeNeg -Pattern '検証用の一括転送を要求した:') -ne 0) {
            throw "NG: 配布物が検証用の引き金を読んでいます（既定のビルドに検証用の経路が入っている）"
          }
          Write-Host "反証: 配布物（既定のビルド）は起動したが、検証用の引き金を読まないため転送が 1 件も起きず検査が失敗することを確認した"

      # ---------------------------------------------------------------------
      # 配布物の検証（tasks.md 10.2 / 要件 6.4, 6.5, 6.6）
      #
      # 生成した配布物から補助プロセスの実行ファイルを取り出し、起動できることを確かめ、
      # 同梱前の原本とバイト一致することを確かめ、サイズを出力に記録する。
      #
      # **これはバンドル処理が同梱した実行ファイルを書き換える既知の問題に対する恒久的な
      # 検出器である。**Linux の標準の同梱機構（`externalBin`）は `usr/bin` 配下の ELF を
      # 無条件に書き換える（tauri-apps/tauri#5189）。1.7 はそれを避けて `usr/share/jxcel/`
      # へ置く決定をした。その回避配置が破れた日に、静かにではなく明確に落ちるのがこの段である。
      #
      # 検査本体は POSIX sh の `scripts/check-sidecar-integrity.sh`（3 OS で同じものを使う）。
      # 終了コードは 0 = 検証成功 / 1 = 検証失敗（不一致・実行権限の欠落・起動不能・配布物内に
      # 不在）/ 2 = 入力が使えない（配布物・原本・ホストのトリプルが解決できない）。非 0 は
      # そのままパイプラインの失敗になる（無言で通る経路は無い）。
      #   - 比較  : `cmp` による直接のバイト比較を判定に使う。両者の sha256 も表示するので、
      #             不一致は両方のパスと両方のダイジェストつきで診断できる。**この比較は
      #             3 OS で共有の 1 実装であり、macOS / Windows も同じ失敗の仕方をする。**
      #   - 起動  : 取り出した実行ファイルを起動し、`crates/sidecar-smoke`（1.6）が `--idle` で
      #             出す `sidecar-smoke ready pid=<識別子> mode=idle` の起動行が現れることを
      #             確かめる。**バイト一致だけでは足りない**（一致していても起動できるとは限らない）。
      #   - サイズ: 配布物と取り出した実行ファイルのバイト数を出力する（要件 6.6）。macOS の
      #             dmg と Windows の NSIS インストーラは検証対象そのものではない配布物なので、
      #             各段で別に記録する。
      #
      # 取り出し方は配布物の形式ごとに分ける:
      #   - Linux  : AppImage は `--appimage-extract`（バンドル済みの実行ファイルを起動せずに
      #              取り出す。FUSE を要さない。`APPIMAGE_EXTRACT_AND_RUN` は展開実行＝起動の
      #              ための経路であり、取り出しには使えない）。deb は `dpkg-deb -x`。
      #              **AppImage と deb の両方を検証する** — 8.1 が `bundle.linux.deb.files` を
      #              足したため、どちらも 5.1 の「配布物」である。片方だけでは deb の同梱が
      #              無検査になる。どちらも `usr/share/jxcel/sidecar-smoke` に置かれる。
      #   - macOS  : バンドル済みの `.app` の中（`Contents/MacOS/sidecar-smoke`）。`externalBin`
      #              のトリプル接尾辞はバンドル時に外れる（1.7）。macOS では bundler が外部
      #              バイナリを**必ず再署名する**（tauri-bundler 2.9.4 の macos/app.rs:99-105 が
      #              外部バイナリを `SignTarget{is_an_executable:true}` として署名対象に入れ、
      #              macos/sign.rs:46-73 と tauri-macos-sign 2.3.4 の keychain.rs:207-249 が
      #              `codesign --force -s - --options runtime` を実行する。`hardenedRuntime` の
      #              既定は true: tauri-utils 2.9.3 src/config.rs:682。entitlements は未設定なので
      #              渡されない: 同 config.rs:684）。**その再署名がバイトを変えないのは、staging の
      #              時点で原本を同じ条件で事前署名してあるからである** — `scripts/stage-sidecars.sh`
      #              が、識別子が署名対象のファイル名から導かれること（Apple Security
      #              signer.cpp:158-175）に合わせて、同梱名 `sidecar-smoke` と同じベース名の
      #              一時コピーに `codesign --force -s - --options runtime` を掛けてから配置する。
      #              これにより 6.5 のバイト比較が成立し、3.1 の実行時の整合性検査（期待値は
      #              事前署名済みの原本から算出される。`crates/app-shell/build.rs`）も macOS で
      #              成立する。**この一致を実測できるのはこの段だけ**（CI が唯一の確認の場で
      #              あり、staging 側はコードで機構を固定している）。検査は緩めない
      #              （要件 6.5 は無条件である）。
      #              なお `.app` 自体の署名（app.rs:122-132）は同梱済みの副実行ファイルの
      #              バイトを書き換えない（入れ子の署名は外側から内側の順に付き、既に署名済みの
      #              入れ子は再署名されない）。
      #   - Windows: NSIS インストーラを `/S` で導入した先（`%LOCALAPPDATA%\jxcel`。既定の
      #              installMode は `currentUser`）。**導入は直前の「Verify bundle opens a
      #              window (Windows)」が済ませているので、この段は導入を繰り返さない。**
      #              サイドカーは実行ファイルの隣にトリプル接尾辞を外して置かれる（8.1）。
      #
      # macOS と Windows の段はこの環境（Linux）では実行できず、静的評価のみである。
      # 抽出・比較・起動の検査は 3 OS で同じスクリプトが走るので、CI が実測する。
      # ---------------------------------------------------------------------

      - name: Verify bundled sidecar (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          # グロブが一致しなければリテラルのまま残り、検査が入力の不在として 2 で落ちる。
          set -- target/release/bundle/appimage/*.AppImage
          appimage=$1
          set -- target/release/bundle/deb/*.deb
          deb=$1
          bash scripts/check-sidecar-integrity.sh "$appimage" usr/share/jxcel/sidecar-smoke
          bash scripts/check-sidecar-integrity.sh "$deb" usr/share/jxcel/sidecar-smoke

      - name: Verify bundled sidecar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          for dmg in target/release/bundle/dmg/*.dmg; do
            echo "配布物 (dmg) のサイズ: ${dmg}: $(wc -c < "$dmg") バイト"
          done
          bash scripts/check-sidecar-integrity.sh \
            target/release/bundle/macos/jxcel.app \
            Contents/MacOS/sidecar-smoke

      - name: Verify bundled sidecar (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          if [ -z "${LOCALAPPDATA:-}" ]; then
            echo "NG: LOCALAPPDATA が設定されていません" >&2
            exit 2
          fi
          for setup in target/release/bundle/nsis/*-setup.exe; do
            echo "配布物 (NSIS インストーラ) のサイズ: ${setup}: $(wc -c < "$setup") バイト"
          done
          # 既定の installMode は currentUser なので導入先は %LOCALAPPDATA%\jxcel である
          # （直前の段が /S で導入済み）。Git Bash の bash からは `$LOCALAPPDATA` がそのまま
          # 見え、MSYS のランタイムは `\` と `/` のどちらの区切りも受け付ける。
          bash scripts/check-sidecar-integrity.sh "${LOCALAPPDATA}/jxcel" sidecar-smoke.exe

      # ---------------------------------------------------------------------
      # 生成の失敗の提示・異常終了の記録・描画不成立の提示（要件 2.10 / 8.2 / 10.2）
      #
      # **Linux の段だけを足す。**3 つの主張はいずれも X11 のウィンドウ観測（または
      # ウィンドウの画素の読み取り）を要し、`xwininfo` と `libX11` を使うためである。
      # 検査本体は POSIX sh の
      # `scripts/check-window-failure.sh` / `scripts/check-crash-record.sh` /
      # `scripts/check-no-paint.sh`（ローカルでも同じものを実行できる）。
      #
      # 実測する形は tasks.md の片付けの規約どおりに分ける:
      #   - 検証専用の引き金（`fail-window:<ms>` / `panic:<ms>` /
      #     `JXCEL_VERIFICATION_SUPPRESS_HEARTBEAT=1`）を読むのは**検証用の形**だけである
      #     （10.4 の段が `JXCEL_VERIFICATION_BUILD=1 npx tauri build --no-bundle --features
      #     verification-triggers` で作った `target/release/jxcel`）。
      #   - **配布物（AppImage）は同じ環境変数を無視する。**これが負の対照である —
      #     「検査が存在しない経路を通っていない」ことと「記録が引き金の起こした出来事のもの
      #     である」ことを示す（常に成功する検査器では段が緑にならない）。
      #
      # ## 位置（この節を最後に置く理由）
      #
      # 3 つの検査はどれも**アプリの状態を変える**（8.3 の印を立てる・パニックでプロセスを
      # 終わらせる）。**この節より前の段が測るもの**（10.4 の初回描画、10.5 の複数ウィンドウ、
      # 10.6 のメニュー、10.7 / 10.8）に影響しないよう、段落の最後（成果物の保存の直前）に
      # 置く。とくに `render.fallback` の印は**次の起動の描画経路を変える**ので、描画を測る段
      # より後に置かなければならない。
      #
      # ## 各段が何を証明し、何を証明しないか
      #
      #   - 2.10: 生成の失敗が**提示され**（診断の保存先の 1 件の記録 `jxcel-window-error.log`。
      #     失敗したラベル・対象のドキュメント・理由を名指しする）、既に開いているウィンドウの
      #     動作を中断させない（同じ識別子のまま残り、失敗の後でも引き継ぎで開いた新しい
      #     ウィンドウが**描画まで成立する**）。
      #     **可視のダイアログは検証しない**（実装に無い。理由は
      #     `lifecycle::persist_window_failure` の doc にある）。
      #   - 8.2: 意図的なパニックで**異常終了の記録**（`jxcel-crash.log`）が残り、記録が
      #     パニックを握り潰さず、そのあとの起動が通常に成立して終了コード 0 で終わる。
      #   - 10.2: 期限超過が**記録され**（`初回描画が成立しなかった: … 期限=3000 ms`）、
      #     ネイティブの題名が変わり、**全画面の注意書きが描かれ**（画素を読んで確かめる）、
      #     8.3 の印が立ち、アプリは終了コード 0 まで動作を続ける。
      #     **この 3 つはいずれも tasks.md の完了状態の記述が要求していたものであり、
      #     これまで実測する段が無かった**（8.2 の `panic:<ms>` と 10.2 の抑止の引き金は
      #     実装されているのに駆動されていなかった）。
      # ---------------------------------------------------------------------

      # 2.10（生成の失敗の提示と隔離）。検査器は**配布物を入力として拒む**（引き金が無い）ので、
      # 段は配布物を渡して exit 2 を確かめる（負の対照）。10.7 の「検証用でない形は exit 2」と
      # 同じ判断である。
      - name: Verify a failed window creation is presented and isolated (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          # 4.4 の解決（Linux はアプリケーションデータ領域の下の logs）。
          record="${XDG_DATA_HOME:-$HOME/.local/share}/com.jxcel.app/logs/jxcel.log"
          echo "診断記録: $record"
          document="$RUNNER_TEMP/jxcel-2-10-document.txt"
          # 7.7 は位置を読まないが、渡す位置は実在させる（検査側も実在を要求する）。
          printf 'jxcel 2.10 の検証で開くドキュメント（内容は読まれない。tasks.md 7.7）\n' > "$document"
          echo "検証: 検証用の形を fail-window:<ms> で起動し、失敗の提示と隔離を確かめる"
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            sh scripts/check-window-failure.sh \
              target/release/jxcel jxcel "$record" "$document" 60 100 100
          set -- target/release/bundle/appimage/*.AppImage
          appimage=$1
          echo "反証: 配布物を渡すと検査器が引き金の不在で exit 2 になることを確かめる"
          rc=0
          # **反証も仮想ディスプレイの下で走らせる。** 検査器は実行ファイルの引き金を読む前に
          # 環境（`xwininfo` と `DISPLAY`）を確かめて exit 2 で落ちるので、ディスプレイ無しで
          # 呼ぶと「引き金の不在」ではなく「DISPLAY 不在」で落ち、対照が成立しない
          # （実測: 2026-09-12 の Linux のランナー）。
          output=$(xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            sh scripts/check-window-failure.sh \
            "$appimage" jxcel "$record" "$document" 60 100 100 2>&1) || rc=$?
          printf '%s\n' "$output" | tail -n 3
          if [ "$rc" -eq 0 ]; then
            echo "NG: 引き金を持たない配布物で検査が成功してしまった（検査が引き金を本当に見ていない）" >&2
            exit 1
          fi
          if [ "$rc" -ne 2 ]; then
            echo "NG: 配布物の対照が exit 2（入力が使えない）ではありません: ${rc}" >&2
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -q "引き金 'fail-window' がありません"; then
            echo "NG: 配布物の対照が「引き金の不在」以外の理由で落ちた（検査器が動いていない可能性がある）" >&2
            exit 1
          fi
          echo "反証: 期待どおり exit 2 で落ちました（配布物には引き金が無い）"

      # 8.2（異常終了の記録）。検証用の形で意図的なパニックを起こし、記録の契約・記録が
      # パニックを握り潰していないこと・そのあとの起動が壊れていないことを要求する。
      # **配布物を同じ環境変数で起動する負の対照は、この節の最後の段**（配布物の対照）が行う。
      - name: Verify a crash record is written for a real panic (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          logs="${XDG_DATA_HOME:-$HOME/.local/share}/com.jxcel.app/logs"
          record="$logs/jxcel.log"
          crash="$logs/jxcel-crash.log"
          echo "診断記録: $record"
          echo "異常終了の記録: $crash"
          echo "検証: 検証用の形を panic:<ms> で起動し、異常終了の記録とそのあとの起動を確かめる"
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            sh scripts/check-crash-record.sh \
              target/release/jxcel jxcel "$record" "$crash" panic 60 100 100

      # 10.2（描画不成立の提示）。抑止した検証用の形で期限超過の経路を起こし、記録・題名・
      # **全画面の注意書き（画素）**・8.3 の印・通常終了を要求する。
      # **この段は 8.3 の印（`render.fallback`）を立てる**ので、描画を測る段（10.4）より後に
      # 置く（印は次の起動の描画経路を変える）。
      - name: Verify the no-paint presentation (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          logs="${XDG_DATA_HOME:-$HOME/.local/share}/com.jxcel.app/logs"
          record="$logs/jxcel.log"
          echo "診断記録: $record"
          echo "検証: 検証用の形を JXCEL_VERIFICATION_SUPPRESS_HEARTBEAT=1 で起動し、期限超過の提示を確かめる"
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            sh scripts/check-no-paint.sh target/release/jxcel jxcel "$record" suppressed 60 100 100

      # ---------------------------------------------------------------------
      # 配布物の負の対照（既定のビルドは検証専用の引き金を読まない）
      #
      # **この段を最後に置く理由**: 配布物（AppImage）の起動では、配布物の起動ラッパーが本体を
      # 切り離すため（実測: 起動した pid の子ではなくなる）、検査器の後始末が本体に届かない。
      # CI では各段を `xvfb-run` が包むので**仮想ディスプレイの終了が本体を終わらせる**が、
      # その終了を待たずに次の起動が始まると単一インスタンスの機構に引き継がれうる。したがって
      # 配布物を起動する段は**最後にまとめ**、後続の段（成果物の保存）に影響しないようにする。
      #
      # 確かめるのは 2 つである（いずれも「**存在しない経路を通っていない**」ことの反証）:
      #   - 8.2: `panic:<ms>` を渡した配布物が**終了せず、異常終了の記録も残さない**
      #     （これが無いと、記録が「引き金の起こしたパニック」のものであることを言えない）
      #   - 10.2: 抑止の環境変数を渡した配布物が**抑止されず**（成立行が出て題名も変わらず、
      #     注意書きの赤が画面を覆わない）、期限超過の経路に入らない
      # ---------------------------------------------------------------------

      - name: Verify the shipping bundle ignores the verification triggers (Linux / Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          logs="${XDG_DATA_HOME:-$HOME/.local/share}/com.jxcel.app/logs"
          record="$logs/jxcel.log"
          crash="$logs/jxcel-crash.log"
          echo "診断記録: $record"
          set -- target/release/bundle/appimage/*.AppImage
          appimage=$1
          # 展開先を変えた後（`cd` の後）でも同じファイルを指せるよう絶対パスにする。
          appimage=$(CDPATH='' cd -- "$(dirname -- "$appimage")" && pwd)/$(basename -- "$appimage")
          echo "反証 1/2: 配布物を panic:<ms> で起動する（引き金は無視されなければならない）"
          if ! xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            sh scripts/check-crash-record.sh \
              "$appimage" jxcel "$record" "$crash" ignored 60 100 100; then
            echo "FUSE 経由で配布物を起動できなかったため、APPIMAGE_EXTRACT_AND_RUN=1 で再試行します" >&2
            export APPIMAGE_EXTRACT_AND_RUN=1
            xvfb-run -a --server-args="-screen 0 1280x1024x24" \
              sh scripts/check-crash-record.sh \
                "$appimage" jxcel "$record" "$crash" ignored 60 100 100
          fi
          echo "反証 2/2: 配布物を JXCEL_VERIFICATION_SUPPRESS_HEARTBEAT=1 で起動する（抑止されない）"
          if ! xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            sh scripts/check-no-paint.sh "$appimage" jxcel "$record" ignored 60 100 100; then
            echo "FUSE 経由で配布物を起動できなかったため、APPIMAGE_EXTRACT_AND_RUN=1 で再試行します" >&2
            export APPIMAGE_EXTRACT_AND_RUN=1
            xvfb-run -a --server-args="-screen 0 1280x1024x24" \
              sh scripts/check-no-paint.sh "$appimage" jxcel "$record" ignored 60 100 100
          fi

      # 成果物の保存（要件 6.7）。名前は `jxcel-bundle-<runner os>` で安定させ、1 回の
      # 実行で 3 プラットフォーム分を取得できるようにする。`if-no-files-found: error`
      # により、バンドルが生成されていなければこの段でパイプラインを落とす。
      # 失敗した段があっても成果物を取得できるよう `if: !cancelled()` を付ける。
      # 注意: GitHub の成果物はファイルの実行権限を保持しない。ダウンロードした
      # AppImage / `.app` を実行する場合は権限の復元（`chmod +x` など）が必要である。
      - name: Upload platform bundles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jxcel-bundle-${{ matrix.os }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  audit:
    name: Security audit (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master (2026-09-03)
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # ゲート厳守: cargo audit が非 0 で終わったらここでパイプラインを落とす。
      # Tauri の依存集合は本スペックで最もゲートに触れやすい（要件 6.3）。
      # 勧告が出た場合も ignore リストを追加して隠さない。
      - name: cargo audit
        run: cargo audit

      - name: zip floor check (>= 2.3.0)
        run: bash scripts/check-zip-floor.sh Cargo.lock
