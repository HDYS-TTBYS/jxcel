# jxcel Cargo workspace
#
# 依存ポリシー（.kiro/steering/structure.md 準拠）:
# - **ドメインクレート（`crates/*`）は tauri への依存を一切持たないこと**（推移的依存も含む）。
#   これは「エンジンと UI の分離」を依存グラフで強制する規則であり、ドメインのテストに
#   GUI の起動が必要になった時点で層が壊れている、という判定基準（structure.md）に対応する。
#   適用範囲は `crates/` 配下のドメインクレートに限る。`src-tauri/` は Tauri に接続する
#   アダプタクレートであり、`tauri` / `tauri-build` を持つことが役割そのものであるため、
#   本規則の対象外とする（design.md「Allowed Dependencies」）。
# - 兄弟の jxcel ドメインクレートへの依存は**一方向**に限ること。`document-format` は
#   依存グラフの最下層（ルートクレート）であり、**下流のドメインクレートはこれに依存して
#   よい**（正典は `crates/document-format/Cargo.toml` の注記。例:
#   `schema-engine → document-format`）。逆に `document-format` から下流のドメインクレート
#   への依存は不可である。GUI を持たないドメインクレート同士は、この向きを守る限り
#   依存してよい。
[workspace]
resolver = "2"
members = [
    "crates/document-format",
    "crates/schema-engine",
    "crates/app-shell",
    "crates/document-session",
    "crates/data-grid",
    "crates/sidecar-smoke",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
